제 데이터 연동 없이 테스트 코드로만 동작합니다.":"The anomaly alarm (sensor anomaly) has a toggle on screen but runs only on test code without real data.","이전 품목 잔여물 제거":"Previous item residue removed","이전요청수량":"Previous request qty","인수량":"Received qty","인시생산성":"Labor productivity","인시생산성·목표 달성률":"Labor Productivity & Target Achievement","인원":"Headcount","인원부족":"Staff shortage","일":"Day","일련번호":"Serial no.","일련번호를 누르면 기록서 상세 창이 열려 내용을 확인하거나 권한에 맞게 수정합니다.":"Click a serial number to open the record detail and view it or edit it according to your rights.","일련번호를 누르면 기록서를 엽니다":"Click a serial number to open the record","일련번호를 눌러 기록서 상세 창에서 내용을 확인하거나, 본인이 작성 중인 기록서·관리자 권한 기록서를 수정합니다.":"Click a serial number to view the record in the detail window, or edit your own in-progress records and admin-rights records.","일시 정지":"Paused","일자":"Date","일자 범위(기본: 최근 7일)를 지정하고 작업반과 작업장을 선택합니다.":"Set the date range (default: last 7 days) and choose team and workstation.","임시저장 시에도 LOT 1차는 필수입니다. 입력초기화는 내용량 검사 값만 모두 지우며 되돌릴 수 없고, 행 단위 초기화는 실행 취소가 가능합니다.":"LOT 1 is required even for draft save. Reset Inputs clears only the fill weight values and cannot be undone; row-level reset can be undone.","임시저장으로 중간 저장하고 입력이 끝나면 완료 버튼으로 작성자 승인을 처리합니다.":"Save drafts along the way, and when input is done approve as writer with Complete.","임시저장으로 중간 저장하고, 모든 항목이 완료되면 완료 버튼으로 작성자 승인까지 처리합니다.":"Save drafts along the way, and when all items are done, use Complete to also approve as writer.","입고":"Receipt","입고 받은 행의 입고확인 체크박스를 선택합니다.":"Tick the Confirm Receipt checkbox on received rows.","입고수량":"Received qty","입고의뢰수량":"Receipt request qty","입고일":"Receipt date","입고처":"Receiving location","입고처와 공장은 필수이며, 입고처에 물류창고(2000)가 포함되면 처리할 수 없습니다.":"Receiving location and plant are required; requests that include the logistics warehouse (2000) cannot be processed.","입고확인":"Confirm receipt","입고확인 대상":"To confirm","입력초기화":"Reset inputs","자동집계된 생산수량을 확인하고 양품·입고의뢰·QC 관리품 수량을 입력하며, 불량은 '불량등록'으로 입력합니다.":"Check the auto-aggregated output, enter good, receipt request and QC-controlled quantities, and enter defects with 'Register Defects'.","자재관리":"Material Management","자재관리번호":"Material control no.","자재대기":"Waiting for material","자재를 선택하세요.":"Please select a material.","자재별 사용파손·원천불량·수량부족 수량과 특이사항을 입력하고 BULK 자재는 관리번호를 선택합니다.":"Enter breakage, source defects, shortages and remarks per material, and select a control no. for BULK materials.","자재예약 (창고 추가청구,작업반간 자재예약)":"Material Reservation (extra warehouse request, inter-team)","자재유형":"Material type","자재입고확인 (창고→작업반)":"Material Receipt Confirmation (Warehouse → Team)","자재출고 (현장창고)":"Material Issue (Floor Store)","자재코드":"Material code","자재투입내역":"Material input","자재환입 (작업반→창고)":"Material Return (Team → Warehouse)","작성":"Write","작성 대상 지시 선택":"Select order to record","작성 아이콘은 '작성자' 권한 보유자에게만 표시됩니다. 기록서 목록 창에서 이미 작성완료된 종류는 음영으로 표시됩니다.":"The write icon is shown only to users with 'Writer' rights. Types already completed are shaded in the record list.","작성 아이콘은 기록서 권한 관리에서 '작성자' 권한을 받은 사용자에게만 표시되며, 조회 대상도 본인에게 권한이 있는 작업장으로 한정됩니다.":"The write icon is shown only to users given 'Writer' rights in Record Permission Management, and lookups are limited to workstations you have rights to.","작성된 공정검사 기록서를 검사일·작업반·종류·승인상태로 조회하고 승인/승인취소와 출력을 처리합니다. 일련번호를 눌러 기록서를 열람하거나 권한에 따라 수정합니다.":"Looks up written in-process inspection records by inspection date, team, type and approval status and handles approve/cancel approval and printing. Click a serial number to open a record or edit it according to your rights.","작성된 충포장 기록서를 검사일·작업반 기준으로 조회하고 결재(승인/승인취소)와 출력을 처리합니다. 일련번호를 눌러 기록서를 열람하거나 권한에 따라 수정·확인할 수 있습니다.":"Looks up written filling/packing records by inspection date and team and handles approval (approve/cancel) and printing. Click a serial number to open a record or edit/check it according to your rights.","작성완료":"Completed","작성완료된 기록서가 있는 지시는 흐리게 표시됩니다":"Orders with completed records are dimmed","작성할 행의 작성 아이콘을 누르면 기록서 목록 창이 열립니다.":"Press the write icon on a row to open the record list.","작성할 행의 작성 아이콘을 누르면 충포장 기록서 작성 화면으로 전환됩니다.":"Press the write icon on a row to switch to the filling/packing record entry screen.","작업 1건":"1 job","작업 전 확인사항 / 기능 확인사항":"Pre-work checks / Function checks","작업 전 확인사항과 기능 확인사항의 각 절차에 작업자 확인을 체크하고, 해당 없는 항목은 비고 (N/A)를 체크합니다. 헤더 체크박스로 일괄 확인할 수 있습니다.":"Tick operator confirmation for each step of the pre-work and function checks, and tick N/A for items that do not apply. The header checkbox confirms all at once.","작업 정보":"Job info","작업 준비":"Preparing","작업 중 'LOT 실적'으로 LOT 생산실적을 등록하고, 필요 시 '작업중단'으로 중단시간·인원을 저장합니다.":"During the job register LOT production results with 'LOT Results', and if needed save stop time and crew with 'Stop'.","작업 중인 설비와 중단된 작업, 결재가 필요한 기록서를 먼저 확인하세요.":"Check running machines, stopped jobs and records needing approval first.","작업 중인 지시의 LOT 단위 생산실적을 등록하는 팝업입니다. 작업시작·종료 시각, 작업인원, 생산성구분자, 생산일자·사용기한, 생산수량(자동집계)·양품·입고의뢰·QC 관리품·불량수량, 유실공수와 자재투입내역을 입력해 저장합니다.":"Popup to register LOT production results for the order in progress. Enter start/end time, crew, productivity classifier, production/expiry date, output (auto-aggregated), good, receipt request, QC-controlled and defect quantities, lost labor and material input, then save.","작업 화면에서 'LOT 실적' 버튼을 눌러 팝업을 엽니다.":"Press 'LOT Results' on the job screen to open the popup.","작업 화면에서 'POP표기설정' 버튼을 누릅니다.":"Press 'POP Display Settings' on the job screen.","작업경과":"Elapsed","작업노즐":"Working nozzle","작업반":"Team","작업반 / 작업장":"Team / Workstation","작업반 목록은 가동률 데이터가 연동된 일부 작업반으로 제한되어 표시됩니다.":"The team list is limited to teams with linked availability data.","작업반 선택":"Select team","작업반 선택 박스의 안내 문구가 '진행 상태 선택'으로 표시되지만 실제로는 작업반 목록입니다.":"The team select box placeholder reads 'Select progress status', but it is actually the team list.","작업반 전체수율 선 차트에서 기간별 평균 수율(%) 추이를 확인합니다.":"Check the average yield (%) trend by period in the team yield line chart.","작업반(라인)별 비가동률":"Downtime Rate by Team (Line)","작업반(필수)과 작업장, 진행상태 등 조건을 입력합니다.":"Enter conditions such as team (required), workstation and progress status.","작업반(현장)에 남은 자재를 창고로 되돌리는 환입 예약을 생성합니다. 출고처(작업반)의 환입 가능 재고를 조회해 환입수량을 입력하고 저장하면 ERP에 예약이 생성되어 예약번호가 표시됩니다.":"Creates return reservations to send materials left at the team (floor) back to the warehouse. Look up returnable stock at the issue location (team), enter return qty and save to create an ERP reservation and show its number.","작업반/작업장명 검색":"Search team/workstation","작업반·기간별 벌크 수율 데이터를 조회해 수율 추이와 수율 구간별 품목수 분포를 보여 줍니다. 유형별 평균 벌크 수율을 게이지 차트로 비교할 수 있습니다.":"Looks up bulk yield by team and period and shows the yield trend and item distribution by yield band. Average bulk yield by type can be compared in gauge charts.","작업반·생산 유형·기간별 충전/포장 생산실적을 집계해 보여 줍니다. 총 생산량, 라인 가동 대수, 지시 대비 생산실적 달성률과 생산량 추이, 유형별 생산량 점유율을 확인할 수 있습니다.":"Aggregates filling/packing results by team, production type and period. See total output, running lines, achievement vs. orders, output trend and output share by type.","작업반·작업장을 선택해 해당 라인의 현재 작업 정보를 확인하고, 현장 모니터용 전체화면 POP 화면을 띄우는 화면입니다. 지시번호·제품·지시/생산수량과 작업시간이 1초 단위로 갱신됩니다.":"Choose a team and workstation to see the line's current job, and launch the full-screen POP for the shop-floor monitor. Order no., product, order/output qty and work time update every second.","작업반·작업장을 선택해 해당 설비의 현재 작업지시 정보, 벌크 검사 규격, 설비 진척률, 설비 센서값을 실시간으로 확인하는 화면입니다. 센서값은 1초 주기로 갱신되며 허용값 기준 정상/이상 여부가 함께 표시됩니다.":"Choose a team and workstation to see the machine's current work order, bulk inspection specs, progress and sensor values in real time. Sensor values refresh every second with normal/abnormal status against allowed values.","작업반과 기간을 선택하면 자동으로 조회됩니다.":"Selecting a team and period loads the data automatically.","작업반과 기간을 선택해 인시생산성(양품수량×60 ÷ 작업분)과 목표 대비 달성률을 차트로 분석합니다. 전체·유형별·라인별 인시생산성을 단계적으로 보여 주며, 분기별 목표생산성을 설정할 수 있습니다.":"Analyzes labor productivity (good qty × 60 ÷ work minutes) and achievement vs. target by team and period. Shows overall, by-type and by-line productivity step by step, and quarterly targets can be set.","작업반과 기간이 모두 선택되어야 조회되며, 조회 전에는 다운로드 버튼이 비활성화됩니다.":"Data loads only when both team and period are selected; the download button stays disabled until then.","작업반과 생산 유형(전체 또는 개별 유형), 기간을 선택하면 자동으로 조회됩니다.":"Selecting team, production type (all or one) and period loads the data automatically.","작업반명":"Team name","작업반별 OEE 순위":"OEE Ranking by Team","작업반별 생산량":"Output by Team","작업반별 설비가동률 영역에서 설비별 가동률 도넛과 설비가동시간, 생산성 구분자를 확인합니다.":"In the team availability area, check the availability donut, run time and productivity classifier per machine.","작업반별 작업장(설비) 목록을 조회하고 코드·작업장명·통계용구분·공정·생산성 구분자를 수정합니다. 선택한 작업장의 센서(OPC UA 노드)와 노즐을 탭으로 나누어 추가·수정·제거합니다.":"Lists workstations (equipment) per team and edits code, name, statistics group, process and productivity classifier. Add, edit and remove the selected workstation's sensors (OPC UA nodes) and nozzles in separate tabs.","작업반별 진척율":"Progress by Team","작업반은 필수이며 미선택 시 '작업반을 선택해주세요.'가 표시됩니다. 진행상태를 비우면 모든 상태가 조회됩니다.":"Team is required; without it 'Please select a team.' is shown. Leave progress status empty to show all statuses.","작업반을 선택하고 일/주/월/년 기간 유형과 기간을 지정하면 자동으로 조회됩니다.":"Select a team and set the day/week/month/year period type and period to load automatically.","작업반을 선택하지 않고 검색하면 '작업반을 선택해주세요.' 경고가 표시됩니다.":"Searching without a team shows 'Please select a team.'","작업반을 선택해 주세요.":"Please select a team.","작업반이 창고에 자재를 추가 청구하거나 다른 작업반의 자재를 요청할 때 사용하는 예약 화면입니다. 출고처의 정상재고·품질검사재고·예약중재고를 확인하고 요청수량을 입력해 저장하면 ERP에 자재 예약이 생성됩니다.":"Reservation screen a team uses to request extra materials from the warehouse or from another team. Check normal, QC and reserved stock at the issue location, enter request qty and save to create an ERP material reservation.","작업반재고":"Team stock","작업배정목록":"Work Assignment List","작업배정목록(C00007)과 작업완료관리(C00024)에서도 같은 팝업을 사용합니다.":"The same popup is used in Work Assignment List (C00007) and Completed Work Management (C00024).","작업상태":"Job status","작업상태관리":"Job status management","작업상태관리에서 작업완료취소/실적수정/실적수정완료 중 하나를 고르고 '적용'을 누릅니다.":"In job status management choose Cancel Completion / Edit Results / Finish Editing and press 'Apply'.","작업상태는 작업 준비/정상 작업 중/일시 정지/유휴 설비로 표시됩니다.":"Job status is shown as preparing / running normally / paused / idle.","작업상태를 적용했습니다.":"Applied the job status.","작업시간":"Work time","작업시간(분)":"Work time (min)","작업시작":"Start","작업시작·작업종료 시각과 작업인원, 생산성구분자, 생산일자·사용기한을 입력합니다.":"Enter start/end time, crew, productivity classifier and production/expiry date.","작업시작일시":"Job start time","작업완료":"Complete","작업완료 버튼은 작업완료 체크박스를 선택해야 활성화됩니다.":"The Complete button is enabled only when the Complete checkbox is ticked.","작업완료 행의 '추가자재 등록' 아이콘으로 추가자재 사용실적을 등록하거나 '추가자재 조회'로 확인합니다.":"Register additional material usage with the 'Register Additional Material' icon on completed rows or check it with 'Additional Material Inquiry'.","작업완료(S050) 상태의 지시 실적만 조회되며, 카운터기 그룹은 그래프 대상에서 제외됩니다.":"Only results of orders in Completed (S050) status are shown; counter groups are excluded from graphs.","작업완료관리":"Completed Work Management","작업완료를 취소했습니다. 충ㆍ포장 실적입력에서 이어서 작업합니다.":"Cancelled completion. Continue in Filling/Packing Result Entry.","작업완료취소":"Cancel Completion","작업을 시작했습니다.":"Started the job.","작업을 완료했습니다.":"Completed the job.","작업을 재개했습니다.":"Resumed the job.","작업을 중단했습니다. 유실 공수로 집계됩니다.":"Stopped the job. It is counted as lost labor.","작업을 취소하고 지시를 대기 상태로 되돌릴까요? 입력한 실적은 유지됩니다.":"Cancel the job and return the order to waiting? Entered results are kept.","작업을 취소했습니다.":"Cancelled the job.","작업이 완료된 지시를 검색해 생산·양품·불량 수량, 자재투입내역, 작업시간·유실공수 등 완료 실적을 확인하고 관리하는 화면입니다. 작업상태관리로 작업완료취소·실적수정·실적수정완료를 적용하고, 작업장(노즐)별 완료취소와 추가자재 실적 처리를 수행합니다.":"Search completed orders and review and manage completion results such as output, good and defect quantities, material input, work time and lost labor. Apply Cancel Completion / Edit Results / Finish Editing via job status management, and handle per-workstation (nozzle) completion cancels and additional material results.","작업이 완료된 지시의 실적 단위로 설비 센서 이력을 라인 차트로 조회하는 화면입니다. 두 실적을 기준/비교로 겹쳐 작업 시작 기준 경과시간으로 비교할 수 있고, 센서별 최소·최대값과 측정시간을 표로 확인하며 원시데이터를 CSV로 내려받을 수 있습니다.":"Views equipment sensor history as line charts per result of completed orders. Overlay two results as base/comparison by elapsed time from job start, check each sensor's min/max and measurement time in a table, and download raw data as CSV.","작업이력":"Job history","작업인원":"Crew","작업일 또는 개시일 기준을 선택해 기간을 지정하고 작업반을 선택합니다.":"Choose work date or start date as the basis, set the period and select a team.","작업일 또는 개시일 중 하나를 기준으로 선택하고 기간을 지정합니다(두 기준은 동시에 적용되지 않습니다).":"Choose either work date or start date as the basis and set the period (both cannot apply at once).","작업장":"Workstation","작업장 관리":"Workstation Management","작업장 관리 - 센서 추가":"Workstation Management - Add Sensor","작업장 관리 - 작업장 수정":"Workstation Management - Edit Workstation","작업장 그리드에서 행을 선택하고 [수정]을 누릅니다.":"Select a row in the workstation grid and press [Edit].","작업장 단위 취소가 필요하면 '작업완료취소'를 체크하고 일시를 지정해 처리합니다.":"If a per-workstation cancel is needed, tick 'Cancel Completion' and set the time.","작업장 목록":"Workstation list","작업장 센서·진척률":"Workstation Sensors & Progress","작업장 수정":"Edit Workstation","작업장 청결 상태 확인":"Workstation cleanliness check","작업장 추가":"Add workstation","작업장 행을 선택하면 우측에 노즐별 탭으로 지시정보(지시번호, 품목코드, 지시수량, 누적시간 등)가 표시됩니다.":"Selecting a workstation row shows order info (order no., item code, order qty, cumulative time etc.) in per-nozzle tabs on the right.","작업장 행을 체크하면 우측에 해당 작업장의 센서/노즐 탭이 표시됩니다.":"Ticking a workstation row shows its Sensor/Nozzle tabs on the right.","작업장/노즐(완료 작업별 탭)":"Workstation/nozzle (tab per completed job)","작업장·센서·노즐":"Workstations, Sensors & Nozzles","작업장명":"Workstation name","작업장별 기록서 권한":"Record Permissions by Workstation","작업장선택":"Select workstation","작업장을 선택하지 않고 [수정]을 누르면 '수정할 작업장을 선택해 주세요.' 경고가 표시됩니다.":"Pressing [Edit] without a workstation shows 'Please select a workstation to edit.'","작업장을 선택하지 않으면 'POP 출력' 버튼이 비활성화됩니다.":"Without a workstation selected the 'POP Output' button is disabled.","작업장을 선택하지 않으면 '작업장을 선택해주세요.' 경고가 표시됩니다.":"Without a workstation selected, 'Please select a workstation.' is shown.","작업장을 추가했습니다.":"Added the workstation.","작업장의 노즐별 작업 구간을 10분 단위 간트차트로 시각화해, 같은 시간대에 2건 이상 작업이 겹친 구간을 찾아냅니다. 겹침 구간만 골라 보거나 엑셀로 내보낼 수 있습니다.":"Visualizes each nozzle's job windows as a 10-minute Gantt chart to find periods where two or more jobs overlap. Show only overlap spans or export to Excel.","작업종료":"Job end","작업종료 시간·종료구분(정상/비정상)·BULK 코드를 입력하고 작업완료를 체크한 뒤 '작업완료'를 누릅니다.":"Enter end time, end type (normal/abnormal) and BULK code, tick Complete and press 'Complete'.","작업준비":"Prepare","작업준비 · 작업중 · 중단":"Preparing · Running · Stopped","작업준비 상태로 바꿨습니다.":"Set to Preparing.","작업준비~완료·LOT 실적":"Prepare to Complete · LOT Results","작업준비를 취소하고 대기 상태로 되돌릴까요?":"Cancel preparation and return to waiting?","작업준비를 취소했습니다.":"Cancelled preparation.","작업준비부터 LOT 실적까지":"From preparation to LOT results","작업중":"In progress","작업중 설비":"Running machines","작업중단을 해제하고 작업을 재개할까요?":"Clear the stop and resume the job?","작업지시":"Work order","작업지시 검색":"Search Work Orders","작업지시 목록":"Work order list","작업지시 목록에서 대기 상태 지시를 선택하세요.":"Select a waiting order from the work order list.","작업지시 정보를 바탕으로 충포장기록서를 입력합니다. 기본 정보(구분·검사일·라인명·LOT No.), 작업 전/기능 확인사항 체크, 중량 정보와 벌크 사용내역, 지시량·생산량·수율, 특이사항과 코딩/라벨 이미지를 한 화면에서 기록합니다.":"Enter the filling/packing record from the work order. Record basic info (category, inspection date, line, LOT No.), pre-work/function checks, weight info and bulk usage, ordered/produced qty and yield, remarks and coding/label images on one screen.","작업지시부터 기록서까지,":"From work order to record,","작업취소":"Cancel job","잔여 자재 환입 예약":"Reserve Remaining Material Return","재개":"Resume","재고":"Stock","재고이동":"Stock transfer","재등록":"Re-register","저장 버튼을 누르면 변경 요약(추가·해제·확장 인원) 확인 후 변경 중인 모든 작업반이 한 번에 저장됩니다.":"Pressing Save shows a change summary (added, released, extended users) and then saves all teams being edited at once.","저장 버튼을 누르면 예약번호 단위로 ERP에 전송되고 처리 결과 창에 성공/실패 건수와 사유가 표시됩니다.":"Pressing Save sends each reservation no. to ERP and the result window shows success/failure counts and reasons.","저장 시 생성":"Created on save","저장위치":"Storage location","저장위치 코드를 입력하거나 옆의 검색 버튼으로 저장위치 검색 창에서 선택합니다.":"Enter a storage location code or select it from the storage location search via the button beside it.","저장위치명":"Storage location name","저장하면 '등록되었습니다.' 또는 '수정되었습니다.' 메시지가 표시되고 창이 닫힙니다.":"On save, 'Registered.' or 'Updated.' is shown and the window closes.","저장하지 않은 접근여부 변경이 있는 상태에서 다른 그룹을 선택하거나 등록/수정 창을 열면 '저장하지 않은 접근여부 변경이 있습니다. 이동하면 변경 내용이 사라집니다. 계속하시겠습니까?' 확인창이 표시됩니다.":"With unsaved access changes, selecting another group or opening the register/edit window shows 'There are unsaved access changes. They will be lost if you leave. Continue?'","적용":"Apply","적용제품":"Applied products","전 공장·층의 설비 가동 상태를 실시간으로 확인하는 화면입니다. 공장·층을 고르면 해당 층의 설비 배치도 위에 경광등(가동 상태)과 생산수량·진척율, 온습도 센서값이 표시되고, 설비를 누르면 운영현황이 열립니다.":"Shows real-time equipment status for every plant and floor. Choose a plant/floor to see signal lamps (status), output, progress and temperature/humidity sensors on that floor's layout; click a machine to open its operation status.","전 공장의 당일 생산 진척 현황과 월별·공장별 생산 실적을 한 화면에서 보여 주는 경영 대시보드입니다. 공장별 진척율 도넛 차트와 지시량·생산량, 월별 전 공장 생산 실적(내부생산/사내외주/사외외주), 전월 공장별 포장·충전 실적 비중을 차트로 제공합니다.":"Management dashboard showing today's production progress for all plants and monthly/plant results on one screen. Provides progress donuts and order/output per plant, monthly production for all plants (in-house/internal/external outsourcing) and last month's packing/filling share by plant.","전면 라벨":"Front label","전월 공장별 포장·충전 실적 비중":"Last Month Packing/Filling Share by Plant","전월 대비 생산량":"Output vs. last month","전일 대비 +1.2%p":"+1.2%p vs. yesterday","전자 기록서":"Electronic records","전자저울":"Electronic scale","전체 21대":"21 units total","전체 22대":"22 units total","전체 {n}대":"{n} units total","전체 가동률 영역에서 평균가동시간(hr), 평균가동대수(대), 가동률 도넛 차트, 가동률 추이 선 차트를 확인합니다.":"In the overall availability area, check average run time (hr), average running units, the availability donut and the availability trend line.","전체 되돌리기":"Revert all","전체 보기에서 전체 비가동률·누적 비가동 시간·총 발생 건수·관리 우선 라인 KPI와 관리 필요 라인, 비가동 시간 TOP 5, 주요 원인 TOP 9를 확인합니다.":"The overall view shows downtime rate, cumulative downtime, total events and priority-line KPIs, lines needing attention, top 5 downtime and top 9 causes.","전체 생산량 영역에서 생산량(개)과 라인가동 대수(대)를 확인합니다.":"In the total output area, check output (pcs) and running lines (units).","전체 유형":"All types","전체 인시생산성 영역에서 '기준 선택'으로 생산 유형을 골라 인시생산성(막대)과 목표 달성률(선) 복합 차트, 생산량 유형별 점유율(%) 파이 차트를 확인합니다.":"In the overall labor productivity area, pick a production type with 'Select base' to see the productivity (bars) and achievement (line) combo chart and the output share (%) pie chart.","전체 인시생산성 추이":"Overall Labor Productivity Trend","전체 작업반":"All teams","전체 작업반 보기에서는 전체 OEE 추이(선 차트), 전체 작업반 TOP 5(가로 막대), 전일/전주 대비 변동 작업반, 집중관리 작업반(하위 5)을 확인합니다.":"The all-teams view shows the overall OEE trend (line), top 5 teams (horizontal bars), teams changed vs. yesterday/last week and focus teams (bottom 5).","전체 지시수량":"Total order qty","전체내역 모니터링":"Overview Monitoring","전체내역 모니터링에서 공장명을 클릭해 진입합니다.":"Enter by clicking a plant name in Overview Monitoring.","전체내역 모니터링에서 선택한 공장의 작업반별 생산 현황을 상세하게 보여 주는 화면입니다. 전체 지시수량·실시간 생산량, 라인별 생산 현황, 지시 대비 진척율과 전월 대비 생산량·설비가동률·양품율, 유형별 점유율을 제공합니다.":"Detailed production by team for the plant selected in Overview Monitoring. Provides total order qty, real-time output, production by line, progress vs. orders, output/availability/quality vs. last month and share by type.","전체내역으로 돌아가기":"Back to Overview","전체지시수량·실시간 전체 생산량 카드와 라인별 생산 현황 표를 확인합니다.":"Check the total order qty and real-time total output cards and the production by line table.","전표번호":"Document no.","전화번호(FAX)":"Phone (FAX)","절차":"Procedure","점도 육안 확인":"Viscosity visual check","점도(cP)":"Viscosity (cP)","점유율":"Share","접근여부":"Access","접속 기록":"Access Log","접속 기록 조회":"Access Log Inquiry"," k code pulls the BOM's bulk; then enter received, used, returned and produced quantities.","표준 생산속도":"Standard speed","표준값":"Standard value","표준생산속도와 설비생산속도(분당)를 비교해 생산 속도를 점검합니다.":"Compare standard and equipment speed (per minute) to check production speed.","품명":"Product","품목 기본정보·BOM":"Item Master & BOM","품목 상세조회":"Item Detail","품목/BOM 조회 결과":"Item/BOM results","품목교체":"Changeover","품목교체공수(분)":"Changeover labor (min)","품목명":"Item name","품목수":"Item count","품목유형":"Item type","품목유형이 부자재일 때 라벨보관실·필름보관실 제외 체크박스가 나타납니다.":"When the item type is packaging material, the 'Exclude label/film storage' checkboxes appear.","품목의 입고·출고·재고 수불 이력을 월 단위 시작 기간과 저장위치 조건으로 ERP에서 조회합니다. 전표번호, 수불유형, 벌크제조 LOT-NO, 제조일자까지 확인할 수 있습니다. 품목재고조회와 자재환입 화면에서 공통으로 사용합니다.":"Looks up an item's receipt, issue and stock history from ERP by monthly start period and storage location. Document no., transaction type, bulk batch LOT-NO and manufacturing date are shown. Shared by Item Stock Inquiry and Material Return.","품목재고조회":"Item Stock Inquiry","품목재고조회 - 수불이력 조회":"Item Stock Inquiry - Transaction History","품목재고조회의 수불이력(●) 셀 또는 수불이력조회 버튼, 자재환입의 수불이력 버튼으로 창을 엽니다.":"Open the window from the history (●) cell or Transaction History button in Item Stock Inquiry, or the history button in Material Return.","품목정보조회":"Item Information Inquiry","품목정보조회 - 품목 상세조회":"Item Information Inquiry - Item Detail","품목정보조회 결과 행을 더블클릭하면 열리는 상세 창입니다. 품목 기본정보와 함께 해당 품목의 고객사 및 공급사 연락 정보를 한 화면에서 확인합니다.":"Detail window opened by double-clicking a result row in Item Information Inquiry. Shows the item's basic info together with customer and supplier contacts on one screen.","품목정보조회 그리드에서 원하는 행을 더블클릭합니다.":"Double-click the row you want in the Item Information Inquiry grid.","품목코드":"Item code","품목코드는 자동으로 채워지며, 기간FROM 월을 지정합니다(기본 3개월 전 1일).":"The item code is filled automatically; set the Period FROM month (default: 1st of 3 months ago).","품목코드와 공장은 필수이며, 기준수량을 비우거나 0으로 입력하면 1로 조회합니다.":"Item code and plant are required; an empty or 0 base qty is treated as 1.","품질 확인자":"Quality checker","품질검사":"QC inspection","품질검사재고":"QC stock","품질관리팀":"Quality Control Team","품질확인 대기":"Awaiting QC","프레스 경도":"Press hardness","필수값 누락 시 '성명을 입력해 주세요.', '사용자ID를 입력해 주세요.', '권한그룹을 선택해 주세요.', '사용여부를 선택해 주세요.' 메시지가 표시되며, 신규 등록에서 비밀번호가 비어 있으면 '비밀번호를 입력해 주세요.'가 표시됩니다.":"Missing required values show 'Please enter a name.', 'Please enter a user ID.', 'Please select a role group.' or 'Please select the active flag.', and an empty password on new registration shows 'Please enter a password.'","필요 시 '생산실적 취소' 또는 '생산실적 재등록'을 진행합니다.":"If needed, proceed with 'Cancel production result' or 'Re-register production result'.","필요 시 제품표준서·포장기준서 등 문서 버튼으로 해당 품목의 문서를 내려받거나 출력합니다.":"If needed, download or print the item's documents with the document buttons such as product standard and packing standard.","필요하면 이미지 선택 버튼으로 서명 이미지를 첨부하고, 썸네일을 눌러 미리보기로 확인합니다.":"If needed, attach a signature image with Select Image and click the thumbnail to preview.","필요하면 작업반과 기간 유형·기간을 변경합니다.":"Change the team, period type and period if needed.","필요하면 진행상태·작업장·품목코드·품목명·지시번호를 입력하고 검색 버튼을 누릅니다.":"If needed, enter progress status, workstation, item code, item name or order no. and press Search.","하이드라 수분 크림 50ml":"Hydra Moisture Cream 50ml","하한(g)":"Lower limit (g)","합계":"Total","해당 작업장에 진행 중인 작업이 있어 취소할 수 없습니다.":"This workstation has a job in progress and cannot be cancelled.","행을 누르면 기준 실적으로 그래프를 그립니다":"Click a row to chart it as the base result","행을 누르면 아래에 완료 실적이 표시됩니다":"Click a row to show the completed results below","행을 더블클릭하면 품목 상세조회 창에서 고객사·공급사 정보를 확인합니다.":"Double-click a row to see customer/supplier info in the item detail window.","행을 두 번 누르면 상세 정보를 볼 수 있습니다. 취소한 회차는 [재등록]으로 되살립니다.":"Double-click a row for details. Restore cancelled runs with [Re-register].","행을 두 번 누르면 품목 상세조회(고객사·공급사 정보)가 열립니다.":"Double-click a row to open the item detail (customer/supplier info).","행을 클릭하면 '생산실적 누계정보 상세'에서 자재·유실·불량 내역을 확인합니다.":"Click a row to see material, loss and defect details in 'Cumulative Production Info Detail'.","행의 수불이력(●) 셀을 클릭하면 해당 창고의 수불이력 조회 창이 열립니다.":"Click a row's history (●) cell to open that warehouse's transaction history.","행의 아이콘을 눌러 지시서·신규포장기준서·포장기준서·포장이미지를 출력합니다.":"Use the row icons to print the order sheet, new packing standard, packing standard and packing image.","허용":"Allow","허용단위":"Allowed unit","현장 POP 화면":"Shop-floor POP Screen","현장 POP 화면에 표시할 벌크 비중 정보와 코딩 정보를 설정하는 팝업입니다. LOT별 비중과 기준용량으로 충전 기준값을 계산해 POP 화면에 표기합니다.":"Popup to set the bulk gravity and coding info shown on the shop-floor POP. Calculates the fill reference from each LOT's gravity and standard volume and shows it on the POP.","현장 모니터 화면":"Shop-floor monitor screen","현장 모니터용 전체화면 POP 열기":"Open full-screen POP for the shop-floor monitor","현장 작업자":"Operator","현장 작업자가 설비(작업장)·노즐 단위로 작업지시를 배정하고 작업준비→작업시작→작업중단/재개→작업완료까지 작업 상태를 전이하며 LOT 생산실적을 입력하는 핵심 생산시점(POP) 화면입니다. 지시서·포장기준서 출력, BOM 조회, 추가자재 사용실적, POP 표기설정, 다음작업 설정을 함께 처리합니다.":"Core point-of-production (POP) screen where operators assign work orders per machine (workstation) and nozzle, move status through Prepare → Start → Stop/Resume → Complete, and enter LOT production results. Also handles order sheet/packing standard printing, BOM inquiry, additional material usage, POP display settings and next-job setup.","현장창고 출고 처리":"Floor Store Issue","현장창고(출고처)에 걸린 자재 예약 건을 조회하여 실제 출고량을 입력하고 출고 처리합니다. 저장 시 예약번호·항번 기준으로 ERP에 출고 전기가 이루어지고 행별 결과가 표시됩니다.":"Looks up material reservations at the floor store (issue location), enters actual issue quantities and posts the issue. On save, issues are posted to ERP by reservation no. and item, with results shown per row.","현재 선택한 범위(전체·세부라인·설비)의 비가동 이벤트를 발생일시·원인별로 상세 조회합니다. 계획/비계획 유형을 전환해 볼 수 있습니다.":"Shows downtime events in the current scope (all, sub-line, machine) in detail by time and cause. Switch between planned and unplanned types.","현재 설정에서는 법인 선택 박스가 숨겨져 기본 법인으로 조회됩니다.":"In the current setup the company select box is hidden and the default company is used.","현재 지시 배정":"Assign current order","현재상태":"Current status","현재시간":"Current time","현재재고":"Current stock","호퍼 레벨":"Hopper level","화면 데이터는 10초마다, 현재 시각은 1초마다 갱신됩니다.":"Screen data refreshes every 10 seconds and the clock every second.","화면 접속 이력":"Screen Access History","화면(메뉴)명":"Screen (menu) name","화면ID":"Screen ID","화면에 들어오면 작업일 오늘, 진행상태 '작업중' 조건으로 자동 조회됩니다.":"On entry, data loads automatically for work date today and status 'In progress'.","화면에 들어오면 전체 사용자 목록이 자동으로 조회됩니다.":"On entry, the full user list loads automatically.","화면에 들어오면 최근 7일(오늘 포함) 기록이 접속일시 내림차순으로 자동 조회됩니다.":"On entry, the last 7 days (including today) load automatically, newest first.","화면을 열면 첫 번째 작업반과 주 단위 기간으로 자동 조회됩니다.":"Opening the screen loads the first team with a weekly period.","화장품 제조업 MES":"Cosmetics Manufacturing MES","화장품 충포장 현장을 한 화면에서":"The cosmetics filling & packing floor on one screen","확인자 확인":"Checker review","확인자 확인 모드(해당 작업장 확인자, 승인 전): 확인자 체크박스만 체크하고 임시저장 또는 완료(승인)합니다.":"Checker mode (workstation checker, before approval): tick only the checker boxes and draft-save or complete (approve).","확인자는 작업자 체크가 된 항목만 체크할 수 있으며, 작성 내용이 미완성이면 '작성 내용(필수값/작업자 체크)이 완료되지 않아 승인할 수 없습니다.'가 표시됩니다.":"Checkers can tick only items already checked by the operator; if the content is incomplete, 'Cannot approve: content (required values/operator checks) is incomplete.' is shown.","환입":"Return","환입 대상":"To return","환입가능수량":"Returnable qty","환입가능수량이 출고예약수량+환입수량보다 작으면 저장할 수 없고, 출고처가 물류창고(2000)이면 처리할 수 없습니다. 이미 예약이 생성된 행은 재조회 후 처리해야 합니다.":"Rows whose returnable qty is less than issue reserved qty + return qty cannot be saved, and an issue location of the logistics warehouse (2000) cannot be processed. Rows that already have a reservation must be reloaded first.","환입량":"Returned qty","환입수량":"Return qty","회차별 실적을 확인하고 '출력' 아이콘으로 포장 라벨을 출력합니다.":"Check results per run and print packing labels with the 'Print' icon.","달성률 = 양품수량 ÷ 지시수량 × 100 이며 최대 100%로 표시됩니다.":"Achievement = good qty ÷ order qt ループのセンサー生値をCSVで保存します。","'월별 전 공장 생산 실적' 누적 막대 차트에서 내부생산·사내외주·사외외주 실적을 확인합니다.":"「月別全工場生産実績」積み上げ棒グラフで内部生産・社内外注・社外外注の実績を確認します。","'저장'을 눌러 등록합니다.":"「保存」を押して登録します。","'저장'을 눌러 설정을 반영합니다.":"「保存」を押して設定を反映します。","'전월 공장별 포장실적', '전월 공장별 충전 실적' 원형 차트로 공장별 비중을 확인합니다.":"「前月工場別包装実績」「前月工場別充填実績」の円グラフで工場別の比率を確認します。","'전체내역으로 돌아가기' 버튼으로 전체내역 모니터링으로 돌아갑니다.":"「全体内訳に戻る」ボタンで全体モニタリングに戻ります。","'추가자재사용실적등록' 버튼으로 팝업을 엽니다.":"「追加資材使用実績登録」ボタンでポップアップを開きます。","'추가자재사용실적조회'에서 등록 내역을 확인하고 필요 시 선택삭제하거나 라벨을 출력합니다.":"「追加資材使用実績照会」で登録内容を確認し、必要に応じて選択削除やラベル出力を行います。","(고객사)Lot No.":"（顧客）Lot No.","1. 공정검사":"1. 工程検査","1. 공정검사 표에서 항목별로 초·중·말 판정을 입력합니다. 열 헤더의 일괄 선택 메뉴로 모두 O (적합)/모두 X (부적합)/모두 N/A/일괄 해제를 적용할 수 있습니다.":"1. 工程検査表で項目ごとに初・中・末の判定を入力します。列ヘッダーの一括選択メニューで全てO（適合）/全てX（不適合）/全てN/A/一括解除を適用できます。","1001 원자재창고":"1001 原材料倉庫","1002 부자재창고":"1002 副資材倉庫","10분 단위":"10分単位","10분 단위 간트":"10分単位ガント","10분 단위 시간 슬롯(HH:MM)":"10分単位の時間スロット（HH:MM）","1단계 역전개":"1段階逆展開","1단계 전개":"1段階展開","1초마다 자동 갱신":"1秒ごとに自動更新","1회/시간":"1回/時間","2. 내용량 검사":"2. 内容量検査","2. 내용량 검사에 표시용량·비 중·실충전량(g)과 초·중·말 시기별 측정값을 입력합니다. 파우더는 측정장비(Zwick/C type/A type/레오미터/기타)를 선택하고 경도와 실충전량을 하한~상한 범위로 입력합니다.":"2. 内容量検査で表示容量・比重・実充填量(g)と初・中・末の時期別測定値を入力します。パウダーは測定機器（Zwick/C type/A type/レオメーター/その他）を選択し、硬度と実充填量を下限〜上限の範囲で入力します。","2101 충전1반 현장창고":"2101 充填1班 現場倉庫","2102 포장1반 현장창고":"2102 包装1班 現場倉庫","2201 색조반 현장창고":"2201 色調班 現場倉庫","2301 튜브반 현장창고":"2301 チューブ班 現場倉庫","2건 이상 겹침":"2件以上重複","3D 모델에서 공장·층을 클릭하면 해당 층 배치도가 열립니다.":"3Dモデルで工場・階をクリックするとその階の配置図が開きます。","3D 모델에서 선택한 공장·층의 설비 배치도를 오버레이로 띄워 설비별 가동 상태를 경광등으로 보여 줍니다. 각 설비 라벨에 누적 생산수량(개)과 지시 대비 진척율(%), 생산 품명이 표시되고, 범례 영역에 층별 온습도 센서값이 함께 표시됩니다.":"3Dモデルで選択した工場・階の設備配置図をオーバーレイ表示し、設備ごとの稼働状態を表示灯で示します。各設備ラベルに累積生産数量（個）、指示比進捗率（%）、生産品名が表示され、凡例エリアに階別の温湿度センサー値も表示されます。","3D 모델에서 확인할 공장·층을 클릭합니다.":"3Dモデルで確認する工場・階をクリックします。","3D 화면 로딩에 실패하면 '3D 화면을 불러오지 못했습니다.' 메시지가 표시됩니다.":"3D画面の読み込みに失敗すると「3D画面を読み込めませんでした。」と表示されます。","5종 공정검사":"5種工程検査","5초마다 자동 갱신":"5秒ごとに自動更新","7로 시작하지 않는 자재는 로트(관리번호) 입력이 필수입니다.":"7で始まらない資材はロット（管理番号）入力が必須です。","7로 시작하지 않는 자재는 로트(관리번호)를 반드시 입력해야 하며, 성공 행은 회색, 실패 행은 빨간색으로 표시됩니다.":"7で始まらない資材はロット（管理番号）を必ず入力する必要があり、成功行はグレー、失敗行は赤で表示されます。","95% 미만":"95%未満","99% 이상":"99%以上","BOM 보기":"BOM表示","BOM 외에 추가로 투입한 자재의 사용실적을 등록·조회하는 팝업입니다. 자재별 사용파손·원천불량·수량부족 수량과 특이사항을 입력하며, 조회 화면에서 등록 내역을 선택삭제하거나 라벨을 출력합니다.":"BOM以外に追加投入した資材の使用実績を登録・照会するポップアップです。資材別の使用破損・原因不良・数量不足と特記事項を入力し、照会画面で登録内容の選択削除やラベル出力を行います。","BOM 외에 추가로 투입한 자재의 사용파손·원천불량·수량부족 수량을 입력합니다.":"BOM以外に追加投入した資材の使用破損・原因不良・数量不足数量を入力します。","BOM 조회":"BOM照会","BOM의 벌크코드를 불러왔습니다.":"BOMのバルクコードを読み込みました。","BOM조회":"BOM照会","ERP 가동시간 기준":"ERP稼働時間基準","ERP 가동시간 데이터를 기반으로 작업반의 평균 가동시간·가동대수·가동률과 기간별 가동률 추이를 보여 줍니다. 작업반 내 설비별 가동률과 가동시간도 카드로 확인할 수 있습니다.":"ERP稼働時間データに基づき、作業班の平均稼働時間・稼働台数・稼働率と期間別稼働率推移を表示します。作業班内の設備別稼働率と稼働時間もカードで確認できます。","ERP에서 강제 작업종료된 지시는 작업상태관리·완료취소·추가자재 등록/조회가 차단됩니다.":"ERPで強制作業終了された指示は、作業状態管理・完了取消・追加資材登録/照会がブロックされます。","KPI 계산식":"KPI計算式","LOT 1회":"LOT 1回","LOT 3회":"LOT 3回","LOT {n}회":"LOT {n}回","LOT 관리":"LOT管理","LOT 생산실적":"LOT生産実績","LOT 선택":"LOT選択","LOT 실적":"LOT実績","LOT별 비중과 기준용량으로 충전 기준값을 계산해 현장 POP에 표기합니다.":"LOT別の比重と基準容量で充填基準値を計算し、現場POPに表示します。","OEE 상위·하위 설비":"OEE上位・下位設備","OEE 추이":"OEE推移","OEE 추이·순위":"OEE推移・順位","OPCUA노드":"OPC UAノード","Opcua Node 검색어와 측정값종류·센서종류 조건을 입력하고 [검색]을 누릅니다.":"OPC UAノードの検索語と測定値種類・センサー種類の条件を入力し、[検索]を押します。","POP - 현장 POP 화면":"POP - 現場POP画面","POP 출력":"POP出力","POP 표기설정":"POP表示設定","POP 표기설정을 저장했습니다.":"POP表示設定を保存しました。","POP 화면(C00011)에서 작업장을 선택하고 'POP 출력'을 누릅니다.":"POP画面（C00011）で作業場を選択し「POP出力」を押します。","POP 화면에서 뒤로 돌아오면 직전에 선택한 작업반·작업장이 복원됩니다.":"POP画面から戻ると直前に選択した作業班・作業場が復元されます。","POP표기설정":"POP表示設定","QC관리품 수량":"QC管理品数量","SAP누적":"SAP累計","SSO여부":"SSO有無","Unity WebGL 기반 3D 공장 모델 위에서 전 공장·층의 설비 가동 상태를 실시간으로 확인하는 화면입니다. 3D 모델에서 공장·층을 클릭하면 해당 층의 설비 배치도 위에 경광등(가동 상태)과 생산수량·진척율, 온습도 센서값이 표시됩니다.":"Unity WebGLベースの3D工場モデル上で全工場・階の設備稼働状態をリアルタイムで確認する画面です。3Dモデルで工場・階をクリックすると、その階の設備配置図上に表示灯（稼働状態）と生産数量・進捗率、温湿度センサー値が表示されます。","X 버튼 또는 배경을 클릭해 팝업을 닫습니다.":"Xボタンまたは背景をクリックしてポップアップを閉じます。","[검색]을 누르면 노즐별·날짜별 10분 단위 간트차트가 표시됩니다.":"[検索]を押すとノズル別・日付別の10分単位ガントチャートが表示されます。","[백데이터 다운로드]로 가동률·성능가동률·양품률 원시데이터 엑셀을 내려받습니다.":"[バックデータダウンロード]で稼働率・性能稼働率・良品率の生データExcelをダウンロードします。","[상세 이벤트 로그 전체보기]로 이벤트 단위 로그를 확인하고, [원시데이터 다운로드]로 유실 이벤트 엑셀을 내려받습니다.":"[詳細イベントログ全表示]でイベント単位のログを確認し、[生データダウンロード]でロスイベントExcelをダウンロードします。","[설비 보기]로 소속 설비 목록을 열어 설비를 선택하면 설비 비가동률·MTBF·MTTR·발생 건수와 비가동 복합 추이(발생 빈도 막대 + 지속 시간 선) 리포트가 표시됩니다.":"[設備表示]で所属設備一覧を開いて設備を選択すると、設備の非稼働率・MTBF・MTTR・発生件数と非稼働複合推移（発生頻度の棒＋継続時間の線）レポートが表示されます。","[수정]을 눌러 작업장 정보를 변경하거나 삭제(사용안함)합니다.":"[修正]を押して作業場情報を変更するか削除（使用しない）します。","[엑셀]로 현재 간트차트를 엑셀 파일로 내보냅니다.":"[Excel]で現在のガントチャートをExcelファイルに出力します。","[원시데이터 다운로드]로 가동률 상세 엑셀을 내려받습니다.":"[生データダウンロード]で稼働率詳細Excelをダウンロードします。","[원시데이터 다운로드]로 수율 상세 엑셀을 내려받습니다.":"[生データダウンロード]で収率詳細Excelをダウンロードします。","[원시데이터 다운로드]로 인시생산성 상세 엑셀을 내려받습니다.":"[生データダウンロード]で人時生産性詳細Excelをダウンロードします。","[원시데이터 다운로드]로 충포장 실적 상세 엑셀을 내려받습니다.":"[生データダウンロード]で充填包装実績詳細Excelをダウンロードします。","[저장]을 누르고 확인 창에서 승인하면 저장됩니다.":"[保存]を押し、確認ウィンドウで承認すると保存されます。","[저장]을 눌러 반영하거나, [삭제]를 눌러 작업장을 사용안함 처리합니다.":"[保存]を押して反映するか、[削除]を押して作業場を使用しないにします。","[저장]을 눌러 센서로 등록합니다.":"[保存]を押してセンサーとして登録します。","[추가]는 현재 탭에 행을 추가합니다. 센서 탭의 [추가]는 미할당 OPC UA 노드에서 고릅니다.":"[追加]は現在のタブに行を追加します。センサータブの[追加]は未割当のOPC UAノードから選びます。","h/일":"h/日","{b} 처리할까요?":"{b}を処理しますか？","{no} 작업완료를 취소하고 작업중 상태로 되돌릴까요?":"{no}の作業完了を取り消して作業中状態に戻しますか？","{no} 작업을 시작할까요? 시작 시각이 기록됩니다.":"{no}の作業を開始しますか？開始時刻が記録されます。","{no} 작업을 완료할까요? 완료 후에는 작업완료관리에서 수정합니다.":"{no}の作業を完了しますか？完了後は作業完了管理で修正します。","{no}을(를) {ws}에 배정하고 작업준비 상태로 바꿀까요?":"{no}を{ws}に割り当てて作業準備状態にしますか？","{n}건을 ERP로 전송할까요?":"{n}件をERPに送信しますか？","{n}건을 승인했습니다.":"{n}件を承認しました。","{n}건을 제거했습니다.":"{n}件を削除しました。","{n}건을 추가했습니다.":"{n}件を追加しました。","{n}건의 승인을 취소했습니다.":"{n}件の承認を取り消しました。","{n}회차 LOT 생산실적을 저장했습니다. (양품 {q})":"{n}回目のLOT生産実績を保存しました。（良品 {q}）","{n}회차 생산실적을 재등록할까요?":"{n}回目の生産実績を再登録しますか？","{n}회차 생산실적을 취소할까요? 양품수량에서 차감됩니다.":"{n}回目の生産実績を取り消しますか？良品数量から差し引かれます。","{p} 측정값을 지울까요?":"{p}の測定値を消去しますか？","{q} {t} 목표생산성을 저장할까요?":"{q} {t}の目標生産性を保存しますか？","{ws} 작업중단 · {no}":"{ws} 作業中断 · {no}","{ws} 충전 온도 상한 근접":"{ws} 充填温度上限に接近","● 고객사":"● 顧客","● 고객사 / ● 공급사":"● 顧客 / ● 仕入先","● 공급사":"● 仕入先","가동":"稼働","가동대수":"稼働台数","가동률":"稼働率","가동률 × 성능가동률 × 양품률":"稼働率 × 性能稼働率 × 良品率","가동률 조회":"稼働率照会","가동률 추이":"稼働率推移","가동률·성능가동률·양품률로 종합설비효율(OEE)을 산출해 KPI 카드와 추이·순위 차트로 보여 줍니다. 작업반을 선택하면 설비유형별, 설비별 OEE까지 드릴다운하여 비교할 수 있습니다.":"稼働率・性能稼働率・良品率から総合設備効率（OEE）を算出し、KPIカードと推移・順位チャートで表示します。作業班を選択すると設備タイプ別・設備別OEEまでドリルダウンして比較できます。","가동시간":"稼働時間","가동시간 ÷ 계획시간":"稼働時間 ÷ 計画時間","가동시간·가동률":"稼働時間・稼働率","가로축은 작업 시작 기준 경과시간입니다. 녹색 띠는 허용 범위입니다.":"横軸は作業開始基準の経過時間です。緑の帯は許容範囲です。","가용재고":"可用在庫","각 상태 전이(작업준비/작업시작/작업중단/작업완료/취소)는 확인 창을 거쳐 처리됩니다.":"各状態遷移（作業準備/作業開始/作業中断/作業完了/取消）は確認ウィンドウを経て処理されます。","값이 변경되지 않으면 [저장] 버튼이 비활성화되며, 입력된 목표가 하나도 없으면 '설정된 목표생산성 정보가 없습니다.' 경고가 표시됩니다.":"値が変更されないと[保存]ボタンは無効になり、目標が一つも入力されていないと「設定された目標生産性情報がありません。」の警告が表示されます。","같은 실적을 비교로 선택하면 '동일작업을 비교할 수 없습니다.' 경고가 표시됩니다.":"同じ実績を比較に選択すると「同一作業は比較できません。」の警告が表示されます。","개":"個","개시일":"開始日","개시일 기간과 작업반·작업장 조건으로 작업지시(배정) 목록을 조회하는 화면입니다. 지시별 진행현황과 지시·생산수량을 확인하고, 지시서·포장기준서·포장이미지를 출력하며 작업완료 지시의 추가자재 사용실적을 등록·조회할 수 있습니다.":"開始日期間と作業班・作業場の条件で作業指示（割当）一覧を照会する画面です。指示別の進行状況と指示・生産数量を確認し、指示書・包装基準書・包装画像を出力し、作業完了指示の追加資材使用実績を登録・照会できます。","개시일 기간을 확인합니다(기본값: 오늘 기준 -2주 ~ +2주).":"開始日期間を確認します（既定値：今日基準 -2週〜+2週）。","개시일과 실적작업반·작업장, 지시번호 등을 입력하고 검색합니다.":"開始日と実績作業班・作業場、指示番号などを入力して検索します。","검사 규격":"検査規格","검사기록":"検査記録","검사기록서(충포장·공정검사)를 작성·확인·승인할 수 있는 사용자를 작업장 단위로 배정합니다. 작업반과 작업장을 선택한 뒤 사용자별로 기록서 권한(작성자·확인자·책임자·관리자)과 사용여부를 지정하며, 여러 작업반의 변경을 모아 한 번에 저장할 수 있습니다.":"検査記録書（充填包装・工程検査）を作成・確認・承認できるユーザーを作業場単位で割り当てます。作業班と作業場を選択した後、ユーザー別に記録書権限（作成者・確認者・責任者・管理者）と使用有無を指定し、複数作業班の変更をまとめて一度に保存できます。","검사방법":"検査方法","검사시기":"検査時期","검사일":"検査日","검사일 기간과 작업반(필수)을 선택하고 종류·승인상태(미승인/승인) 등 조건을 지정한 뒤 검색합니다.":"検査日期間と作業班（必須）を選択し、種類・承認状態（未承認/承認）などの条件を指定して検索します。","검사일 기간과 작업반(필수)을 선택하고 필요한 조건을 입력한 뒤 검색 버튼을 누릅니다.":"検査日期間と作業班（必須）を選択し、必要な条件を入力して検索ボタンを押します。","검사일을 입력하세요.":"検査日を入力してください。","검사항목":"検査項目","검색":"検索","검색 결과가 없으면 '검색 결과가 없습니다. 검색어나 필터를 변경해 보세요.'가 표시됩니다.":"検索結果がない場合「検索結果がありません。検索語やフィルターを変更してみてください。」と表示されます。","검색 버튼을 누르면 수불이력이 그리드에 표시됩니다.":"検索ボタンを押すと受払履歴がグリッドに表示されます。","검색 버튼을 누르면 조건에 맞는 기록이 50건 단위로 불러와지며 하단에 전체 건수가 표시됩니다.":"検索ボタンを押すと条件に合う記録が50件単位で読み込まれ、下部に全件数が表示されます。","검색 버튼을 누르면 창고(저장위치)별 재고가 그리드에 표시됩니다.":"検索ボタンを押すと倉庫（保管場所）別在庫がグリッドに表示されます。","검색 버튼을 누르면 출고 대상 예약 건이 표시되며 출고량은 이전요청수량으로 미리 채워집니다.":"検索ボタンを押すと出庫対象の予約件が表示され、出庫量は移転要求数量で事前入力されます。","검색 버튼을 누르면 출고처별 재고가 품명 순으로 표시됩니다.":"検索ボタンを押すと出庫先別在庫が品名順に表示されます。","검색 버튼을 누르면 품목명과 관리단위·층별화·품목유형·조달구분·총리드타임·검사항목수 배지가 상단에 표시되고 결과가 그리드에 나타납니다.":"検索ボタンを押すと品目名と管理単位・層別化・品目タイプ・調達区分・総リードタイム・検査項目数のバッジが上部に表示され、結果がグリッドに表示されます。","검색 버튼을 누르면 해당 기간의 이동 예약 건이 그리드에 표시됩니다.":"検索ボタンを押すと該当期間の移動予約件がグリッドに表示されます。","검색 버튼을 누르면 환입 가능한 자재가 품명 순으로 표시됩니다.":"検索ボタンを押すと戻入可能な資材が品名順に表示されます。","검색 버튼을 눌러 작업지시 목록을 조회합니다.":"検索ボタンを押して作業指示一覧を照会します。","결재·출력":"決裁・出力","결재할 기록서를 체크하고 승인 또는 승인취소 버튼을 누릅니다.":"決裁する記録書をチェックし、承認または承認取消ボタンを押します。","결재할 기록서의 체크박스를 선택합니다(본인이 처리할 수 있는 행만 선택할 수 있습니다).":"決裁する記録書のチェックボックスを選択します（本人が処理できる行のみ選択できます）。","겹침 구간":"重複区間","겹침 구간만 보기":"重複区間のみ表示","겹침 노즐":"重複ノズル","겹침 시간":"重複時間","경과(분)":"経過（分）","경광등 녹색":"表示灯 緑","경광등 범례(정상 작업 중, 일시 정지, 작업 준비, 유휴 설비)로 설비 상태를 구분합니다.":"表示灯の凡例（正常作業中、一時停止、作業準備、遊休設備）で設備状態を区分します。","경광등 소등":"表示灯 消灯","경광등 적색":"表示灯 赤","경광등 황색":"表示灯 黄","계정·권한그룹·서명":"アカウント・権限グループ・署名","계획":"計画","계획 {a} · 비계획 {b}":"計画 {a} · 計画外 {b}","고객사":"顧客","고객사 A":"顧客 A","고객사 B":"顧客 B","고객사 C":"顧客 C","고객사 Lot No.":"顧客 Lot No.","고객사명":"顧客名","고객사코드":"顧客コード","공급사 A":"仕入先 A","공급사 B":"仕入先 B","공급사 C":"仕入先 C","공급사명":"仕入先名","공급사코드":"仕入先コード","공급업체":"仕入先","공수추가":"工数追加","공장":"工場","공장·층 선택":"工場・階選択","공장·층별 모니터링":"工場・階別モニタリング","공장·층별 설비 경광등":"工場・階別設備表示灯","공장과 출고처(작업반, 복수 선택 가능)를 지정하고 필요 시 품목코드·품목유형을 입력합니다.":"工場と出庫先（作業班、複数選択可）を指定し、必要に応じて品目コード・品目タイプを入力します。","공장과 품목코드는 필수이며, 입력한 품목코드가 여러 건과 일치하면 품목코드 검색 창이 열립니다.":"工場と品目コードは必須で、入力した品目コードが複数件と一致すると品目コード検索ウィンドウが開きます。","공장과 품목코드로 ERP의 창고(저장위치)별 재고 현황을 조회합니다. 현재재고·사용불가·품질검사·이동할당·출고할당 수량과 초도/최종 입출고일을 한눈에 확인하고, 창고별 수불이력과 관리번호(로트)별 재고도 바로 열어 볼 수 있습니다.":"工場と品目コードでERPの倉庫（保管場所）別在庫状況を照会します。現在在庫・使用不可・品質検査・移動割当・出庫割当数量と初回/最終入出庫日を一目で確認し、倉庫別受払履歴と管理番号（ロット）別在庫もすぐに開けます。","공장과 품목코드를 기준으로 품목 기본정보와 BOM 구성을 조회합니다. 품목코드 단건 조회 외에 1단계/다단계 전개·역전개, 적용제품 조회를 지원하며 기준수량에 따른 단위 소요량을 확인할 수 있습니다. 제품표준서·포장기준서 등 관련 문서와 이미지도 이 화면에서 바로 출력합니다.":"工場と品目コードを基準に品目基本情報とBOM構成を照会します。品目コード単件照会のほか1段階/多段階展開・逆展開、適用製品照会に対応し、基準数量に応じた単位所要量を確認できます。製品標準書・包装基準書など関連文書と画像もこの画面から直接出力します。","공장명(>)을 클릭하면 해당 공장의 생산현황 상세 화면으로 이동합니다.":"工場名（>）をクリックするとその工場の生産状況詳細画面に移動します。","공장별 진척·월별 실적":"工場別進捗・月別実績","공장을 누르면 생산현황 상세로 이동합니다":"工場を押すと生産状況詳細に移動します","공장을 선택하고 품목코드를 입력하거나 돋보기로 품목코드 검색 창을 열어 선택합니다.":"工場を選択して品目コードを入力するか、虫眼鏡で品目コード検索ウィンドウを開いて選択します。","공정 영상":"工程映像","공정검사":"工程検査","공정검사 기록서":"工程検査記録書","공정검사 기록서 목록":"工程検査記録書一覧","공정검사 기록서 작성":"工程検査記録書作成","공정검사 기록서 작성 - 기록서 입력":"工程検査記録書作成 - 記録書入力","공정검사 기록서는 확인자 체크 단계가 없어 상세 창이 수정·관리자 수정·조회 모드로만 열리며, 결재는 목록의 승인 버튼으로 처리합니다.":"工程検査記録書は確認者チェック段階がないため、詳細ウィンドウは修正・管理者修正・照会モードでのみ開き、決裁は一覧の承認ボタンで処理します。","공정검사 항목을 초기 판정까지 입력하세요.":"工程検査項目を初期判定まで入力してください。","공정관리":"工程管理","관리번호":"管理番号","관리번호 {m}을(를) 선택했습니다.":"管理番号 {m} を選択しました。","관리번호 조회":"管理番号照会","관리번호가 없는 자재는 로트선택 열의 LOT 버튼으로 관리번호 조회 창에서 로트를 선택합니다.":"管理番号のない資材はロット選択列のLOTボタンで管理番号照会ウィンドウからロットを選択します。","관리유형":"管理タイプ","관리자 수정 모드(해당 작업장 관리자): 결재 상태와 관계없이 내용을 편집하고 저장 버튼으로 덮어씁니다.":"管理者修正モード（該当作業場管理者）：決裁状態に関係なく内容を編集し、保存ボタンで上書きします。","관리자 저장 시 '관리자 권한으로 내용을 덮어쓰시겠습니까? 이전 내용은 복구할 수 없습니다.' 확인창이 표시되며 결재·작성자 정보는 유지됩니다.":"管理者保存時に「管理者権限で内容を上書きしますか？以前の内容は復元できません。」の確認ウィンドウが表示され、決裁・作成者情報は維持されます。","구매담당":"購買担当","권한":"権限","권한 관리":"権限管理","권한 그룹":"権限グループ","권한 그룹별 메뉴 접근":"権限グループ別メニューアクセス","권한 그룹을 등록·수정하고, 권한 그룹별로 각 화면(메뉴)에 대한 접근 허용 여부를 지정합니다. 여기서 허용된 메뉴만 좌측 메뉴에 표시되고 화면에 진입할 수 있습니다.":"権限グループを登録・修正し、権限グループ別に各画面（メニュー）へのアクセス許可有無を指定します。ここで許可されたメニューのみ左側メニューに表示され、画面に入ることができます。","권한그룹과 사용여부(사용/미사용)를 선택합니다. 신규 등록 시 권한그룹은 INIT 그룹이 기본 선택됩니다.":"権限グループと使用有無（使用/未使用）を選択します。新規登録時、権限グループはINITグループが既定で選択されます。","권한명":"権限名","권한명은 대소문자·앞뒤 공백을 무시하고 중복 여부를 검사하며, 중복이면 '이미 존재하는 권한명입니다.'가 표시됩니다.":"権限名は大文字小文字・前後の空白を無視して重複有無を検査し、重複の場合「既に存在する権限名です。」と表示されます。","권한이 선택되지 않은 배정 사용자가 있으면 저장이 차단되고 '권한이 선택되지 않은 사용자가 있습니다: …. 해당 사용자의 권한을 선택해 주세요.' 안내가 표시됩니다.":"権限が選択されていない割当ユーザーがいると保存がブロックされ、「権限が選択されていないユーザーがいます：…。該当ユーザーの権限を選択してください。」と案内されます。","그 외 사용자는 조회 모드로 열리며 내용만 확인하고 닫기 버튼으로 닫습니다.":"その他のユーザーは照会モードで開き、内容のみ確認して閉じるボタンで閉じます。","금속검출기 작동 확인":"金属検出機作動確認","금일 공장별 진척 현황":"本日の工場別進捗状況","금일 생산수량":"本日生産数量","금일 양품수량":"本日良品数量","기간 단위 평균":"期間単位平均","기간 유형(일/주/월/년)과 기간을 지정하고 작업반을 선택합니다(기본값: 전체 작업반, 전일).":"期間タイプ（日/週/月/年）と期間を指定し、作業班を選択します（既定値：全作業班、前日）。","기간 유형과 기간(기본: 전일), 작업반(기본: 전체 작업반)을 선택합니다.":"期間タイプと期間（既定：前日）、作業班（既定：全作業班）を選択します。","기간 유형이 일·주이면 일별, 월이면 주차별, 년이면 월별로 추이가 묶입니다.":"期間タイプが日・週なら日別、月なら週別、年なら月別に推移がまとめられます。","기간 합계":"期間合計","기간FROM":"期間FROM","기간은 매월 1일부터 조회 가능하며 YYYYMM 형식으로 지정합니다.":"期間は毎月1日から照会可能で、YYYYMM形式で指定します。","기간을 지정하고 사용자(로그인ID 또는 사용자명)와 메뉴를 필요에 따라 선택합니다.":"期間を指定し、ユーザー（ログインIDまたはユーザー名）とメニューを必要に応じて選択します。","기계시간(분)":"機械時間（分）","기능":"機能","기록서":"記録書","기록서 {n}건을 승인할까요? 책임자 서명이 기록됩니다.":"記録書{n}件を承認しますか？責任者の署名が記録されます。","기록서 {n}건의 승인을 취소할까요?":"記録書{n}件の承認を取り消しますか？","기록서 권한 관리":"記録書権限管理","기록서 목록":"記録書一覧","기록서 목록 창에서 작성할 공정검사 종류의 작성 아이콘을 누르면 해당 기록서 입력 화면으로 전환됩니다.":"記録書一覧ウィンドウで作成する工程検査種類の作成アイコンを押すと、該当記録書の入力画面に切り替わります。","기록서 상세(결재)":"記録書詳細（決裁）","기록서 승인대기":"記録書承認待ち","기록서 승인대기 {n}건":"記録書承認待ち {n}件","기록서 입력":"記録書入力","기록서 종류 선택":"記録書種類選択","기록서 출력":"記録書出力","기록서를 삭제할까요?":"記録書を削除しますか？","기록서를 삭제했습니다.":"記録書を削除しました。","기록서를 완료할까요? 완료 후에는 확인자 확인과 승인 단계로 넘어갑니다.":"記録書を完了しますか？完了後は確認者確認と承認段階に進みます。","기록서를 완료했습니다. 기록서 목록에서 승인할 수 있습니다.":"記録書を完了しました。記録書一覧で承認できます。","기본정보":"基本情報","기존제품 이미지":"既存製品画像","기준":"基準","기준 선택":"基準選択","기준 중량(g)":"基準重量（g）","기준수량":"基準数量","기준용량":"基準容量","기초":"基礎","날짜":"日付","날짜 형식이 올바르지 않습니다. 예: {d}":"日付の形式が正しくありません。例：{d}","내 권한 작업장의 작업지시를 조회해 공정검사 기록서를 작성합니다. 작성 시 립스틱·리퀴드·파우더·마스카라·쿠션 중 기록서 종류를 선택합니다.":"自分の権限作業場の作業指示を照会し、工程検査記録書を作成します。作成時にリップスティック・リキッド・パウダー・マスカラ・クッションの中から記録書種類を選択します。","내 기록서 권한이 있는 작업장의 작업지시를 조회해 충포장 기록서를 작성할 대상을 고릅니다. 작업일 또는 개시일 기준으로 검색하며, 작성완료된 기록서가 있는 건은 음영으로 구분됩니다.":"自分の記録書権限がある作業場の作業指示を照会し、充填包装記録書を作成する対象を選びます。作業日または開始日基準で検索し、作成完了した記録書がある件は網掛けで区別されます。","내부생산":"内部生産","내용량 검사 입력값을 모두 지울까요?":"内容量検査の入力値をすべて消去しますか？","년":"年","노즐":"ノズル","노즐 시간겹침 간트차트":"ノズル時間重複ガントチャート 일 생산수량, 진척율 게이지, 표준/설비 생산속도, 작업경과·예상시간, 다음 작업, LOT별 비중·충전용량 기준을 큰 글씨로 보여 줍니다.":"設備横のモニターに表示しておく現場用全画面POPです。製品コード・LOT・コーディング情報、指示数量・累積/本日生産数量、進捗率ゲージ、標準/設備生産速度、作業経過・予想時間、次の作業、LOT別比重・充填容量基準を大きな文字で表示します。","설비 옆 전체화면 모니터":"設備横の全画面モニター","설비 위 라벨에서 생산수량과 진척율, 우측 범례에서 센서별 온도·습도를 확인합니다.":"設備上のラベルで生産数量と進捗率を、右側の凡例でセンサー別温度・湿度を確認します。","설비 유실(비가동) 이벤트와 작업시간을 집계해 비가동률·누적 비가동 시간·발생 건수를 분석합니다. 전체 → 작업반(라인) → 세부라인 → 설비 순으로 드릴다운하며 주요 원인과 MTBF/MTTR 같은 신뢰성 지표를 확인합니다.":"設備ロス（非稼働）イベントと作業時間を集計して非稼働率・累積非稼働時間・発生件数を分析します。全体→作業班（ライン）→細部ライン→設備の順にドリルダウンし、主な原因とMTBF/MTTRのような信頼性指標を確認します。","설비 종합효율":"設備総合効率","설비 종합효율 그래프":"設備総合効率グラフ","설비 진척률":"設備進捗率","설비 카드를 눌러 설비 상세 리포트로 이동합니다.":"設備カードを押して設備詳細レポートに移動します。","설비가 멈추면 '비가동' 경고 화면이 정지 시각과 함께 표시됩니다.":"設備が止まると「非稼働」警告画面が停止時刻とともに表示されます。","설비고장":"設備故障","설비를 클릭하면 설비 상세(운영현황) 팝업이 열립니다.":"設備をクリックすると設備詳細（運営状況）ポップアップが開きます。","설비명":"設備名","설비명 검색, 상태 필터(전체/심각/주의/정상), 정렬(비가동률 순/발생 횟수 순/이름 순)로 목록을 좁힙니다.":"設備名検索、状態フィルター（全体/深刻/注意/正常）、並べ替え（非稼働率順/発生回数順/名前順）で一覧を絞り込みます。","설비명 검색...":"設備名検索...","설비별 OEE":"設備別OEE","설비별 가동률":"設備別稼働率","설비별 비가동률":"設備別非稼働率","설비별 현황 모니터링":"設備別状況モニタリング","설비별(품목별) 그래프 조회":"設備別（品目別）グラフ照会","설비센서값과 진척률은 1초마다 자동 갱신되며, 센서가 설정되지 않은 설비는 '설정된 센서정보가 없습니다.'가 표시됩니다.":"設備センサー値と進捗率は1秒ごとに自動更新され、センサーが設定されていない設備は「設定されたセンサー情報がありません。」と表示されます。","설비유형별 OEE":"設備タイプ別OEE","설비지시서 설정":"設備指示書設定","설정 가능한 LOT가 없으면 '설정가능한 Lot 정보가 없습니다.'가 표시됩니다.":"設定可能なLOTがない場合「設定可能なLot情報がありません。」と表示されます。","설정 항목":"設定項目","설정 항목별 목표생산성 칸에 값을 입력합니다.":"設定項目別の目標生産性欄に値を入力します。","설정값":"設定値","설정분기":"設定四半期","설정분기의 연도와 분기(1분기~4분기), 작업반을 선택하면 유형별 기존 목표가 조회됩니다.":"設定四半期の年度と四半期（1〜4四半期）、作業班を選択するとタイプ別の既存目標が照会されます。","설정허용값":"設定許容値","설정허용값은 측정값종류가 CUR인 센서에서만 수정할 수 있습니다. 노즐 그리드 컬럼은 ID·노즐명·분당 CAPA·사용여부입니다.":"設定許容値は測定値種類がCURのセンサーでのみ修正できます。ノズルグリッドの列はID・ノズル名・分当たりCAPA・使用有無です。","성공":"成功","성능가동률":"性能稼働率","성명 또는 사용자ID 검색":"氏名またはユーザーID検索","성명과 사용자ID를 입력합니다(수정 시 사용자ID는 변경할 수 없습니다).":"氏名とユーザーIDを入力します（修正時、ユーザーIDは変更できません）。","성형":"成形","성형 표면 상태":"成形表面状態","성형기":"成形機","세부라인":"細部ライン","세부라인 현황 또는 설비 리포트에서 [상세 이벤트 로그 전체보기]를 누릅니다.":"細部ライン状況または設備レポートで[詳細イベントログ全表示]を押します。","세부라인별 비가동률":"細部ライン別非稼働率","세부라인을 선택한 뒤 [설비 보기]를 누릅니다.":"細部ラインを選択して[設備表示]を押します。","세정":"洗浄","센서":"センサー","센서 {n}개를 추가했습니다.":"センサー{n}個を追加しました。","센서 이력":"センサー履歴","센서 최소/최대값":"センサー最小/最大値","센서 추가":"センサー追加","센서 탭에서 [추가]를 누릅니다.":"センサータブで[追加]を押します。","센서 탭에서는 센서명·설정허용값·설정값 등을 셀에서 바로 수정하고, [추가]로 미할당 OPC UA 노드를 센서로 등록합니다.":"センサータブではセンサー名・設定許容値・設定値などをセルで直接修正し、[追加]で未割当OPC UAノードをセンサーとして登録します。","센서명":"センサー名","센서종류":"センサー種類","소속 설비":"所属設備","소요량":"所要量","소요일자":"所要日","속도":"速度","수량부족":"数量不足","수량을 하나 이상 입력하세요.":"数量を一つ以上入力してください。","수불유형":"受払タイプ","수불이력":"受払履歴","수불이력 조회":"受払履歴照会","수불이력조회":"受払履歴照会","수불일자":"受払日","수율":"収率","수율 구간별 품목수":"収率区間別品目数","수율 구간은 60미만, 60~70, 70~80, 80~90, 90~100, 100이상의 6단계입니다.":"収率区間は60未満、60〜70、70〜80、80〜90、90〜100、100以上の6段階です。","수율 추이":"収率推移","수율별 품목수 분포 막대 차트에서 60미만~100이상 구간별 품목 수를 확인합니다.":"収率別品目数分布の棒グラフで60未満〜100以上の区間別品目数を確認します。","수정 모드(본인이 작성 중인 기록서): 전체 항목을 편집하고 수정 또는 완료 버튼으로 저장합니다.":"修正モード（本人が作成中の記録書）：全項目を編集し、修正または完了ボタンで保存します。","수정할 사용자의 체크박스를 선택한 뒤 사용자 수정 버튼을 누릅니다.":"修正するユーザーのチェックボックスを選択し、ユーザー修正ボタンを押します。","수축 필름":"シュリンクフィルム","순번":"順番","슬롯":"スロット","습도 센서 A":"湿度センサー A","습도 센서 B":"湿度センサー B","승인 버튼으로 일괄 승인하거나, 승인취소 버튼으로 본인이 승인한 마지막 단계를 취소합니다.":"承認ボタンで一括承認するか、承認取消ボタンで本人が承認した最後の段階を取り消します。","승인 버튼은 확인자 또는 책임자 권한 보유자에게만, 승인취소 버튼은 기록서 권한 보유자에게만 표시됩니다. 작업반 미선택 시 '작업반을 선택해주세요.'가 표시됩니다.":"承認ボタンは確認者または責任者権限保有者のみ、承認取消ボタンは記録書権限保有者のみに表示されます。作業班未選択時は「作業班を選択してください。」と表示されます。","승인대기":"承認待ち","승인대기 상태인 기록서만 승인할 수 있습니다.":"承認待ち状態の記録書のみ承認できます。","승인된 기록서만 승인취소할 수 있습니다.":"承認された記録書のみ承認取消できます。","승인상태":"承認状態","승인취소":"承認取消","시간겹침(2건 이상)·단일작업·가동 사이 빈시간 범례와 겹침 셀 합계를 확인합니다.":"時間重複（2件以上）・単一作業・稼働間の空き時間の凡例と重複セル合計を確認します。","시간대별 생산량":"時間帯別生産量","시스템 관리":"システム管理","시스템 사용자 계정을 조회하고 신규 사용자를 등록하거나 기존 사용자의 권한그룹·사용여부·서명 이미지를 수정합니다. 여기서 등록한 서명 이미지는 검사기록서 출력 시 결재란에 표시됩니다.":"システムユーザーアカウントを照会し、新規ユーザーを登録するか既存ユーザーの権限グループ・使用有無・署名画像を修正します。ここで登録した署名画像は検査記録書出力時に決裁欄に表示されます。","시작시간":"開始時間","시작일시":"開始日時","시카 진정 토너 200ml":"シカ鎮静トナー 200ml","신규 등록 시 비밀번호를 입력합니다. 수정 시 비밀번호를 비워 두면 기존 비밀번호가 유지됩니다.":"新規登録時にパスワードを入力します。修正時にパスワードを空欄にすると既存のパスワードが維持されます。","신규 등록은 사용자 추가 버튼을 눌러 사용자 등록 창에서 입력합니다.":"新規登録はユーザー追加ボタンを押してユーザー登録ウィンドウで入力します。","신규포장기준서":"新規包装基準書","신규포장기준서 출력":"新規包装基準書出力","실내 습도":"室内湿度","실시간 공정 모니터링":"リアルタイム工程モニタリング","실시간 공정 모니터링 - 공장·층별 모니터링":"リアルタイム工程モニタリング - 工場・階別モニタリング","실시간 공정 모니터링 - 설비 상세":"リアルタイム工程モニタリング - 設備詳細","실시간 모니터링":"リアルタイムモニタリング","실시간 생산량":"リアルタイム生産量","실시간 설비 모니터링, 충포장 실적입력과 현장 POP, 자재 입출고, 생산성·설비 종합효율 분석, 충포장·공정검사 기록서를 하나의 시스템에서 처리합니다.":"リアルタイム設備モニタリング、充填包装実績入力と現場POP、資材入出庫、生産性・設備総合効率分析、充填包装・工程検査記録書を一つのシステムで処理します。","실적 목록":"実績一覧","실적 목록에서 행을 선택하면 '기준' 실적의 센서 그래프와 최소/최대값 표가 표시됩니다.":"実績一覧で行を選択すると「基準」実績のセンサーグラフと最小/最大値表が表示されます。","실적 수정 상태에서는 '삭제실적표시' 체크로 취소된 실적도 함께 볼 수 있습니다.":"実績修正状態では「削除実績表示」チェックで取り消された実績も一緒に見られます。","실적SEQ":"実績SEQ","실적등록시간":"実績登録時間","실적별 센서 이력 비교":"実績別センサー履歴比較","실적비교추가":"実績比較追加","실적수정":"実績修正","실적수정 상태로 바꿀까요? 수정 중에는 기록서 작성이 제한됩니다.":"実績修正状態にしますか？修正中は記録書の作成が制限されます。","실적수정 상태에서는 '생산실적등록'으로 실적을 다시 등록합니다.":"実績修正状態では「生産実績登録」で実績を再登録します。","실적수정완료":"実績修正完了","실적수정을 완료할까요?":"実績修正を完了しますか？","실적입력으로 이동":"実績入力へ移動","실적작업반":"実績作業班","실적작업장":"実績作業場","실적정보가 없는 상태에서 실적수정완료를 적용하면 '실적정보가 없습니다. 실적정보를 등록 후 다시 시도해 주세요.' 경고가 표시됩니다.":"実績情報がない状態で実績修正完了を適用すると「実績情報がありません。実績情報を登録後に再度お試しください。」の警告が表示されます。","실제 속도 ÷ 표준 속도":"実際速度 ÷ 標準速度","실측 평균(g)":"実測平均（g）","실패":"失敗","심각":"深刻","아래 작업지시 목록에서 지시를 선택한 뒤 [작업준비]를 누르세요.":"下の作業指示一覧から指示を選択して[作業準備]を押してください。","아웃박스":"アウターボックス","아직 할당되지 않은 OPC UA 노드를 검색해 장비·센서종류·센서명 등을 지정한 뒤 작업장 센서로 등록합니다.":"まだ割り当てられていないOPC UAノードを検索し、装置・センサー種類・センサー名などを指定して作業場センサーとして登録します。","아직 할당되지 않은 OPC UA 노드를 선택해 작업장 센서로 등록합니다.":"まだ割り当てられていないOPC UAノードを選択して作業場センサーとして登録します。","압력":"圧力","약산성 클렌징 폼 150ml":"弱酸性クレンジングフォーム 150ml","양산 수량":"量産数量","양품 ÷ 생산수량":"良品 ÷ 生産数量","양품 기준":"良品基準","양품률":"良品率","양품수량":"良品数量","양품수량×60 ÷ 작업분":"良品数量×60 ÷ 作業分","양품수량을 입력하세요.":"良品数量を入力してください。","엑셀":"Excel","엑셀 버튼은 비활성 상태로 동작이 연결되어 있지 않습니다.":"Excelボタンは無効状態で動作が連携されていません。","연구개발담당":"研究開発担当","연구소 관리품 수량":"研究所管理品数量","연도-월-일":"年-月-日","연도·분기·작업반 단위로 생산 유형별 목표 인시생산성을 설정합니다. 설정한 목표는 생산성 조회 화면의 달성률 계산 기준이 됩니다.":"年度・四半期・作業班単位で生産タイプ別の目標人時生産性を設定します。設定した目標は生産性照会画面の達成率計算基準になります。","영상은 실시간 카메라가 아니라 설비 유형별로 미리 준비된 공정 영상(음소거·반복 재생)입니다.":"映像はリアルタイムカメラではなく、設備タイプ別に事前に用意された工程映像（ミュート・繰り返し再生）です。","영업담당":"営業担当","영업담당(전체)":"営業担当（全体）","예: 노즐 막힘":"例：ノズル詰まり","예상 잔여시간":"予想残り時間","예약 대상":"予約対象","예약 자재 입고 확인":"予約資材入庫確認","예약번호":"予約番号","예약수량":"予約数量","예약중재고":"予約中在庫","예약처리":"予約処理","예약처리 체크박스를 선택하고 저장 버튼을 누릅니다.":"予約処理チェックボックスを選択して保存ボタンを押します。","예약처리 체크박스를 선택한 뒤 저장 버튼을 누릅니다.":"予約処理チェックボックスを選択した後、保存ボタンを押します。","예약항번":"予約項番","오늘":"今日","오늘 생산 현황 요약":"本日の生産状況要約","오늘의 충포장 현황":"本日の充填包装状況","오차/충전용량":"誤差/充填容量","온도":"温度","온도 센서 A":"温度センサー A","온도 센서 B":"温度センサー B","완료 시 라인명·LOT No.(자사)·실충전량 등 필수값과 벌크 사용내역 1행 이상, 작업자 체크가 검증되며 누락 시 '필수 입력 항목을 확인해 주세요.'가 표시됩니다. 임시저장도 LOT No.(자사)는 필수입니다.":"完了時、ライン名・LOT No.（自社）・実充填量などの必須値とバルク使用内訳1行以上、作業者チェックが検証され、漏れがあると「必須入力項目を確認してください。」と表示されます。一時保存でもLOT No.（自社）は必須です。","완료 실적 확인·수정":"完了実績確認・修正","완료는 작성자 본인의 승인으로 기록되며 되돌리려면 [승인취소]를 거쳐야 합니다. 삭제는 확인자·책임자 승인 전에만 가능하며 삭제 후 복구할 수 없습니다.":"完了は作成者本人の承認として記録され、戻すには[承認取消]を経る必要があります。削除は確認者・責任者の承認前のみ可能で、削除後は復元できません。","완료된 작업이 없습니다.":"完了した作業がありません。","완료작업검색":"完了作業検索","완제품":"完製品","외관":"外観","외관(이물·흠집)":"外観（異物・傷）","왼쪽 고객사, 오른쪽 공급사 영역에서 담당자·주소·E-mail·전화번호를 확인한 뒤 창을 닫습니다.":"左側の顧客、右側の仕入先エリアで担当者・住所・E-mail・電話番号を確認してウィンドウを閉じます。","요청가능수량":"要求可能数量","요청수량":"要求数量","요청일":"要求日","요청일 기간(기본 오늘~오늘), 공장, 출고처(현장창고)를 지정하고 필요 시 품목코드·예약번호를 입력합니다.":"要求日期間（既定 今日〜今日）、工場、出庫先（現場倉庫）を指定し、必要に応じて品目コード・予約番号を入力します。","요청일(기본 오늘), 공장, 입고처(요청하는 작업반)를 지정하고 필요 시 출고처(복수 선택 가능)와 품목코드를 입력합니다.":"要求日（既定 今日）、工場、入庫先（要求する作業班）を指定し、必要に応じて出庫先（複数選択可）と品目コードを入力します。","요청일(기본 오늘), 공장, 입고처(작업반)를 지정하고 필요 시 출고처·품목코드·예약번호를 입력합니다.":"要求日（既定 今日）、工場、入庫先（作業班）を指定し、必要に応じて出庫先・品目コード・予約番号を入力します。","요청일은 ERP 예약 소요일자로 전송되며 비울 수 없습니다. 입고처와 공장은 필수입니다.":"要求日はERP予約の所要日として送信され、空欄にできません。入庫先と工場は必須です。","용기 캡":"容器キャップ","용기 흠집":"容器傷","우측 사용자 배정 그리드에서 배정 체크(또는 행 클릭)로 사용자를 추가·해제합니다. 헤더 체크박스로 보이는 사용자를 일괄 배정할 수 있습니다.":"右側のユーザー割当グリッドで割当チェック（または行クリック）によりユーザーを追加・解除します。ヘッダーのチェックボックスで表示中のユーザーを一括割当できます。","우측 상단 선택 박스에서 조회할 작업반을 선택합니다(진입 시 첫 작업반 자동 선택).":"右上の選択ボックスで照会する作業班を選択します（入場時に最初の作業班が自動選択）。","우측 작업 정보에서 지시번호, 지시·생산수량, 작업시간(분), 현재상태를 확인합니다.":"右側の作業情報で指示番号、指示・生産数量、作業時間（分）、現在状態を確認します。","우측에 해당 그룹의 화면별 접근여부가 표시되면 각 화면의 허용/불가 라디오를 선택합니다.":"右側に該当グループの画面別アクセス有無が表示されたら、各画面の許可/不可ラジオを選択します。","운영현황":"運営状況","원료":"原料","원시데이터 다운로드":"生データダウンロード","원인":"原因","원인이 없는 이벤트는 '미분류', 세부라인이 없는 이벤트는 '미지정'으로 표시됩니다.":"原因のないイベントは「未分類」、細部ラインのないイベントは「未指定」と表示されます。","원자재창고":"原材料倉庫","원천불량":"原因不良","월":"月","월별 전 공장 생산 실적":"月別全工場生産実績","월별·전월 실적 차트의 단위는 '단위: 10,000EA'입니다.":"月別・前月実績チャートの単位は「単位：10,000EA」です。","유실 공수":"ロス工数","유실 공수와 자재투입내역(사용량·파손수량)을 입력합니다.":"ロス工数と資材投入内訳（使用量・破損数量）を入力します。","유실 시각이 미기록된 이벤트와 작업시간 이상 실적은 집계에서 제외되며 하단에 건수가 안내됩니다.":"ロス時刻が未記録のイベントと作業時間異常の実績は集計から除外され、下部に件数が案内されます。","유실공수":"ロス工数","유실공수 27분":"ロス工数 27分","유실공수 41분":"ロス工数 41分","유실공수 {n}분":"ロス工数 {n}分","유실시간(분)":"ロス時間（分）","유실시간은 주/야간 휴식시간이 자동 차감되며, 저장 전 필수값·수량 검증을 거칩니다.":"ロス時間は昼/夜間の休憩時間が自動で差し引かれ、保存前に必須値・数量の検証を経ます。","유실유형":"ロスタイプ","유실인원":"ロス人員","유형 선택":"タイプ選択","유형별 벌크 수율 게이지 차트에서 상위 5개 유형의 평균 수율을 비교합니다.":"タイプ別バルク収率ゲージチャートで上位5タイプの平均収率を比較します。","유형별 생산량 영역에서 상위 5개 유형의 생산량 카드와 유형별 점유율(%) 파이 차트를 확인합니다.":"タイプ別生産量エリアで上位5タイプの生産量カードとタイプ別占有率（%）円グラフを確認します。","유형별 생산량 점유율":"タイプ別生産量占有率","유형별 인시생산성":"タイプ別人時生産性","유형별 인시생산성 카드와 유형별 달성률 도넛 차트로 유형별 성과를 비교합니다.":"タイプ別人時生産性カードとタイプ別達成率ドーナツチャートでタイプ別成果を比較します。","유형별 점유율":"タイプ別占有率","유형별 평균 벌크 수율":"タイプ別平均バルク収率","유형에서 비계획/계획을 선택해 이벤트를 필터링합니다.":"タイプで計画外/計画を選択してイベントをフィルタリングします。","유형을 선택해 주세요":"タイプを選択してください","유휴":"遊休","유휴 설비는 라벨(생산수량/진척율/품명)이 숨겨집니다.":"遊休設備はラベル（生産数量/進捗率/品名）が非表示になります。","육안":"目視","이 메뉴는 '가동률 조회' 권한이 있는 사용자에게 함께 노출됩니다.":"このメニューは「稼働率照会」権限のあるユーザーにも表示されます。","이 작업장에 진행 중인 작업이 있습니다.":"この作業場に進行中の作業があります。","이 행을 삭제할까요?":"この行を削除しますか？","이 화면 권한이 있으면 '노즐 시간겹침(중복작업) 조회' 메뉴도 함께 노출됩니다.":"この画面の権限があると「ノズル時間重複（重複作業）照会」メニューも表示されます。","이동할당":"移動割当","이미지 선택":"画像選択","이미지 추가":"画像追加","이상":"異常","이상알람(센서 이상) 표시는 화면에 토글이 있으나 실제 데이터 연동 없이 테스트 코드로만 동작합니다.":"異常アラーム（センサー異常）表示は画面にトグルがありますが、実データ連携なしでテストコードでのみ動作します。","이전 품목 잔여물 제거":"前品目残留物除去","이전요청수량":"前要求数量","인수량":"引受量","인시생산성":"人時生産性","인시생산성·목표 달성률":"人時生産性・目標達成率","인원":"人員","인원부족":"人員不足","일":"日","일련번호":"シリアル番号","일련번호를 누르면 기록서 상세 창이 열려 내용을 확인하거나 권한에 맞게 수정합니다.":"シリアル番号を押すと記録書詳細ウィンドウが開き、内容を確認するか権限に応じて修正します。","일련번호를 누르면 기록서를 엽니다":"シリアル番号を押すと記録書を開きます","일련번호를 눌러 기록서 상세 창에서 내용을 확인하거나, 본인이 작성 중인 기록서·관리자 권한 기록서를 수정합니다.":"シリアル番号を押して記録書詳細ウィンドウで内容を確認するか、本人が作成中の記録書・管理者権限の記録書を修正します。","일시 정지":"一時停止","일자":"日付","일자 범위(기본: 최근 7일)를 지정하고 작업반과 작업장을 선택합니다.":"日付範囲（既定：直近7日）を指定し、作業班と作業場を選択します。","임시저장 시에도 LOT 1차는 필수입니다. 입력초기화는 내용량 검사 값만 모두 지우며 되돌릴 수 없고, 행 단위 초기화는 실행 취소가 가능합니다.":"一時保存時もLOT 1次は必須です。入力初期化は内容量検査の値のみすべて消去し元に戻せません。行単位の初期化は取り消しが可能です。","임시저장으로 중간 저장하고 입력이 끝나면 완료 버튼으로 작성자 승인을 처리합니다.":"一時保存で途中保存し、入力が終わったら完了ボタンで作成者承認を処理します。","임시저장으로 중간 저장하고, 모든 항목이 완료되면 완료 버튼으로 작성자 승인까지 처리합니다.":"一時保存で途中保存し、すべての項目が完了したら完了ボタンで作成者承認まで処理します。","입고":"入庫","입고 받은 행의 입고확인 체크박스를 선택합니다.":"入庫した行の入庫確認チェックボックスを選択します。","입고수량":"入庫数量","입고의뢰수량":"入庫依頼数量","입고일":"入庫日","입고처":"入庫先","입고처와 공장은 필수이며, 입고처에 물류창고(2000)가 포함되면 처리할 수 없습니다.":"入庫先と工場は必須で、入庫先に物流倉庫（2000）が含まれると処理できません。","입고확인":"入庫確認","입고확인 대상":"入庫確認対象","입력초기화":"入力初期化","자동집계된 생산수량을 확인하고 양품·입고의뢰·QC 관리품 수량을 입력하며, 불량은 '불량등록'으로 입력합니다.":"自動集計された生産数量を確認し、良品・入庫依頼・QC管理品数量を入力し、不良は「不良登録」で入力します。","자재관리":"資材管理","자재관리번호":"資材管理番号","자재대기":"資材待ち","자재를 선택하세요.":"資材を選択してください。","자재별 사용파손·원천불량·수량부족 수량과 특이사항을 입력하고 BULK 자재는 관리번호를 선택합니다.":"資材別の使用破損・原因不良・数量不足数量と特記事項を入力し、BULK資材は管理番号を選択します。","자재예약 (창고 추가청구,작업반간 자재예약)":"資材予約（倉庫追加請求、作業班間資材予約）","자재유형":"資材タイプ","자재입고확인 (창고→작업반)":"資材入庫確認（倉庫→作業班）","자재출고 (현장창고)":"資材出庫（現場倉庫）","자재코드":"資材コード","자재투입내역":"資材投入内訳","자재환입 (작업반→창고)":"資材戻入（作業班→倉庫）","작성":"作成","작성 대상 지시 선택":"作成対象指示選択","작성 아이콘은 '작성자' 권한 보유자에게만 표시됩니다. 기록서 목록 창에서 이미 작성완료된 종류는 음영으로 표시됩니다.":"作成アイコンは「作成者」権限保有者のみに表示されます。記録書一覧ウィンドウで既に作成完了した種類は網掛けで表示されます。","작성 아이콘은 기록서 권한 관리에서 '작성자' 권한을 받은 사용자에게만 표시되며, 조회 대상도 본인에게 권한이 있는 작업장으로 한정됩니다.":"作成アイコンは記録書権限管理で「作成者」権限を受けたユーザーのみに表示され、照会対象も本人に権限がある作業場に限定されます。","작성된 공정검사 기록서를 검사일·작업반·종류·승인상태로 조회하고 승인/승인취소와 출력을 처리합니다. 일련번호를 눌러 기록서를 열람하거나 권한에 따라 수정합니다.":"作成された工程検査記録書を検査日・作業班・種類・承認状態で照会し、承認/承認取消と出力を処理します。シリアル番号を押して記録書を閲覧するか、権限に応じて修正します。","작성된 충포장 기록서를 검사일·작업반 기준으로 조회하고 결재(승인/승인취소)와 출력을 처리합니다. 일련번호를 눌러 기록서를 열람하거나 권한에 따라 수정·확인할 수 있습니다.":"作成された充填包装記録書を検査日・作業班基準で照会し、決裁（承認/承認取消）と出力を処理します。シリアル番号を押して記録書を閲覧するか、権限に応じて修正・確認できます。","작성완료":"作成完了","작성완료된 기록서가 있는 지시는 흐리게 표시됩니다":"作成完了した記録書がある指示は薄く表示されます","작성할 행의 작성 아이콘을 누르면 기록서 목록 창이 열립니다.":"作成する行の作成アイコンを押すと記録書一覧ウィンドウが開きます。","작성할 행의 작성 아이콘을 누르면 충포장 기록서 작성 화면으로 전환됩니다.":"作成する行の作成アイコンを押すと充填包装記録書作成画面に切り替わります。","작업 1건":"作業 1件","작업 전 확인사항 / 기능 확인사항":"作業前確認事項 / 機能確認事項","작업 전 확인사항과 기능 확인사항의 각 절차에 작업자 확인을 체크하고, 해당 없는 항목은 비고 (N/A)를 체크합니다. 헤더 체크박스로 일괄 확인할 수 있습니다.":"作業前確認事項と機能確認事項の各手順に作業者確認をチェックし、該当しない項目は備考（N/A）をチェックします。ヘッダーのチェックボックスで一括確認できます。","작업 정보":"作業情報","작업 준비":"作業準備","작업 중 'LOT 실적'으로 LOT 생산실적을 등록하고, 필요 시 '작업중단'으로 중단시간·인원을 저장합니다.":"作業中「LOT実績」でLOT生産実績を登録し、必要に応じて「作業中断」で中断時間・人員を保存します。","작업 중인 설비와 중단된 작업, 결재가 필요한 기록서를 먼저 확인하세요.":"作業中の設備と中断された作業、決裁が必要な記録書を先に確認してください。","작업 중인 지시의 LOT 단위 생산실적을 등록하는 팝업입니다. 작업시작·종료 시각, 작업인원, 생산성구분자, 생산일자·사용기한, 생산수량(자동집계)·양품·입고의뢰·QC 관리품·불량수량, 유실공수와 자재투입내역을 입력해 저장합니다.":"作業中の指示のLOT単位生産実績を登録するポップアップです。作業開始・終了時刻、作業人員、生産性区分子、生産日・使用期限、生産数量（自動集計）・良品・入庫依頼・QC管理品・不良数量、ロス工数と資材投入内訳を入力して保存します。","작업 화면에서 'LOT 실적' 버튼을 눌러 팝업을 엽니다.":"作業画面で「LOT実績」ボタンを押してポップアップを開きます。","작업 화면에서 'POP표기설정' 버튼을 누릅니다.":"作業画面で「POP表示設定」ボタンを押します。","작업경과":"作業経過","작업노즐":"作業ノズル","작업반":"作業班","작업반 / 작업장":"作業班 / 作業場","작업반 목록은 가동률 데이터가 연동된 일부 작업반으로 제한되어 표시됩니다.":"作業班一覧は稼働率データが連携された一部の作業班に限定して表示されます。","작업반 선택":"作業班選択","작업반 선택 박스의 안내 문구가 '진행 상태 선택'으로 표시되지만 실제로는 작업반 목록입니다.":"作業班選択ボックスの案内文が「進行状態選択」と表示されますが、実際は作業班一覧です。","작업반 전체수율 선 차트에서 기간별 평균 수율(%) 추이를 확인합니다.":"作業班全体収率の線グラフで期間別平均収率（%）推移を確認します。","작업반(라인)별 비가동률":"作業班（ライン）別非稼働率","작업반(필수)과 작업장, 진행상태 등 조건을 입력합니다.":"作業班（必須）と作業場、進行状態などの条件を入力します。","작업반(현장)에 남은 자재를 창고로 되돌리는 환입 예약을 생성합니다. 출고처(작업반)의 환입 가능 재고를 조회해 환입수량을 입력하고 저장하면 ERP에 예약이 생성되어 예약번호가 표시됩니다.":"作業班（現場）に残った資材を倉庫に戻す戻入予約を作成します。出庫先（作業班）の戻入可能在庫を照会して戻入数量を入力し保存すると、ERPに予約が作成され予約番号が表示されます。","작업반/작업장명 검색":"作業班/作業場名検索","작업반·기간별 벌크 수율 데이터를 조회해 수율 추이와 수율 구간별 품목수 분포를 보여 줍니다. 유형별 평균 벌크 수율을 게이지 차트로 비교할 수 있습니다.":"作業班・期間別のバルク収率データを照会し、収率推移と収率区間別品目数分布を表示します。タイプ別平均バルク収率をゲージチャートで比較できます。","작업반·생산 유형·기간별 충전/포장 생산실적을 집계해 보여 줍니다. 총 생산량, 라인 가동 대수, 지시 대비 생산실적 달성률과 생산량 추이, 유형별 생산량 점유율을 확인할 수 있습니다.":"作業班・生産タイプ・期間別の充填/包装生産実績を集計して表示します。総生産量、ライン稼働台数、指示に対する生産実績達成率と生産量推移、タイプ別生産量占有率を確認できます。","작업반·작업장을 선택해 해당 라인의 현재 작업 정보를 확인하고, 현장 모니터용 전체화면 POP 화면을 띄우는 화면입니다. 지시번호·제품·지시/생산수량과 작업시간이 1초 단위로 갱신됩니다.":"作業班・作業場を選択してそのラインの現在の作業情報を確認し、現場モニター用の全画面POP画面を表示する画面です。指示番号・製品・指示/生産数量と作業時間が1秒単位で更新されます。","작업반·작업장을 선택해 해당 설비의 현재 작업지시 정보, 벌크 검사 규격, 설비 진척률, 설비 센서값을 실시간으로 확인하는 화면입니다. 센서값은 1초 주기로 갱신되며 허용값 기준 정상/이상 여부가 함께 표시됩니다.":"作業班・作業場を選択してその設備の現在の作業指示情報、バルク検査規格、設備進捗率、設備センサー値をリアルタイムで確認する画面です。センサー値は1秒周期で更新され、許容値基準の正常/異常有無も表示されます。","작업반과 기간을 선택하면 자동으로 조회됩니다.":"作業班と期間を選択すると自動で照会されます。","작업반과 기간을 선택해 인시생산성(양품수량×60 ÷ 작업분)과 목표 대비 달성률을 차트로 분석합니다. 전체·유형별·라인별 인시생산성을 단계적으로 보여 주며, 분기별 목표생산성을 설정할 수 있습니다.":"作業班と期間を選択して人時生産性（良品数量×60 ÷ 作業分）と目標に対する達成率をチャートで分析します。全体・タイプ別・ライン別人時生産性を段階的に表示し、四半期別の目標生産性を設定できます。","작업반과 기간이 모두 선택되어야 조회되며, 조회 전에는 다운로드 버튼이 비활성화됩니다.":"作業班と期間がすべて選択されて照会され、照会前はダウンロードボタンが無効になります。","작업반과 생산 유형(전체 또는 개별 유형), 기간을 선택하면 자동으로 조회됩니다.":"作業班と生産タイプ（全体または個別タイプ）、期間を選択すると自動で照会されます。","작업반명":"作業班名","작업반별 OEE 순위":"作業班別OEE順位","작업반별 생산량":"作業班別生産量","작업반별 설비가동률 영역에서 설비별 가동률 도넛과 설비가동시간, 생산성 구분자를 확인합니다.":"作業班別設備稼働率エリアで設備別稼働率ドーナツと設備稼働時間、生産性区分子を確認します。","작업반별 작업장(설비) 목록을 조회하고 코드·작업장명·통계용구분·공정·생산성 구분자를 수정합니다. 선택한 작업장의 센서(OPC UA 노드)와 노즐을 탭으로 나누어 추가·수정·제거합니다.":"作業班別作業場（設備）一覧を照会し、コード・作業場名・統計用区分・工程・生産性区分子を修正します。選択した作業場のセンサー（OPC UAノード）とノズルをタブに分けて追加・修正・削除します。","작업반별 진척율":"作業班別進捗率","작업반은 필수이며 미선택 시 '작업반을 선택해주세요.'가 표시됩니다. 진행상태를 비우면 모든 상태가 조회됩니다.":"作業班は必須で、未選択時は「作業班を選択してください。」と表示されます。進行状態を空にするとすべての状態が照会されます。","작업반을 선택하고 일/주/월/년 기간 유형과 기간을 지정하면 자동으로 조회됩니다.":"作業班を選択し、日/週/月/年の期間タイプと期間を指定すると自動で照会されます。","작업반을 선택하지 않고 검색하면 '작업반을 선택해주세요.' 경고가 표시됩니다.":"作業班を選択せずに検索すると「作業班を選択してください。」の警告が表示されます。","작업반을 선택해 주세요.":"作業班を選択してください。","작업반이 창고에 자재를 추가 청구하거나 다른 작업반의 자재를 요청할 때 사용하는 예약 화면입니다. 출고처의 정상재고·품질검사재고·예약중재고를 확인하고 요청수량을 입력해 저장하면 ERP에 자재 예약이 생성됩니다.":"作業班が倉庫に資材を追加請求したり、別の作業班の資材を要求したりするときに使う予約画面です。出庫先の正常在庫・品質検査在庫・予約中在庫を確認し、要求数量を入力して保存するとERPに資材予約が作成されます。","작업반재고":"作業班在庫","작업배정목록":"作業割当一覧","작업배정목록(C00007)과 작업완료관리(C00024)에서도 같은 팝업을 사용합니다.":"作業割当一覧（C00007）と作業完了管理（C00024）でも同じポップアップを使用します。","작업상태":"作業状態","작업상태관리":"作業状態管理","작업상태관리에서 작업완료취소/실적수정/실적수정완료 중 하나를 고르고 '적용'을 누릅니다.":"作業状態管理で作業完了取消/実績修正/実績修正完了のいずれかを選び「適用」を押します。","작업상태는 작업 준비/정상 작업 중/일시 정지/유휴 설비로 표시됩니다.":"作業状態は作業準備/正常作業中/一時停止/遊休設備で表示されます。","작업상태를 적용했습니다.":"作業状態を適用しました。","작업시간":"作業時間","작업시간(분)":"作業時間（分）","작업시작":"作業開始","작업시작·작업종료 시각과 작업인원, 생산성구분자, 생산일자·사용기한을 입력합니다.":"作業開始・作業終了時刻と作業人員、生産性区分子、生産日・使用期限を入力します。","작업시작일시":"作業開始日時","작업완료":"作業完了","작업완료 버튼은 작업완료 체크박스를 선택해야 활성화됩니다.":"作業完了ボタンは作業完了チェックボックスを選択すると有効になります。","작업완료 행의 '추가자재 등록' 아이콘으로 추가자재 사용실적을 등록하거나 '추가자재 조회'로 확인합니다.":"作業完了行の「追加資材登録」アイコンで追加資材使用実績を登録するか、「追加資材照会」で確認します。","작업완료(S050) 상태의 지시 실적만 조회되며, 카운터기 그룹은 그래프 대상에서 제외됩니다.":"作業完了（S050）状態の指示実績のみ照会され、カウンター機グループはグラフ対象から除外されます。","작업완료관리":"作業完了管理","작업완료를 취소했습니다. 충ㆍ포장 실적입력에서 이어서 작업합니다.":"作業完了を取り消しました。充填・包装実績入力で続けて作業します。","작업완료취소":"作業完了取消","작업을 시작했습니다.":"作業を開始しました。","작업을 완료했습니다.":"作業を完了しました。","작업을 재개했습니다.":"作業を再開しました。","작업을 중단했습니다. 유실 공수로 집계됩니다.":"作業を中断しました。ロス工数として集計されます。","작업을 취소하고 지시를 대기 상태로 되돌릴까요? 입력한 실적은 유지됩니다.":"作業を取り消して指示を待機状態に戻しますか？入力した実績は維持されます。","작업을 취소했습니다.":"作業を取り消しました。","작업이 완료된 지시를 검색해 생산·양품·불량 수량, 자재투입내역, 작업시간·유실공수 등 완료 실적을 확인하고 관리하는 화면입니다. 작업상태관리로 작업완료취소·실적수정·실적수정완료를 적용하고, 작업장(노즐)별 완료취소와 추가자재 실적 처리를 수행합니다.":"作業が完了した指示を検索し、生産・良品・不良数量、資材投入内訳、作業時間・ロス工数などの完了実績を確認・管理する画面です。作業状態管理で作業完了取消・実績修正・実績修正完了を適用し、作業場（ノズル）別完了取消と追加資材実績処理を行います。","작업이 완료된 지시의 실적 단위로 설비 센서 이력을 라인 차트로 조회하는 화면입니다. 두 실적을 기준/비교로 겹쳐 작업 시작 기준 경과시간으로 비교할 수 있고, 센서별 최소·최대값과 측정시간을 표로 확인하며 원시데이터를 CSV로 내려받을 수 있습니다.":"作業が完了した指示の実績単位で設備センサー履歴を線グラフで照会する画面です。2つの実績を基準/比較として重ね、作業開始基準の経過時間で比較でき、センサー別最小・最大値と測定時間を表で確認し、生データをCSVでダウンロードできます。","작업이력":"作業履歴","작업인원":"作業人員","작업일 또는 개시일 기준을 선택해 기간을 지정하고 작업반을 선택합니다.":"作業日または開始日基準を選択して期間を指定し、作業班を選択します。","작업일 또는 개시일 중 하나를 기준으로 선택하고 기간을 지정합니다(두 기준은 동시에 적용되지 않습니다).":"作業日または開始日のいずれかを基準に選択し、期間を指定します（2つの基準は同時に適用されません）。","작업장":"作業場","작업장 관리":"作業場管理","작업장 관리 - 센서 추가":"作業場管理 - センサー追加","작업장 관리 - 작업장 수정":"作業場管理 - 作業場修正","작업장 그리드에서 행을 선택하고 [수정]을 누릅니다.":"作業場グリッドで行を選択して[修正]を押します。","작업장 단위 취소가 필요하면 '작업완료취소'를 체크하고 일시를 지정해 처리합니다.":"作業場単位の取消が必要な場合は「作業完了取消」をチェックし日時を指定して処理します。","작업장 목록":"作業場一覧","작업장 센서·진척률":"作業場センサー・進捗率","작업장 수정":"作業場修正","작업장 청결 상태 확인":"作業場清潔状態確認","작업장 추가":"作業場追加","작업장 행을 선택하면 우측에 노즐별 탭으로 지시정보(지시번호, 품목코드, 지시수량, 누적시간 등)가 표시됩니다.":"作業場の行を選択すると右側にノズル別タブで指示情報（指示番号、品目コード、指示数量、累積時間など）が表示されます。","작업장 행을 체크하면 우측에 해당 작업장의 센서/노즐 탭이 표시됩니다.":"作業場の行をチェックすると右側に該当作業場のセンサー/ノズルタブが表示されます。","작업장/노즐(완료 작업별 탭)":"作業場/ノズル（完了作業別タブ）","작업장·센서·노즐":"作業場・センサー・ノズル","작업장명":"作業場名","작업장별 기록서 권한":"作業場別記録書権限","작업장선택":"作業場選択","작업장을 선택하지 않고 [수정]을 누르면 '수정할 작업장을 선택해 주세요.' 경고가 표시됩니다.":"作業場を選択せずに[修正]を押すと「修正する作業場を選択してください。」の警告が表示されます。","작업장을 선택하지 않으면 'POP 출력' 버튼이 비활성화됩니다.":"作業場を選択しないと「POP出力」ボタンが無効になります。","작업장을 선택하지 않으면 '작업장을 선택해주세요.' 경고가 표시됩니다.":"作業場を選択しないと「作業場を選択してください。」の警告が表示されます。","작업장을 추가했습니다.":"作業場を追加しました。","작업장의 노즐별 작업 구간을 10분 단위 간트차트로 시각화해, 같은 시간대에 2건 이상 작업이 겹친 구간을 찾아냅니다. 겹침 구간만 골라 보거나 엑셀로 내보낼 수 있습니다.":"作業場のノズル別作業区間を10分単位ガントチャートで可視化し、同じ時間帯に2件以上の作業が重なった区間を見つけ出します。重複区間のみ絞って見たり、Excelで出力したりできます。","작업종료":"作業終了","작업종료 시간·종료구분(정상/비정상)·BULK 코드를 입력하고 작업완료를 체크한 뒤 '작업완료'를 누릅니다.":"作業終了時間・終了区分（正常/異常）・BULKコードを入力し、作業完了をチェックして「作業完了」を押します。","작업준비":"作業準備","작업준비 · 작업중 · 중단":"作業準備 · 作業中 · 中断","작업준비 상태로 바꿨습니다.":"作業準備状態にしました。","작업준비~완료·LOT 실적":"作業準備〜完了・LOT実績","작업준비를 취소하고 대기 상태로 되돌릴까요?":"作業準備を取り消して待機状態に戻しますか？","작업준비를 취소했습니다.":"作業準備を取り消しました。","작업준비부터 LOT 실적까지":"作業準備からLOT実績まで","작업중":"作業中","작업중 설비":"作業中設備","작업중단을 해제하고 작업을 재개할까요?":"作業中断を解除して作業を再開しますか？","작업지시":"作業指示","작업지시 검색":"作業指示検索","작업지시 목록":"作業指示一覧","작업지시 목록에서 대기 상태 지시를 선택하세요.":"作業指示一覧から待機状態の指示を選択してください。","작업지시 정보를 바탕으로 충포장기록서를 입력합니다. 기본 정보(구분·검사일·라인명·LOT No.), 작업 전/기능 확인사항 체크, 중량 정보와 벌크 사용내역, 지시량·생산량·수율, 특이사항과 코딩/라벨 이미지를 한 화면에서 기록합니다.":"作業指示情報を基に充填包装記録書を入力します。基本情報（区分・検査日・ライン名・LOT No.）、作業  지시·양산 수량, 진척율을 확인합니다.":"左側の映像と右側の運営状況表で指示番号、作業状態、指示・量産数量、進捗率を確認します。","좌측 작업장 선택 영역에서 작업반 1개를 선택하면 그 작업반의 작업장이 모두 선택됩니다. 필요하면 작업장 체크를 조정해 배정 범위를 좁힙니다.":"左側の作業場選択エリアで作業班を1つ選択すると、その作業班の作業場がすべて選択されます。必要に応じて作業場チェックを調整して割当範囲を絞ります。","좌측에서 작업반을 선택하고 작업장 행을 선택합니다.":"左側で作業班を選択し、作業場の行を選択します。","좌측에서 작업반을 선택하면 작업장 목록이 조회됩니다.":"左側で作業班を選択すると作業場一覧が照会されます。","주":"週","주소":"住所","주요 원인":"主要原因","주의":"注意","주의사항":"注意事項","준비취소":"準備取消","중":"中","중단저장":"中断保存","중단취소":"中断取消","중량 정보":"重量情報","지시 대비 달성률":"指示比達成率","지시 대비 진척율":"指示比進捗率","지시 대비 진척율, 전월 대비 생산량 비교·평균 설비가동률 비교·양품율 추이 차트를 확인합니다.":"指示比進捗率、前月比生産量比較・平均設備稼働率比較・良品率推移チャートを確認します。","지시 수량":"指示数量","지시 조회·지시서 출력":"指示照会・指示書出力","지시대비 생산실적 달성률 도넛 차트와 생산량 추이 선 차트를 확인합니다.":"指示比生産実績達成率ドーナツチャートと生産量推移の線グラフを確認します。","지시량":"指示量","지시번호":"指示番号","지시번호 칸의 '완료작업 검색'을 눌러 완료작업검색 팝업에서 지시를 찾아 선택합니다.":"指示番号欄の「完了作業検索」を押して完了作業検索ポップアップで指示を探して選択します。","지시번호·품목코드·품명이나 메뉴 이름으로 검색 (Enter)":"指示番号・品目コード・品名やメニュー名で検索（Enter）","지시번호선택":"指示番号選択","지시서":"指示書","지시서 출력":"指示書出力","지시수량":"指示数量","지시수량 대비 양품":"指示数量比良品","지시수량과 생산수량(누적/금일), 진척율 게이지로 작업 진행을 확인합니다.":"指示数量と生産数量（累積/本日）、進捗率ゲージで作業進行を確認します。","지시에 등록된 LOT 생산실적을 회차(카운터)별로 누계 조회하는 팝업입니다. 회차별 라벨 출력, 실적 취소·재등록을 수행하고 행을 클릭해 상세 정보를 확인합니다.":"指示に登録されたLOT生産実績を回次（カウンター）別に累計照会するポップアップです。回次別ラベル出力、実績取消・再登録を行い、行をクリックして詳細情報を確認します。","지시작업반":"指示作業班","지시작업장":"指示作業場","진공 테스트":"真空テスト","진척률":"進捗率","진척율":"進捗率","진척율 색상은 60% 이상 파랑, 30~60% 노랑, 30% 미만 빨강으로 표시됩니다.":"進捗率の色は60%以上が青、30〜60%が黄、30%未満が赤で表示されます。","진행 상태 선택":"進行状態選択","진행 중 지시":"進行中指示","진행 중인 작업":"進行中の作業","진행상태 '작업중'은 작업준비·시작·실적등록·중단 상태를 묶은 선택지입니다. 음영 범례 '작성완료된 기록서가 있는 건입니다.'는 기간 조건으로 조회했을 때만 표시됩니다.":"進行状態「作業中」は作業準備・開始・実績登録・中断状態をまとめた選択肢です。網掛け凡例「作成完了した記録書がある件です。」は期間条件で照会した場合のみ表示されます。","진행상태·작업반·작업장·품목코드·품목명·지시번호를 필요에 따라 입력하고 검색 버튼을 누릅니다.":"進行状態・作業班・作業場・品目コード・品目名・指示番号を必要に応じて入力し、検索ボタンを押します。","차단":"遮断","창고":"倉庫","창고별 재고":"倉庫別在庫","창고별 재고·수불이력":"倉庫別在庫・受払履歴","창고에서 작업반(현장)으로 이동 요청된 자재 예약 건을 조회하고, 실제로 받은 자재를 입고 확인 처리합니다. 확인 결과는 ERP에 재고이동으로 즉시 전송되며 행별 성공/실패가 색상으로 표시됩니다.":"倉庫から作業班（現場）へ移動要求された資材予約件を照会し、実際に受け取った資材を入庫確認処理します。確認結果はERPに在庫移動として即時送信され、行別の成功/失敗が色で表示されます。","책임자":"責任者","처리 가능 수량을 넘은 행은 실패로 표시됩니다. 수량을 고쳐 다시 저장하세요.":"処理可能数量を超えた行は失敗と表示されます。数量を直して再度保存してください。","처리 결과":"処理結果","처리 결과 창에서 결과를 확인하며, 성공 행에는 ERP 예약번호가 표시됩니다.":"処理結果ウィンドウで結果を確認し、成功行にはERP予約番号が表示されます。","처리 결과 창에서 성공/실패 건수와 사유를 확인합니다.":"処理結果ウィンドウで成功/失敗件数と理由を確認します。","처리 결과 창에서 성공/실패를 확인하고, 성공 행에는 생성된 예약번호가 표시됩니다.":"処理結果ウィンドウで成功/失敗を確認し、成功行には作成された予約番号が表示されます。","처리할 수 없는 행이 섞여 있으면 '선택한 N건 중 M건은 승인할 수 없습니다.' 안내가 표시되며, 승인취소는 본인이 승인한 마지막 단계만 가능합니다.":"処理できない行が混在していると「選択したN件のうちM件は承認できません。」と案内され、承認取消は本人が承認した最後の段階のみ可能です。","처리할 수량을 입력한 행이 없습니다.":"処理する数量を入力した行がありません。","첨부된 이미지가 없습니다.":"添付された画像がありません。","청소·세척":"清掃・洗浄","체크박스는 본인이 승인 또는 승인취소할 수 있는 행에서만 활성화됩니다.":"チェックボックスは本人が承認または承認取消できる行でのみ有効になります。","체크한 행이 없으면 '저장할 행을 체크해 주세요.' 경고가 표시됩니다.":"チェックした行がないと「保存する行をチェックしてください。」の警告が表示されます。","초":"初","초·말":"初・末","초·중·말":"初・中・末","초도입고":"初回入庫","초도출고":"初回出庫","총 생산량":"総生産量","최고 수율":"最高収率","최대":"最大","최대값 / 측정시간(값, 시간)":"最大値 / 測定時間（値、時間）","최소":"最小","최소값 / 측정시간(값, 시간)":"最小値 / 測定時間（値、時間）","최저 가동 설비":"最低稼働設備","최저 수율":"最低収率","최종생산":"最終生産","최종입고":"最終入庫","최종출고":"最終出庫","최초등록":"初回登録","추가 청구·작업반간 요청":"追加請求・作業班間要求","추가자재 등록":"追加資材登録","추가자재 등록 아이콘은 진행현황이 '작업완료'인 행에만 표시됩니다.":"追加資材登録アイコンは進行状況が「作業完了」の行のみに表示されます。","추가자재 사용실적":"追加資材使用実績","추가자재 사용실적 {n}건을 저장했습니다.":"追加資材使用実績{n}件を保存しました。","추가자재 사용실적 조회":"追加資材使用実績照会","추가자재 조회":"追加資材照会","추가자재사용실적등록":"追加資材使用実績登録","추가자재사용실적조회":"追加資材使用実績照会","출고":"出庫","출고 대상":"出庫対象","출고량":"出庫量","출고예약수량":"出庫予約数量","출고처":"出庫先","출고처 또는 입고처가 물류창고(2000)이면 처리할 수 없고, 요청수량이 가용 범위를 넘으면 '요청수량이 올바르지 않습니다' 메시지가 표시됩니다.":"出庫先または入庫先が物流倉庫（2000）の場合は処理できず、要求数量が可用範囲を超えると「要求数量が正しくありません」のメッセージが表示されます。","출고처리":"出庫処理","출고처리 체크박스를 선택하고 저장 버튼을 누릅니다.":"出庫処理チェックボックスを選択して保存ボタンを押します。","출고처와 공장은 필수이며, 출고처가 물류창고(2000)이거나 입고처가 1000·2000번인 행은 저장할 수 없습니다.":"出庫先と工場は必須で、出庫先が物流倉庫（2000）か入庫先が1000・2000番の行は保存できません。","출고할당":"出庫割当","출력":"出力","출력 아이콘으로 기록서 출력물을 새 창에서 엽니다.":"出力アイコンで記録書の出力物を新しいウィンドウで開きます。","출력 아이콘을 누르면 결재 서명이 포함된 기록서 출력물이 새 창으로 열립니다.":"出力アイコンを押すと決裁署名を含む記録書の出力物が新しいウィンドウで 標準書・包装基準書などの文書ボタンで該当品目の文書をダウンロードまたは出力します。","필요하면 이미지 선택 버튼으로 서명 이미지를 첨부하고, 썸네일을 눌러 미리보기로 확인합니다.":"必要に応じて画像選択ボタンで署名画像を添付し、サムネイルを押してプレビューで確認します。","필요하면 작업반과 기간 유형·기간을 변경합니다.":"必要に応じて作業班と期間タイプ・期間を変更します。","필요하면 진행상태·작업장·품목코드·품목명·지시번호를 입력하고 검색 버튼을 누릅니다.":"必要に応じて進行状態・作業場・品目コード・品目名・指示番号を入力し、検索ボタンを押します。","하이드라 수분 크림 50ml":"ハイドラ保湿クリーム 50ml","하한(g)":"下限（g）","합계":"合計","해당 작업장에 진행 중인 작업이 있어 취소할 수 없습니다.":"該当作業場に進行中の作業があるため取り消せません。","행을 누르면 기준 실적으로 그래프를 그립니다":"行を押すと基準実績でグラフを描きます","행을 누르면 아래에 완료 실적이 표시됩니다":"行を押すと下に完了実績が表示されます","행을 더블클릭하면 품목 상세조회 창에서 고객사·공급사 정보를 확인합니다.":"行をダブルクリックすると品目詳細照会ウィンドウで顧客・仕入先情報を確認します。","행을 두 번 누르면 상세 정보를 볼 수 있습니다. 취소한 회차는 [재등록]으로 되살립니다.":"行をダブルクリックすると詳細情報を表示できます。取り消した回次は[再登録]で復元します。","행을 두 번 누르면 품목 상세조회(고객사·공급사 정보)가 열립니다.":"行をダブルクリックすると品目詳細照会（顧客・仕入先情報）が開きます。","행을 클릭하면 '생산실적 누계정보 상세'에서 자재·유실·불량 내역을 확인합니다.":"行をクリックすると「生産実績累計情報詳細」で資材・ロス・不良内訳を確認します。","행의 수불이력(●) 셀을 클릭하면 해당 창고의 수불이력 조회 창이 열립니다.":"行の受払履歴（●）セルをクリックすると該当倉庫の受払履歴照会ウィンドウが開きます。","행의 아이콘을 눌러 지시서·신규포장기준서·포장기준서·포장이미지를 출력합니다.":"行のアイコンを押して指示書・新規包装基準書・包装基準書・包装画像を出力します。","허용":"許可","허용단위":"許容単位","현장 POP 화면":"現場POP画面","현장 POP 화면에 표시할 벌크 비중 정보와 코딩 정보를 설정하는 팝업입니다. LOT별 비중과 기준용량으로 충전 기준값을 계산해 POP 화면에 표기합니다.":"現場POP画面に表示するバルク比重情報とコーディング情報を設定するポップアップです。LOT別の比重と基準容量で充填基準値を計算し、POP画面に表示します。","현장 모니터 화면":"現場モニター画面","현장 모니터용 전체화면 POP 열기":"現場モニター用全画面POPを開く","현장 작업자":"現場作業者","현장 작업자가 설비(작업장)·노즐 단위로 작업지시를 배정하고 작업준비→작업시작→작업중단/재개→작업완료까지 작업 상태를 전이하며 LOT 생산실적을 입력하는 핵심 생산시점(POP) 화면입니다. 지시서·포장기준서 출력, BOM 조회, 추가자재 사용실적, POP 표기설정, 다음작업 설정을 함께 처리합니다.":"現場作業者が設備（作業場）・ノズル単位で作業指示を割り当て、作業準備→作業開始→作業中断/再開→作業完了まで作業状態を遷移させ、LOT生産実績を入力する中核の生産時点（POP）画面です。指示書・包装基準書出力、BOM照会、追加資材使用実績、POP表示設定、次作業設定も一緒に処理します。","현장창고 출고 처리":"現場倉庫出庫処理","현장창고(출고처)에 걸린 자재 예약 건을 조회하여 실제 출고량을 입력하고 출고 처리합니다. 저장 시 예약번호·항번 기준으로 ERP에 출고 전기가 이루어지고 행별 결과가 표시됩니다.":"現場倉庫（出庫先）にかかった資材予約件を照会し、実際の出庫量を入力して出庫処理します。保存時に予約番号・項番基準でERPに出庫転記が行われ、行別結果が表示されます。","현재 선택한 범위(전체·세부라인·설비)의 비가동 이벤트를 발생일시·원인별로 상세 조회합니다. 계획/비계획 유형을 전환해 볼 수 있습니다.":"現在選択した範囲（全体・細部ライン・設備）の非稼働イベントを発生日時・原因別に詳細照会します。計画/計画外タイプを切り替えて見られます。","현재 설정에서는 법인 선택 박스가 숨겨져 기본 법인으로 조회됩니다.":"現在の設定では法人選択ボックスが非表示になり、既定の法人で照会されます。","현재 지시 배정":"現在指示割当","현재상태":"現在状態","현재시간":"現在時刻","현재재고":"現在在庫","호퍼 레벨":"ホッパーレベル","화면 데이터는 10초마다, 현재 시각은 1초마다 갱신됩니다.":"画面データは10秒ごと、現在時刻は1秒ごとに更新されます。","화면 접속 이력":"画面アクセス履歴","화면(메뉴)명":"画面（メニュー）名","화면ID":"画面ID","화면에 들어오면 작업일 오늘, 진행상태 '작업중' 조건으로 자동 조회됩니다.":"画面に入ると作業日 今日、進行状態「作業中」の条件で自動照会されます。","화면에 들어오면 전체 사용자 목록이 자동으로 조회됩니다.":"画面に入ると全ユーザー一覧が自動で照会されます。","화면에 들어오면 최근 7일(오늘 포함) 기록이 접속일시 내림차순으로 자동 조회됩니다.":"画面に入ると直近7日（今日を含む）の記録がアクセス日時の降順で自動照会されます。","화면을 열면 첫 번째 작업반과 주 단위 기간으로 자동 조회됩니다.":"画面を開くと最初の作業班と週単位の期間で自動照会されます。","화장품 제조업 MES":"化粧品製造業MES","화장품 충포장 현장을 한 화면에서":"化粧品充填包装の現場を一画面で","확인자 확인":"確認者確認","확인자 확인 모드(해당 작업장 확인자, 승인 전): 확인자 체크박스만 체크하고 임시저장 또는 완료(승인)합니다.":"確認者確認モード（該当作業場確認者、承認前）：確認者チェックボックスのみチェックし、一時保存または完了（承認）します。","확인자는 작업자 체크가 된 항목만 체크할 수 있으며, 작성 내용이 미완성이면 '작성 내용(필수값/작업자 체크)이 완료되지 않아 승인할 수 없습니다.'가 표시됩니다.":"確認者は作業者チェックされた項目のみチェックでき、作成内容が未完成の場合「作成内容（必須値/作業者チェック）が完了していないため承認できません。」と表示されます。","환입":"戻入","환입 대상":"戻入対象","환입가능수량":"戻入可能数量","환입가능수량이 출고예약수량+환입수량보다 작으면 저장할 수 없고, 출고처가 물류창고(2000)이면 처리할 수 없습니다. 이미 예약이 생성된 행은 재조회 후 처리해야 합니다.":"戻入可能数量が出庫予約数量+戻入数量より小さいと保存できず、出庫先が物流倉庫（2000）の場合は処理できません。既に予約が作成された行は再照会後に処理する必要があります。","환입량":"戻入量","환입수량":"戻入数量","회차별 실적을 확인하고 '출력' 아이콘으로 포장 라벨을 출력합니다.":"回次別の実績を確認し、「出力」アイコンで包装ラベルを出力します。","달성률 = 양품수량 ÷ 지시수량 × 100 이며 최대 100%로 표시됩니다.":"達成率 = 良品数量 ÷ 指示数量 × 100 で、最大100%で表示されます。","설비가동률":"設備稼働率","양품율":"良品率","OEE = 가동률 × 성능가동률 × 양품률 ÷ 10000 (소수점 2자리)으로 계산됩니다.":"OEE = 稼働率 × 性能稼働率 × 良品率 ÷ 10000（小数点以下2桁）で計算されます。","(계획시간 − 비가동시간) ÷ 계획시간 × 100":"（計画時間 − 非稼働時間）÷ 計画時間 × 100","(생산수량 ÷ 가동시간) ÷ 표준 생산속도 × 100":"（生産数量 ÷ 稼働時間）÷ 標準生産速度 × 100"}};

  document.querySelectorAll("#rfm tbody tr").forEach(tr => tr.querySelectorAll("input").forEach((e, i) => D.m[tr.dataset.p + i] = e.value));
  D.note = document.getElementById("rfnote").value;
  const fin = () => {
    if (!rec) { rec = { id: uid(), cat: o.cat, kind: o.kind, wo: w.no, code: w.code, prod: w.prod, serial: (o.cat === "충포장" ? "CP-" : "PI-") + d(0).slice(2, 7).replace("-", "") + "-" + pad(40 + DB.recs.length), qty: w.good, date: D.date, writer: ME + "|" + now(), checker: "", chief: "", st: "임시저장" }; DB.recs.unshift(rec); }
    rec.data = JSON.parse(JSON.stringify(D)); rec.date = D.date;
    if (kind === "완료") { if (rec.st === "승인대기") rec.checker = ME + "|" + now(); rec.st = "승인대기"; }
    save(); closeAll(); refresh(); toast(kind === "완료" ? t("기록서를 완료했습니다. 기록서 목록에서 승인할 수 있습니다.") : t("임시저장했습니다."));
  };
  if (kind === "완료") { if (o.cat !== "충포장" && Object.keys(D.q).length < 6) return toast(t("공정검사 항목을 초기 판정까지 입력하세요.")); confirmBox(t("기록서를 완료할까요? 완료 후에는 확인자 확인과 승인 단계로 넘어갑니다."), fin); } else fin();
}
function recPrint(rec) { const w = DB.wo.find(x => x.no === rec.wo) || DB.wo[0]; modal(t("기록서 출력") + " · " + rec.serial, `<div class="br-doc"><h3>${tt(rec.cat === "충포장" ? "충포장 기록서" : rec.kind + " 공정검사 기록서")}</h3><div class="sub">${rec.serial} · ${rec.date}</div><table><tr><th>${tt("지시번호")}</th><td>${rec.wo}</td><th>${tt("품목")}</th><td>${rec.code} ${tt(rec.prod)}</td></tr><tr><th>${tt("작업장")}</th><td>${tt(w.ws)}</td><th>${tt("생산수량")}</th><td>${fmt(rec.qty)}</td></tr><tr><th>${tt("상태")}</th><td>${pill(rec.st)}</td><th>LOT</th><td>${w.lot}</td></tr></table><table><tr><th>${tt("담당자")}</th><th>${tt("확인자")}</th><th>${tt("책임자")}</th></tr><tr style="height:54px"><td>${rec.writer ? signedHTML(rec.writer) : ""}</td><td>${rec.checker ? signedHTML(rec.checker) : ""}</td><td>${rec.chief ? signedHTML(rec.chief) : ""}</td></tr></table></div>`, "md", [[t("인쇄"), "", () => printDoc(rec.serial)], [t("닫기"), "pri"]]); }


/* ================= 상단 검색·알림 ================= */
function globalSearch(q) {
  q = q.trim(); if (!q) return toast(t("검색어를 입력하세요."));
  const L = x => String(x).toLowerCase().includes(q.toLowerCase()) || t(x).toLowerCase().includes(q.toLowerCase());
  const wo = DB.wo.filter(x => [x.no, x.code, x.prod, x.ws].some(L)), rc = DB.recs.filter(x => [x.serial, x.wo, x.prod].some(L));
  const menus = MENU().flatMap(g => g.items).filter(x => L(x[1]));
  const sec = (tl, arr, f) => arr.length ? `<div class="sec-t">${tt(tl)} · ${arr.length}</div><div class="vlist">${arr.slice(0, 8).map(f).join("")}</div>` : "";
  modal(t("검색 결과") + " · " + q, (sec("작업지시", wo, x => `<div class="click" onclick="closeAll();C10.team='${x.team}';C10.ws='${x.ws}';openScreen('C00010')"><b class="mono">${x.no}</b> ${tt(x.prod)} · ${tt(x.ws)} ${pill(x.st)}</div>`) + sec("기록서", rc, x => `<div class="click" onclick="closeAll();openScreen('${x.cat === "충포장" ? "INS002" : "INS004"}');recOpen(DB.recs.find(r=>r.id==='${x.id}'))"><b class="mono">${x.serial}</b> ${tt(x.prod)} ${pill(x.st)}</div>`) + sec("메뉴", menus, x => `<div class="click" onclick="closeAll();openScreen('${x[0]}')">${tt(x[1])}</div>`)) || `<p class="muted">${tt("검색 결과가 없습니다.")}</p>`, "md");
}
function notifs() {
  const n = [...DB.wo.filter(w => w.st === "작업중단").map(w => [t("{ws} 작업중단 · {no}", { ws: t(w.ws), no: w.no }), `C10.team='${w.team}';C10.ws='${w.ws}';openScreen('C00010')`]), ...DB.recs.filter(r => r.st === "승인대기").slice(0, 6).map(r => [t("기록서 승인대기") + " · " + r.serial, `openScreen('${r.cat === "충포장" ? "INS002" : "INS004"}')`]), [t("{ws} 충전 온도 상한 근접", { ws: t("충전기 F-203") }), "C8.team='충전2반';C8.ws='충전기 F-203';openScreen('C00008')"]];
  modal(t("알림"), `<div class="vlist">${n.map(([x, g]) => `<div class="click" onclick="closeAll();${g}">${ic("bell")} ${esc(x)}</div>`).join("")}</div>`);
}

/* ================= 시작 ================= */
let LOGIN_MODE = "web";
function doLogin() {
  const pw = document.getElementById("lpw").value, idv = document.getElementById("lid").value.trim();
  if (!idv || !pw) { document.getElementById("lerr").classList.remove("hidden"); return; }
  document.getElementById("lerr").classList.add("hidden");
  document.getElementById("login").classList.add("hidden");
  if (LOGIN_MODE === "pop") { fromLogin = true; openPop(); return; }
  fromLogin = false; document.getElementById("app").classList.remove("hidden"); openScreen("HOME");
}
function logout() { clearInterval(GTIMER); clearInterval(PTIMER); closeAll(); document.getElementById("app").classList.add("hidden"); document.getElementById("pop").classList.add("hidden"); document.getElementById("login").classList.remove("hidden"); fromLogin = false; }
function setTheme(n) { document.documentElement.dataset.theme = n; document.getElementById("themeBtn").innerHTML = ic(n === "dark" ? "sun" : "moon"); try { localStorage.setItem("cmes-theme", n); } catch (e) {} }
function boot() {
  seed();
  document.querySelectorAll("[data-ic]").forEach(e => e.innerHTML = ic(e.dataset.ic));
  document.querySelectorAll(".lslot").forEach(e => e.innerHTML = langSw());
  document.querySelectorAll(".modes button").forEach(b => b.onclick = () => { document.querySelectorAll(".modes button").forEach(x => x.classList.remove("on")); b.classList.add("on"); LOGIN_MODE = b.dataset.m; });
  document.getElementById("btnLogin").onclick = doLogin;
  document.getElementById("lpw").onkeydown = e => { if (e.key === "Enter") doLogin(); };
  document.getElementById("logout").onclick = logout;
  document.getElementById("goPop").onclick = () => { fromLogin = false; openPop(C11.ws); };
  document.getElementById("themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  document.getElementById("bellBtn").onclick = notifs;
  document.getElementById("gsearch").onkeydown = e => { if (e.key === "Enter") globalSearch(e.target.value); };
  try { setTheme(localStorage.getItem("cmes-theme") || "dark"); } catch (e) { setTheme("dark"); }
  document.documentElement.lang = LANG;
  applyStatic();
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (CAL) return closeCal(); const m = document.querySelectorAll("#modalRoot .mask"); if (m.length) m[m.length - 1].remove(); } });
  if (location.hash === "#auto") { document.getElementById("login").classList.add("hidden"); document.getElementById("app").classList.remove("hidden"); openScreen("HOME"); }
}
boot();

</script>
