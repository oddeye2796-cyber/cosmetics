<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화장품 제조업 MES</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#060A13; --bg-grad:radial-gradient(1200px 600px at 85% -10%, rgba(56,189,248,.08), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(129,140,248,.07), transparent 60%);
  --surface:#0C1322; --surface2:#111A2C; --surface3:#16213A; --ink:#E6EDF7; --ink2:#C3CEE0; --muted:#8293AE; --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --accent:#38BDF8; --accent2:#22D3EE; --accent-ink:#04121C; --accent-soft:rgba(56,189,248,.12);
  --rail:#070C17; --rail-line:rgba(148,163,184,.10); --rail-ink:#C8D3E6; --rail-muted:#6E7F9C; --rail-active:linear-gradient(90deg, rgba(56,189,248,.22), rgba(56,189,248,.06));
  --ok:#34D399; --warn:#FBBF24; --crit:#FB7185; --info:#818CF8; --teal:#2DD4BF; --pur:#A78BFA;
  --ok-soft:rgba(52,211,153,.12); --warn-soft:rgba(251,191,36,.12); --crit-soft:rgba(251,113,133,.12); --info-soft:rgba(129,140,248,.14);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
  --f-sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F7FB; --bg-grad:radial-gradient(1100px 500px at 90% -20%, rgba(37,99,235,.06), transparent 60%);
  --surface:#FFFFFF; --surface2:#F8FAFC; --surface3:#F1F5F9; --ink:#0F172A; --ink2:#334155; --muted:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
  --accent:#2563EB; --accent2:#0891B2; --accent-ink:#FFFFFF; --accent-soft:#EFF6FF;
  --ok:#059669; --warn:#B45309; --crit:#E11D48; --info:#4F46E5; --teal:#0D9488; --pur:#7C3AED;
  --ok-soft:#ECFDF5; --warn-soft:#FFFBEB; --crit-soft:#FFF1F2; --info-soft:#EEF2FF;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 16px -8px rgba(15,23,42,.08); color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg) fixed;background-image:var(--bg-grad);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)} .small{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
h1{font-size:25px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.3}
.lede{color:var(--muted);margin:6px 0 0;max-width:80ch;font-size:13.5px}

/* ---------- 로그인 ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr)}
.lg-art{position:relative;overflow:hidden;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(130deg,#060B16 0%,#0B1730 50%,#1E1B4B 100%);color:#E2E8F0;border-right:1px solid var(--rail-line)}
.lg-art::after{content:"";position:absolute;right:-160px;top:-120px;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(56,189,248,.25),transparent);pointer-events:none}
.lg-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 30% 60%,#000 20%,transparent 75%)}
.lg-art>*{position:relative;z-index:1}
.lg-art h2{font-size:38px;line-height:1.25;letter-spacing:-.035em;margin:18px 0 12px;color:#F8FAFC;font-weight:800}
.lg-art h2 em{font-style:normal;background:linear-gradient(90deg,#38BDF8,#A5B4FC);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-art p{color:#A9B6CC;max-width:52ch;margin:0}
.lg-feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:30px}
.lg-feats div{border:1px solid rgba(148,163,184,.16);background:rgba(15,23,42,.5);border-radius:14px;padding:14px}
.lg-feats b{display:block;font-size:13.5px;color:#F1F5F9;margin:8px 0 2px}
.lg-feats span{font-size:12px;color:#94A3B8}
.lg-feats svg.i{width:20px;height:20px;color:#38BDF8}
.lg-foot{font-size:12px;color:#64748B}
.lg-form{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(28px,6vw,80px);gap:14px;background:var(--surface)}
.lg-top{display:flex;justify-content:flex-end}
.lg-form h3{font-size:24px;margin:0;letter-spacing:-.02em;color:var(--ink)}
.lg-form label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,.lg-form input,.fld input,.fld select,.fld textarea,select.input{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.lg-form input:focus,.fld input:focus,.fld select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);cursor:pointer;text-align:left}
.modes button b{display:block;font-size:13.5px}
.modes button small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.modes button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.modes button svg.i{width:20px;height:20px;color:var(--accent)}
.lg-hint{font-size:12px;color:var(--muted);border:1px dashed var(--line2);border-radius:10px;padding:8px 12px}
.errmsg{color:var(--crit);font-size:12.5px;font-weight:600}
.btn.block{width:100%;justify-content:center;height:44px;font-size:14px}

/* ---------- 틀 ---------- */
#app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--rail-line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;color:var(--rail-ink);scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 4px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0EA5E9,#6366F1);box-shadow:0 6px 18px -6px rgba(56,189,248,.55);flex:none}
.logo svg.i{width:19px;height:19px}
.brand .bt{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:16px;letter-spacing:-.02em;color:#F1F5F9}
.brand .bt span{font-size:11.5px;color:var(--rail-muted)}
.tenant{display:grid;gap:3px;padding:10px 12px;border-radius:12px;background:rgba(148,163,184,.06);border:1px solid var(--rail-line);font-size:12px}
.tenant .tl1{display:flex;justify-content:space-between;color:var(--rail-muted);font-size:11px}
.tenant .ok{display:inline-flex;align-items:center;gap:4px;color:#34D399}
.tenant .tl2{color:#E2E8F0;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--rail-muted);padding:10px 10px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:10px;color:var(--rail-ink);text-decoration:none;position:relative;transition:background .15s,color .15s;cursor:pointer}
.nav a:hover{background:rgba(148,163,184,.08);color:#fff}
.nav a svg.i{width:17px;height:17px;color:var(--rail-muted)}
.nav a .nl{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.nav a .nl span{font-size:13.5px;font-weight:600}
.nav a .nl small{font-size:11px;color:var(--rail-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a.on{background:var(--rail-active);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#38BDF8;box-shadow:0 0 12px #38BDF8}
.nav a.on svg.i{color:#38BDF8}
.nav a.on .nl small{color:#93C5FD}
.badge-n{margin-left:auto;font-size:11px;background:#F43F5E;color:#fff;border-radius:999px;padding:0 7px;font-weight:700;line-height:18px;box-shadow:0 0 10px rgba(244,63,94,.5)}
.scope{margin-top:auto;border:1px solid var(--rail-line);border-radius:12px;padding:12px;font-size:12px;display:grid;gap:8px;background:rgba(148,163,184,.05)}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#04121C;background:linear-gradient(135deg,#7DD3FC,#A5B4FC);flex:none}
.wn{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.scope .wn b{color:#F1F5F9;font-size:13px}
.wn small{color:var(--rail-muted);font-size:11px}
.scope .btn{background:transparent;border-color:var(--rail-line);color:var(--rail-ink);justify-content:center}

.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;padding:12px 32px;background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.crumb svg.i{width:14px;height:14px}
.tsearch{flex:1;max-width:520px;margin-inline:auto;display:flex;align-items:center;gap:10px;padding:0 16px;height:40px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tsearch svg.i{color:var(--accent)}
.tsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:13.5px}
.tsearch input::placeholder{color:var(--muted)}
.tacts{display:flex;align-items:center;gap:8px}
.scopechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--surface);white-space:nowrap}
.scopechip svg.i{width:13px;height:13px;color:var(--accent)}
.iconbtn{position:relative;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#F43F5E;box-shadow:0 0 8px #F43F5E}
.langsw{display:inline-flex;align-items:center;gap:2px;height:38px;padding:0 4px 0 9px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink2)}
.langsw>svg.i{width:15px;height:15px;margin-right:4px;color:var(--muted)}
.langsw button{min-width:30px;height:28px;padding:0 6px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-weight:700;font-size:12px;cursor:pointer}
.langsw button:hover{color:var(--ink)}
.langsw button.on{background:var(--accent);color:var(--accent-ink)}
main{padding:26px 32px 64px;min-width:0;width:100%;max-width:1560px;margin-inline:auto}

/* ---------- 공통 조각 ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.page-head .pid{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;vertical-align:middle}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line2);background:var(--surface2);border-radius:10px;padding:7px 13px;font-weight:700;font-size:13px;color:var(--ink);transition:all .15s;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 18px -8px var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-soft)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.sm svg.i{width:14px;height:14px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.card-h .cnt{font-size:12px;font-weight:600;color:var(--muted)}
.card-h .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.card-b{padding:16px 18px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.g2>.card{margin-bottom:16px}
.span2{grid-column:span 2}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid var(--line2);color:var(--ink2);line-height:1.6;vertical-align:middle}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.err{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.teal{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);border-color:transparent}
.pill.pur{background:color-mix(in srgb,var(--pur) 14%,transparent);color:var(--pur);border-color:transparent}
.signed{display:inline-flex;flex-direction:column;line-height:1.25;font-weight:600}
.signed small{font-size:10.5px;color:var(--muted);font-weight:500;font-family:var(--f-mono)}
.okv{color:var(--ok);font-weight:600;font-size:12.5px;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.click{cursor:pointer}
.click:hover{color:var(--accent)}

/* 히어로·KPI·알림 */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 30px;margin-bottom:18px;color:#E2E8F0;background:linear-gradient(120deg,#0B1222 0%,#0F1B33 45%,#1E1B4B 100%);border:1px solid rgba(148,163,184,.16);box-shadow:0 20px 40px -24px rgba(2,6,23,.8)}
.hero::after{content:"";position:absolute;right:-80px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(56,189,248,.28),transparent);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#7DD3FC;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);border-radius:999px;padding:4px 11px}
.eyebrow svg.i{width:13px;height:13px}
.hero h1{color:#F8FAFC;margin-top:12px;font-size:27px}
.hero p{color:#A9B6CC;margin:8px 0 0;max-width:80ch}
.hstats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;position:relative;z-index:1}
.hstat{display:flex;align-items:center;gap:8px;background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.18);border-radius:12px;padding:8px 12px;font-size:12.5px;color:#CBD5E1}
.hstat b{font-size:15px;color:#fff}
.hstat i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.kcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:16px 18px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--kc) 28%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--kc) 11%,var(--surface)) 0%,var(--surface) 60%);box-shadow:var(--shadow);min-width:0}
.kcard.go{cursor:pointer}
.kcard.go:hover{border-color:color-mix(in srgb,var(--kc) 60%,transparent);transform:translateY(-1px)}
.kcard .ki{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent);box-shadow:0 0 18px -4px var(--kc)}
.kcard .ki svg.i{width:17px;height:17px}
.kcard .kl{font-size:12.5px;font-weight:700;color:var(--muted);padding-right:40px}
.kcard .kv{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-top:6px}
.kcard .kv small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.kcard .kd{font-size:12px;color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.alert{display:grid;grid-template-columns:3px minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 14px 0;background:var(--surface);box-shadow:var(--shadow);position:relative;overflow:hidden}
.alert::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(500px 120px at 0% 0%, color-mix(in srgb,var(--sc) 12%,transparent), transparent 70%)}
.alert .sev{align-self:stretch;border-radius:0 3px 3px 0;background:var(--sc);box-shadow:0 0 12px var(--sc)}
.alert b{display:block;font-size:14.5px}
.alert p{font-size:13px;margin:3px 0 0;color:var(--ink2)}
.alert .acts{position:relative;z-index:1}
.stepper{list-style:none;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);margin:12px 0 2px}
.stepper .st{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);position:relative;text-align:center}
.stepper .st::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--line2)}
.stepper .st:first-child::before{display:none}
.stepper .st.done::before,.stepper .st.cur::before{background:var(--ok)}
.stepper .st i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);position:relative;z-index:1}
.stepper .st.done i{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 25%,var(--surface))}
.stepper .st.done i::after,.stepper .st.cur i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ok)}
.stepper .st.cur{color:var(--warn);font-weight:700}
.stepper .st.cur i{border-color:var(--warn);box-shadow:0 0 0 4px var(--warn-soft),0 0 12px var(--warn)}
.stepper .st.cur i::after{background:var(--warn)}

/* 조회 조건 */
.search{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px;padding:16px 18px 6px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .ctl{display:flex;align-items:center;gap:8px}
.fld .ctl input{min-width:0}
.fld.chk{justify-content:flex-end}
.fld.chk label{display:flex;align-items:center;gap:7px;height:40px;color:var(--ink2);cursor:pointer}
.fld.chk input,.chkrow input{width:16px;height:16px;accent-color:var(--accent)}
.fld textarea{height:auto;padding:10px 12px}
.search-act{display:flex;justify-content:flex-end;gap:8px;padding:6px 18px 16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px}

/* 표 */
.grid-wrap{overflow:auto;max-width:100%}
table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.grid th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-size:11.5px;font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.grid th:hover{color:var(--ink)}
table.grid td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.grid tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
table.grid tbody tr.sel td{background:var(--accent-soft)}
table.grid tbody tr.dim td{opacity:.55}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid td input{height:30px;width:100%;min-width:80px;padding:0 8px;border-radius:7px;border:1px solid var(--line2);background:var(--surface2);outline:none}
table.grid td input:focus{border-color:var(--accent)}
table.grid .ck{width:36px;text-align:center}
table.grid .ck input{width:15px;height:15px;min-width:0;accent-color:var(--accent)}
table.grid .empty{text-align:center;color:var(--muted);padding:28px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pg{display:flex;gap:4px}
.pg span{min-width:28px;height:28px;display:grid;place-items:center;border-radius:8px;cursor:pointer;border:1px solid var(--line);color:var(--ink2)}
.pg span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.inner{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.inner .card{margin:0;box-shadow:none;border:0}
.subtabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs>div{padding:11px 14px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.subtabs>div:hover{color:var(--ink)}
.subtabs>div.on{color:var(--ink);border-bottom-color:var(--accent)}
.card-b>.card{box-shadow:none}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.tbar.end{justify-content:flex-end;margin:12px 0 0;padding:0 12px 12px}
.desc{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:14px 18px;margin:-6px 0 18px;font-size:13px;color:var(--ink2)}
.desc ol{margin:6px 0 4px;padding-left:20px}
.desc .nt{font-size:12.5px;color:var(--muted)}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;font-size:13px;position:sticky;top:76px}
.tree .th{font-weight:800;font-size:12px;color:var(--muted);padding:4px 8px 8px;text-transform:uppercase;letter-spacing:.06em}
.tree .tn{padding:5px 8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tree .tn:hover{background:var(--surface2)}
.tree .tn.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tree .l1{font-weight:700}
.tree .l2{padding-left:18px;font-weight:600}
.tree .l3{padding-left:30px;color:var(--muted);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);flex:none}
.tile b{display:block;font-size:13.5px}
.tile small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.kvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kvgrid>div{display:flex;flex-direction:column;gap:3px;padding:10px 14px;background:var(--surface)}
.kvgrid span{font-size:11.5px;color:var(--muted);font-weight:700}
.kvgrid b{font-weight:600}
.vlist{display:flex;flex-direction:column;gap:2px}
.vlist>div,.vlist>label{padding:9px 12px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;gap:8px}
.vlist>div.click:hover{border-color:var(--accent)}
.chkrow{cursor:pointer}
table.kvt{width:100%;border-collapse:collapse;font-size:13px}
table.kvt th{width:42%;text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:8px 18px;border-bottom:1px solid var(--line)}
table.kvt td{padding:8px 18px;border-bottom:1px solid var(--line)}
table.kvt tr:last-child th,table.kvt tr:last-child td{border-bottom:0}

/* 종이 양식 (Logbook·BR) */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.paper .ph{display:grid;grid-template-columns:90px minmax(0,1fr) 260px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:18px}
.paper .ph>div{padding:12px;display:flex;align-items:center}
.paper .ttl{justify-content:center;font-size:19px;font-weight:800;letter-spacing:-.02em;border-left:1px solid var(--line2);border-right:1px solid var(--line2);text-align:center}
.paper .meta{flex-direction:column;align-items:stretch!important;padding:0!important}
.paper .meta>div{display:flex;justify-content:space-between;padding:6px 12px;font-size:12px;border-bottom:1px solid var(--line)}
.paper .meta>div:last-child{border-bottom:0}
.paper .meta span:first-child{color:var(--muted);font-weight:700}
.paper h5{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:18px 0 8px}
.h5t{margin-left:auto;display:flex;gap:6px}
.tw{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.paper textarea{width:100%;min-height:70px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);outline:none}
.sign-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sign{border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.sign .st{background:var(--surface2);padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.sign .sb{padding:12px 10px;min-height:56px;display:flex;align-items:center;justify-content:center}
.br-doc{background:#fff;color:#0F172A;border-radius:10px;padding:22px 24px;font-size:12.5px}
.br-doc h3{margin:0;text-align:center;font-size:18px;letter-spacing:.02em}
.br-doc .sub{text-align:center;color:#64748B;margin:2px 0 14px}
.br-doc table{width:100%;border-collapse:collapse;margin-bottom:12px}
.br-doc th,.br-doc td{border:1px solid #CBD5E1;padding:6px 9px;text-align:left}
.br-doc th{background:#F1F5F9;width:18%;font-weight:700;color:#334155}
.br-doc .pill{border-color:#CBD5E1}

/* 모달·전자서명·토스트 */
#modalRoot .mask{position:fixed;inset:0;z-index:60;background:rgba(2,6,23,.62);backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px}
.modal{width:min(520px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.modal.md{width:min(820px,100%)}
.modal.lg{width:min(1180px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px}
.mh .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:4px;border-radius:8px}
.mh .x:hover{background:var(--surface2);color:var(--ink)}
.mb{padding:16px 18px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.mtop{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.mtop .fld select{width:auto;height:34px}
.esign{display:flex;flex-direction:column;gap:6px}
.esign label{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.esign .warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink2);border-radius:10px;padding:10px 12px;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--surface3);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;box-shadow:0 12px 32px -12px rgba(0,0,0,.6);display:none;max-width:calc(100% - 32px)}

/* ---------- 공정 POP ---------- */
#pop{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);background-image:var(--bg-grad)}
#pop>.ph{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#pop>.ph .ttl{display:flex;flex-direction:column;line-height:1.25}
#pop>.ph .ttl b{font-size:16px}
#pop>.ph .ttl span{font-size:11.5px;color:var(--muted)}
#pop>.ph .r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pop .who .wn b{font-size:13px;color:var(--ink)}
#pop .who .wn small{color:var(--muted)}
.pb{padding:20px 24px 60px;max-width:1600px;margin:0 auto}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface2);transition:all .15s;min-width:0}
.step:hover{border-color:var(--accent)}
.step .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.step .t{font-weight:800;font-size:14px}
.step .s{font-size:11.5px;color:var(--muted)}
.step.done{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.step.done .s{color:var(--ok)}
.step.cur{border-color:var(--warn);background:var(--warn-soft);box-shadow:0 0 0 1px var(--warn) inset,0 0 18px -6px var(--warn)}
.step.cur .s{color:var(--warn);font-weight:700}
.step.view{outline:2px solid var(--accent);outline-offset:2px}
.gauge{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2);min-width:0}
.gauge.alarm{border-color:var(--warn);box-shadow:0 0 18px -6px var(--warn)}
.gauge .k{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.gauge .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gauge .v small{font-size:12px;color:var(--muted);margin-left:4px;font-weight:600}
.gauge .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0}
.gauge .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.gauge.alarm .bar i{background:var(--warn)}
.gauge .rg{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.spark{width:100%;height:40px;margin-top:4px;opacity:.85}
.rec-done{display:flex;flex-direction:column;line-height:1.25;font-family:var(--f-mono);font-weight:600;color:var(--ok)}
.rec-done small{font-family:var(--f-sans);color:var(--muted);font-size:10.5px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.steps{grid-template-columns:repeat(4,minmax(0,1fr))}#login{grid-template-columns:1fr}.lg-art{display:none}}
@media (max-width:820px){#app{grid-template-columns:1fr}.rail{position:static;height:auto}.topbar{flex-wrap:wrap;padding:10px 16px}main{padding:18px 16px 48px}.split{grid-template-columns:1fr}.tree{position:static}}
@media print{.rail,.topbar,#pop>.ph,.mf,.mh .x{display:none!important}#modalRoot .mask{position:static;background:none}.modal{box-shadow:none;border:0;max-height:none}}

/* ---------- 화장품 MES 추가 ---------- */
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g3>.card{margin-bottom:16px}
.chart{width:100%;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-sans)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--ink2);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:none;padding:7px 13px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.filters select{height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);padding:0 10px;min-width:150px}
.donuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--surface2);cursor:pointer}
.dcard:hover{border-color:var(--accent)}
.dcard b{display:block;font-size:14px}
.dcard small{color:var(--muted);font-size:12px}
.floor-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.floor-tabs button{border:1px solid var(--line2);background:var(--surface2);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--ink2)}
.floor-tabs button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.factory{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:16px;border-radius:14px;border:1px dashed var(--line2);background:repeating-linear-gradient(0deg,transparent 0 31px,var(--line) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,var(--line) 31px 32px)}
.eq{position:relative;border:1px solid var(--line2);border-radius:12px;background:var(--surface);padding:12px 12px 10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.eq:hover{transform:translateY(-2px);border-color:var(--accent)}
.eq .lamp{position:absolute;right:12px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--lc);box-shadow:0 0 12px var(--lc)}
.eq.run .lamp{animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.eq b{display:block;font-size:13.5px;padding-right:22px}
.eq small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq .pg2{height:6px;border-radius:99px;background:var(--line);margin:8px 0 4px;overflow:hidden}
.eq .pg2 i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.eq .nums{display:flex;justify-content:space-between;font-size:12px;font-family:var(--f-mono)}
.sensors{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sensors span{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;background:var(--surface2)}
.video{height:170px;border-radius:12px;background:linear-gradient(135deg,#0B1222,#1E1B4B);position:relative;overflow:hidden;margin-bottom:12px;display:grid;place-items:center;color:#94A3B8;font-size:12px}
.video .belt{position:absolute;left:0;right:0;bottom:38px;height:10px;background:repeating-linear-gradient(90deg,#334155 0 14px,#1E293B 14px 28px);animation:belt 1s linear infinite}
.video .bot{position:absolute;bottom:48px;width:22px;height:40px;border-radius:5px 5px 3px 3px;background:linear-gradient(#F9A8D4,#E879F9);animation:move 4s linear infinite}
@keyframes belt{to{background-position:28px 0}}
@keyframes move{from{left:-30px}to{left:100%}}
.sensor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.dt-wrap{position:relative;display:flex;align-items:center;min-width:0;flex:1}
.dt-wrap input{padding-right:34px!important}
.dt-wrap button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:4px}
.cal{position:fixed;z-index:95;width:268px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 40px -12px rgba(0,0,0,.6);padding:10px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13.5px;margin-bottom:6px}
.cal .ch button{border:0;background:var(--surface2);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--ink)}
.cal .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal .cg .w{color:var(--muted);font-weight:700;padding:4px 0}
.cal .cg button{border:0;background:none;border-radius:8px;height:30px;cursor:pointer;color:var(--ink)}
.cal .cg button:hover{background:var(--surface2)}
.cal .cg button.on{background:var(--accent);color:var(--accent-ink);font-weight:800}
.cal .cg button.td{outline:1px solid var(--accent)}
.cal .cf{display:flex;justify-content:space-between;margin-top:6px}
.gantt{overflow:auto;border:1px solid var(--line);border-radius:12px}
.gantt table{border-collapse:collapse;font-size:11px}
.gantt th,.gantt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;min-width:22px;height:30px;text-align:center}
.gantt th{background:var(--surface2);color:var(--muted);font-weight:700;padding:4px 2px;position:sticky;top:0}
.gantt td.nm,.gantt th.nm{position:sticky;left:0;background:var(--surface);min-width:120px;text-align:left;padding:0 10px;font-weight:700;z-index:1}
.gantt td.on{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.gantt td.ov{background:var(--crit);box-shadow:inset 0 0 0 1px #fff3}
.popbig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.bigv{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px 20px;box-shadow:var(--shadow)}
.bigv span{font-size:13px;color:var(--muted);font-weight:700}
.bigv b{display:block;font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.bigv b small{font-size:16px;color:var(--muted);margin-left:6px}
.bigv.hl{border-color:var(--accent);box-shadow:0 0 24px -10px var(--accent)}
.prog{height:22px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.prog span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px}
.statebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.wslist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.wslist div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13px}
.wslist div:hover{border-color:var(--accent)}
.wslist div.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.chkq{display:inline-flex;gap:4px}
.chkq button{border:1px solid var(--line2);background:var(--surface2);border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.chkq button.on.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chkq button.on.ng{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.chkq button.on.na{background:var(--surface3);color:var(--ink);border-color:var(--line2)}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:10px;padding:10px 12px;background:var(--surface2);cursor:pointer}
.mcard b{display:block}
.mcard small{color:var(--muted)}

<script>
const SPEC = [{"id":"C00003","name":"실시간 공정 모니터링","menu":"대시보드","sub":"","kind":"dashboard","purpose":"Unity WebGL 기반 3D 공장 모델 위에서 전 공장·층의 설비 가동 상태를 실시간으로 확인하는 화면입니다. 3D 모델에서 공장·층을 클릭하면 해당 층의 설비 배치도 위에 경광등(가동 상태)과 생산수량·진척율, 온습도 센서값이 표시됩니다.","search":[],"buttons":[],"grids":[],"tabs":[],"steps":["메뉴에 진입하면 3D 공장 모델이 로딩되며 진행률(%)이 표시됩니다.","3D 모델에서 확인할 공장·층을 클릭합니다.","층별 설비 배치도에서 경광등 색상으로 정상 작업 중/일시 정지/작업 준비/유휴 설비 상태를 확인합니다.","설비 위 라벨에서 생산수량과 진척율, 우측 범례에서 센서별 온도·습도를 확인합니다.","설비를 클릭하면 설비 상세(운영현황) 팝업이 열립니다."],"notes":["층 화면이 열려 있는 동안 설비 상태와 온습도는 5초마다 자동 갱신되며, 브라우저 탭이 보이지 않으면 갱신을 멈춥니다.","3D 화면 로딩에 실패하면 '3D 화면을 불러오지 못했습니다.' 메시지가 표시됩니다."]},{"id":"C00003-P1","name":"실시간 공정 모니터링 - 공장·층별 모니터링","menu":"대시보드","sub":"","kind":"dashboard","purpose":"3D 모델에서 선택한 공장·층의 설비 배치도를 오버레이로 띄워 설비별 가동 상태를 경광등으로 보여 줍니다. 각 설비 라벨에 누적 생산수량(개)과 지시 대비 진척율(%), 생산 품명이 표시되고, 범례 영역에 층별 온습도 센서값이 함께 표시됩니다.","search":[],"buttons":[],"grids":[],"tabs":[],"steps":["3D 모델에서 공장·층을 클릭하면 해당 층 배치도가 열립니다.","경광등 범례(정상 작업 중, 일시 정지, 작업 준비, 유휴 설비)로 설비 상태를 구분합니다.","범례 하단의 센서 #번호별 온도·습도를 확인합니다.","설비 영역을 클릭하면 설비 상세(운영현황) 팝업이 열립니다."],"notes":["별도 메뉴가 아니라 C00003 3D 모델 클릭으로만 열리는 화면입니다(공장·층별 레이아웃 13종).","유휴 설비는 라벨(생산수량/진척율/품명)이 숨겨집니다."]},{"id":"C00003-P2","name":"실시간 공정 모니터링 - 설비 상세","menu":"대시보드","sub":"","kind":"dashboard","purpose":"층별 배치도에서 클릭한 설비의 운영현황을 보여 주는 팝업입니다. 설비 유형별 공정 영상이 자동 재생되고, 현재 작업 중인 지시의 진행 정보가 표로 표시됩니다.","search":[],"buttons":["X"],"grids":[{"title":"운영현황","cols":["지시번호","상품코드","상품명","작업상태","시작시간","지시 수량","양산 수량","지시 대비 진척율"]}],"tabs":[],"steps":["층별 배치도에서 확인할 설비를 클릭합니다.","좌측 영상과 우측 운영현황 표에서 지시번호, 작업상태, 지시·양산 수량, 진척율을 확인합니다.","X 버튼 또는 배경을 클릭해 팝업을 닫습니다."],"notes":["영상은 실시간 카메라가 아니라 설비 유형별로 미리 준비된 공정 영상(음소거·반복 재생)입니다.","작업상태는 작업 준비/정상 작업 중/일시 정지/유휴 설비로 표시됩니다."]},{"id":"C00006","name":"전체내역 모니터링","menu":"대시보드","sub":"","kind":"dashboard","purpose":"전 공장의 당일 생산 진척 현황과 월별·공장별 생산 실적을 한 화면에서 보여 주는 경영 대시보드입니다. 공장별 진척율 도넛 차트와 지시량·생산량, 월별 전 공장 생산 실적(내부생산/사내외주/사외외주), 전월 공장별 포장·충전 실적 비중을 차트로 제공합니다.","search":[],"buttons":[],"grids":[],"tabs":[],"steps":["메뉴에 진입하면 오늘 기준 공장별 진척율과 지시량·생산량이 자동 조회됩니다.","'실시간 생산현황 모니터링' 카드에서 공장별 진척율을 비교합니다.","'월별 전 공장 생산 실적' 누적 막대 차트에서 내부생산·사내외주·사외외주 실적을 확인합니다.","'전월 공장별 포장실적', '전월 공장별 충전 실적' 원형 차트로 공장별 비중을 확인합니다.","공장명(>)을 클릭하면 해당 공장의 생산현황 상세 화면으로 이동합니다."],"notes":["월별·전월 실적 차트의 단위는 '단위: 10,000EA'입니다.","현재 설정에서는 법인 선택 박스가 숨겨져 기본 법인으로 조회됩니다."]},{"id":"C00006_1","name":"생산현황 상세","menu":"대시보드","sub":"","kind":"dashboard","purpose":"전체내역 모니터링에서 선택한 공장의 작업반별 생산 현황을 상세하게 보여 주는 화면입니다. 전체 지시수량·실시간 생산량, 라인별 생산 현황, 지시 대비 진척율과 전월 대비 생산량·설비가동률·양품율, 유형별 점유율을 제공합니다.","search":["진행 상태 선택"],"buttons":["전체내역으로 돌아가기"],"grids":[{"title":"라인별 생산 현황","cols":["라인","지시량","생산량"]}],"tabs":[],"steps":["전체내역 모니터링에서 공장명을 클릭해 진입합니다.","우측 상단 선택 박스에서 조회할 작업반을 선택합니다(진입 시 첫 작업반 자동 선택).","전체지시수량·실시간 전체 생산량 카드와 라인별 생산 현황 표를 확인합니다.","지시 대비 진척율, 전월 대비 생산량 비교·평균 설비가동률 비교·양품율 추이 차트를 확인합니다.","'전체내역으로 돌아가기' 버튼으로 전체내역 모니터링으로 돌아갑니다."],"notes":["좌측 메뉴에 없는 하위 화면이며 C00006의 공장 카드 클릭으로만 진입합니다(URL 쿼리 factory 유지).","작업반 선택 박스의 안내 문구가 '진행 상태 선택'으로 표시되지만 실제로는 작업반 목록입니다."]},{"id":"C00007","name":"작업배정목록","menu":"공정관리","sub":"","kind":"grid","purpose":"개시일 기간과 작업반·작업장 조건으로 작업지시(배정) 목록을 조회하는 화면입니다. 지시별 진행현황과 지시·생산수량을 확인하고, 지시서·포장기준서·포장이미지를 출력하며 작업완료 지시의 추가자재 사용실적을 등록·조회할 수 있습니다.","search":["개시일","작업반","작업장","진행상태","지시번호","품목코드","품목명"],"buttons":["초기화","검색"],"grids":[{"title":"작업배정목록","cols":["진행현황","개시일","지시번호","지시작업장","실적작업장","품목코드","품명","지시수량","생산수량","지시서","신규포장기준서","포장기준서","포장이미지","추가자재 등록","추가자재 조회"]}],"tabs":[],"steps":["개시일 기간을 확인합니다(기본값: 오늘 기준 -2주 ~ +2주).","작업반(필수)과 작업장, 진행상태 등 조건을 입력합니다.","검색 버튼을 눌러 작업지시 목록을 조회합니다.","행의 아이콘을 눌러 지시서·신규포장기준서·포장기준서·포장이미지를 출력합니다.","작업완료 행의 '추가자재 등록' 아이콘으로 추가자재 사용실적을 등록하거나 '추가자재 조회'로 확인합니다."],"notes":["작업반을 선택하지 않고 검색하면 '작업반을 선택해주세요.' 경고가 표시됩니다.","추가자재 등록 아이콘은 진행현황이 '작업완료'인 행에만 표시됩니다."]},{"id":"C00008","name":"설비별 현황 모니터링","menu":"공정관리","sub":"","kind":"dashboard","purpose":"작업반·작업장을 선택해 해당 설비의 현재 작업지시 정보, 벌크 검사 규격, 설비 진척률, 설비 센서값을 실시간으로 확인하는 화면입니다. 센서값은 1초 주기로 갱신되며 허 "공장을 선택하고 품목코드를 입력하거나 돋보기로 품목코드 검색 창을 열어 선택합니다.","조회방식(품목코드, 1단계전개, 다단계전개, 1단계역전개, 다단계역전개, 적용제품)과 기준수량을 지정합니다.","검색 버튼을 누르면 품목명과 관리단위·층별화·품목유형·조달구분·총리드타임·검사항목수 배지가 상단에 표시되고 결과가 그리드에 나타납니다.","행을 더블클릭하면 품목 상세조회 창에서 고객사·공급사 정보를 확인합니다.","필요 시 제품표준서·포장기준서 등 문서 버튼으로 해당 품목의 문서를 내려받거나 출력합니다."],"notes":["품목코드와 공장은 필수이며, 기준수량을 비우거나 0으로 입력하면 1로 조회합니다.","다단계전개/다단계역전개 조회 시 최상위 품목 행은 배경색으로 구분됩니다. 포장기준서·신규포장기준서·기존제품 이미지는 외부 리포트/문서 서버 창으로 열립니다."]},{"id":"MAT005-P1","name":"품목정보조회 - 품목 상세조회","menu":"자재관리","sub":"","kind":"pop","purpose":"품목정보조회 결과 행을 더블클릭하면 열리는 상세 창입니다. 품목 기본정보와 함께 해당 품목의 고객사 및 공급사 연락 정보를 한 화면에서 확인합니다.","search":[],"buttons":[],"grids":[{"title":"기본정보","cols":["품목코드","품목명","품목유형","관리유형"]},{"title":"● 고객사 / ● 공급사","cols":["고객사코드","고객사명","영업담당","영업담당(전체)","주소","E-mail","공급사코드","공급사명","구매담당","전화번호(FAX)"]}],"tabs":[],"steps":["품목정보조회 그리드에서 원하는 행을 더블클릭합니다.","상단 기본정보에서 품목코드·품목명·품목유형·관리유형을 확인합니다.","왼쪽 고객사, 오른쪽 공급사 영역에서 담당자·주소·E-mail·전화번호를 확인한 뒤 창을 닫습니다."],"notes":["조회 전용 창으로 수정 기능은 없습니다."]},{"id":"MAT006","name":"품목재고조회","menu":"자재관리","sub":"","kind":"grid","purpose":"공장과 품목코드로 ERP의 창고(저장위치)별 재고 현황을 조회합니다. 현재재고·사용불가·품질검사·이동할당·출고할당 수량과 초도/최종 입출고일을 한눈에 확인하고, 창고별 수불이력과 관리번호(로트)별 재고도 바로 열어 볼 수 있습니다.","search":["공장","품목코드"],"buttons":["수불이력조회","엑셀","검색"],"grids":[{"title":"창고별 재고","cols":["창고","수불이력","출고처","현재재고","사용불가","품질검사","이동할당","출고할당","가용재고","합계","초도입고","최종입고","초도출고","최종출고"]},{"title":"관리번호","cols":["관리번호","수량","단위"]}],"tabs":[],"steps":["공장을 선택하고 품목코드를 입력하거나 돋보기로 품목코드 검색 창을 열어 선택합니다.","검색 버튼을 누르면 창고(저장위치)별 재고가 그리드에 표시됩니다.","행의 수불이력(●) 셀을 클릭하면 해당 창고의 수불이력 조회 창이 열립니다.","맨 오른쪽 ● 셀을 클릭하면 해당 창고의 관리번호(로트)별 수량을 확인합니다.","상단 수불이력조회 버튼으로 저장위치 구분 없이 품목 전체의 수불이력을 조회할 수 있습니다."],"notes":["공장과 품목코드는 필수이며, 입력한 품목코드가 여러 건과 일치하면 품목코드 검색 창이 열립니다.","엑셀 버튼은 비활성 상태로 동작이 연결되어 있지 않습니다."]},{"id":"MAT006-P1","name":"품목재고조회 - 수불이력 조회","menu":"자재관리","sub":"","kind":"pop","purpose":"품목의 입고·출고·재고 수불 이력을 월 단위 시작 기간과 저장위치 조건으로 ERP에서 조회합니다. 전표번호, 수불유형, 벌크제조 LOT-NO, 제조일자까지 확인할 수 있습니다. 품목재고조회와 자재환입 화면에서 공통으로 사용합니다.","search":["품목코드","기간FROM","저장위치"],"buttons":["엑셀","검색"],"grids":[{"title":"수불이력","cols":["수불일자","수불유형","전표번호","저장위치","저장위치명","입고","출고","재고","초도입고","최종입고","초도출고","최종출고","벌크제조 LOT-NO","비고","제조일자"]}],"tabs":[],"steps":["품목재고조회의 수불이력(●) 셀 또는 수불이력조회 버튼, 자재환입의 수불이력 버튼으로 창을 엽니다.","품목코드는 자동으로 채워지며, 기간FROM 월을 지정합니다(기본 3개월 전 1일).","저장위치 코드를 입력하거나 옆의 검색 버튼으로 저장위치 검색 창에서 선택합니다.","검색 버튼을 누르면 수불이력이 그리드에 표시됩니다."],"notes":["기간은 매월 1일부터 조회 가능하며 YYYYMM 형식으로 지정합니다.","엑셀 버튼은 비활성 상태로 동작이 연결되어 있지 않습니다."]},{"id":"MAT001","name":"자재입고확인 (창고→작업반)","menu":"자재관리","sub":"","kind":"grid","purpose":"창고에서 작업반(현장)으로 이동 요청된 자재 예약 건을 조회하고, 실제로 받은 자재를 입고 확인 처리합니다. 확인 결과는 ERP에 재고이동으로 즉시 전송되며 행별 성공/실패가 색상으로 표시됩니다.","search":["요청일","공장","출고처","품목코드","입고처","예약번호"],"buttons":["검색","저장"],"grids":[{"title":"입고확인 대상","cols":["지시번호","소요일자","예약번호","예약항번","순번","자재코드","품명","단위","출고처","입고처","관리번호","로트선택","예약수량","입고수량","입고확인"]}],"tabs":[],"steps":["요청일(기본 오늘), 공장, 입고처(작업반)를 지정하고 필요 시 출고처·품목코드·예약번호를 입력합니다.","검색 버튼을 누르면 해당 기간의 이동 예약 건이 그리드에 표시됩니다.","관리번호가 없는 자재는 로트선택 열의 LOT 버튼으로 관리번호 조회 창에서 로트를 선택합니다.","입고 받은 행의 입고확인 체크박스를 선택합니다.","저장 버튼을 누르면 예약번호 단위로 ERP에 전송되고 처리 결과 창에 성공/실패 건수와 사유가 표시됩니다."],"notes":["입고처와 공장은 필수이며, 입고처에 물류창고(2000)가 포함되면 처리할 수 없습니다.","7로 시작하지 않는 자재는 로트(관리번호)를 반드시 입력해야 하며, 성공 행은 회색, 실패 행은 빨간색으로 표시됩니다."]},{"id":"MAT002","name":"자재환입 (작업반→창고)","menu":"자재관리","sub":"","kind":"grid","purpose":"작업반(현장)에 남은 자재를 창고로 되돌리는 환입 예약을 생성합니다. 출고처(작업반)의 환입 가능 재고를 조회해 환입수량을 입력하고 저장하면 ERP에 예약이 생성되어 예약번호가 표시됩니다.","search":["공장","출고처","품목코드","품목유형"],"buttons":["검색","저장"],"grids":[{"title":"환입 대상","cols":["자재유형","수불이력","자재코드","품명","단위","관리번호","LOT 선택","출고처","환입가능수량","출고예약수량","환입수량","입고처","예약처리","예약번호"]}],"tabs":[],"steps":["공장과 출고처(작업반, 복수 선택 가능)를 지정하고 필요 시 품목코드·품목유형을 입력합니다.","검색 버튼을 누르면 환입 가능한 자재가 품명 순으로 표시됩니다.","로트가 필요한 자재는 LOT 버튼으로 관리번호를 선택하고, 환입수량을 입력합니다(입력 후 Enter로 예약처리 체크 전환).","예약처리 체크박스를 선택한 뒤 저장 버튼을 누릅니다.","처리 결과 창에서 성공/실패를 확인하고, 성공 행에는 생성된 예약번호가 표시됩니다."],"notes":["품목유형이 부자재일 때 라벨보관실·필름보관실 제외 체크박스가 나타납니다.","환입가능수량이 출고예약수량+환입수량보다 작으면 저장할 수 없고, 출고처가 물류창고(2000)이면 처리할 수 없습니다. 이미 예약이 생성된 행은 재조회 후 처리해야 합니다."]},{"id":"MAT003","name":"자재예약 (창고 추가청구,작업반간 자재예약)","menu":"자재관리","sub":"","kind":"grid","purpose":"작업반이 창고에 자재를 추가 청구하거나 다른 작업반의 자재를 요청할 때 사용하는 예약 화면입니다. 출고처의 정상재고·품질검사재고·예약중재고를 확인하고 요청수량을 입력해 저장하면 ERP에 자재 예약이 생성됩니다.","search":["요청일","공장","출고처","품목코드","입고처"],"buttons":["검색","저장"],"grids":[{"title":"예약 대상","cols":["자재유형","자재코드","품명","단위","관리번호","LOT 선택","출고처","정상재고","품질검사재고","예약중재고","요청가능수량","요청수량","예약처리","예약번호"]}],"tabs":[],"steps":["요청일(기본 오늘), 공장, 입고처(요청하는 작업반)를 지정하고 필요 시 출고처(복수 선택 가능)와 품목코드를 입력합니다.","검색 버튼을 누르면 출고처별 재고가 품명 순으로 표시됩니다.","로트가 필요한 자재는 LOT 버튼으로 관리번호를 선택하고 요청수량을 입력합니다(기본값은 정상재고).","예약처리 체크박스를 선택하고 저장 버튼을 누릅니다.","처리 결과 창에서 결과를 확인하며, 성공 행에는 ERP 예약번호가 표시됩니다."],"notes":["요청일은 ERP 예약 소요일자로 전송되며 비울 수 없습니다. 입고처와 공장은 필수입니다.","출고처 또는 입고처가 물류창고(2000)이면 처리할 수 없고, 요청수량이 가용 범위를 넘으면 '요청수량이 올바르지 않습니다' 메시지가 표시됩니다."]},{"id":"MAT004","name":"자재출고 (현장창고)","menu":"자재관리","sub":"","kind":"grid","purpose":"현장창고(출고처)에 걸린 자재 예약 건을 조회하여 실제 출고량을 입력하고 출고 처리합니다. 저장 시 예약번호·항번 기준으로 ERP에 출고 전기가 이루어지고 행별 결과가 표시됩니다.","search":["요청일","공장","출고처","품목코드","예약번호"],"buttons":["검색","저장"],"grids":[{"title":"출고 대상","cols":["예약번호","예약항번","자재코드","품명","단위","출고처","입고처","관리번호","LOT 선택","정상재고","생산출고예약수량","이전요청수량","출고량","출고처리"]}],"tabs":[],"steps":["요청일 기간(기본 오늘~오늘), 공장, 출고처(현장창고)를 지정하고 필요 시 품목코드·예약번호를 입력합니다.","검색 버튼을 누르면 출고 대상 예약 건이 표시되며 출고량은 이전요청수량으로 미리 채워집니다.","로트가 필요한 자재는 LOT 버튼으로 관리번호를 선택하고 출고량을 조정합니다(Enter로 출고처리 체크 전환).","출고처리 체크박스를 선택하고 저장 버튼을 누릅니다.","처리 결과 창에서 성공/실패 건수와 사유를 확인합니다."],"notes":["출고처와 공장은 필수이며, 출고처가 물류창고(2000)이거나 입고처가 1000·2000번인 행은 저장할 수 없습니다.","7로 시작하지 않는 자재는 로트(관리번호) 입력이 필수입니다."]},{"id":"C_NEW_01","name":"생산성 조회","menu":"데이터 수집, 분석 관리","sub":"","kind":"dashboard","purpose":"작업반과 기간을 선택해 인시생산성(양품수량×60 ÷ 작업분)과 목표 대비 달성률을 차트로 분석합니다. 전체·유형별·라인별 인시생산성을 단계적으로 보여 주며, 분기별 목표생산성을 설정할 수 있습니다.","search":["작업반을 선택해 주세요.","일","주","월","년","기준 선택","유형 선택"],"buttons":["목표생산성 설정","원시데이터 다운로드"],"grids":[],"tabs":[],"steps":["작업반을 선택하고 일/주/월/년 기간 유형과 기간을 지정하면 자동으로 조회됩니다.","전체 인시생산성 영역에서 '기준 선택'으로 생산 유형을 골라 인시생산성(막대)과 목표 달성률(선) 복합 차트, 생산량 유형별 점유율(%) 파이 차트를 확인합니다.","유형별 인시생산성 카드와 유형별 달성률 도넛 차트로 유형별 성과를 비교합니다.","라인별 인시생산성 영역에서 '유형 선택'을 바꿔 라인별 달성률, 최근 3개월 달성률, 목표/실적 인시생산성을 확인합니다.","[원시데이터 다운로드]로 인시생산성 상세 엑셀을 내려받습니다."],"notes":["작업반과 기간이 모두 선택되어야 조회되며, 조회 전에는 다운로드 버튼이 비활성화됩니다.","달성률은 목표 대비 실적 비율로 최대 100%로 표시됩니다."]},{"id":"C_NEW_01-P1","name":"생산성 조회 - 목표생산성 설정","menu":"데이터 수집, 분석 관리","sub":"","kind":"pop","purpose":"연도·분기·작업반 단위로 생산 유형별 목표 인시생산성을 설정합니다. 설정한 목표는 생산성 조회 화면의 달성률 계산 기준이 됩니다.","search":["설정분기","년","분기","작업반을 선택해 주세요."],"buttons":["저장"],"grids":[{"title":"목표생산성 목록","cols":["설정 항목","목표생산성"]}],"tabs":[],"steps":["생산성 조회 화면에서 [목표생산성 설정] 버튼을 누릅니다.","설정분기의 연도와 분기(1분기~4분기), 작업반을 선택하면 유형별 기존 목표가 조회됩니다.","설정 항목별 목표생산성 칸에 값을 입력합니다.","[저장]을 누르고 확인 창에서 승인하면 저장됩니다."],"notes":["값이 변경되지 않으면 [저장] 버튼이 비활성화되며, 입력된 목표가 하나도 없으면 '설정된 목표생산성 정보가 없습니다.' 경고가 표시됩니다.","빈 칸으로 둔 항목은 저장 대상에서 제외됩니다."]},{"id":"C_NEW_012","name":"설비 종합효율 그래프","menu":"데이터 수집, 분석 관리","sub":"","kind":"dashboard","purpose":"가동률·성능가동률·양품률로 종합설비효율(OEE)을 산출해 KPI 카드와 추이·순위 차트로 보여 줍니다. 작업반을 선택하면 설비유형별, 설비별 OEE까지 드릴다운하여 비교할 수 있습니다.","search":["일","주","월","년","전체 작업반"],"buttons":["백데이터 다운로드"],"grids":[],"tabs":[],"steps":["기간 유형(일/주/월/년)과 기간을 지정하고 작업반을 선택합니다(기본값: 전체 작업반, 전일).","상단 KPI 카드에서 총합 OEE·가동률·성능가동률·양품률과 '계산식 보기'를 확인합니다.","전체 작업반 보기에서는 전체 OEE 추이(선 차트), 전체 작업반 TOP 5(가로 막대), 전일/전주 대비 변동 작업반, 집중관리 작업반(하위 5)을 확인합니다.","특정 작업반을 선택하면 설비유형 카드와 설비유형 OEE 비교(막대), 유형별 Top 5 설비, 설비 상세정보(일별 OEE 추이와 지표별 증감)를 확인하며, [전체] 버튼으로 전체 보기로 돌아갑니다.","[백데이터 다운로드]로 가동률·성능가동률·양품률 원시데이터 엑셀을 내려받습니다."],"notes":["OEE = 가동률 × 성능가동률 × 양품률 ÷ 10000 (소수점 2자리)으로 계산됩니다.","설비 상세의 손실시간 항목은 현재 '-'로 표시됩니다(보류)."]},{"id":"C00014","name":"생산실적(충 포장 실적 조회)","menu":"데이터 수집, 분석 관리","sub":"","kind":"dashboard","purpose":"작업반·생산 유형·기간별 충전/포장 생산실적을 집계해 보여 줍니다. 총 생산량, 라인 가동 대수, 지시 대비 생산실적 달성률과 생산량 추이, 유형별 생산량 점유율을 확인할 수 있습니다.","search":["작업반을 선택해 주세요.","유형을 선택해 주세요","일","주","월","년"],"buttons":["원시데이터 다운로드"],"grids":[],"tabs":[],"steps":["작업반과 생산 유형(전체 또는 개별 유형), 기간을 선택하면 자동으로 조회됩니다.","전체 생산량 영역에서 생산량(개)과 라인가동 대수(대)를 확인합니다.","지시대비 생산실적 달성률 도넛 차트와 생산량 추이 선 차트를 확인합니다.","유형별 생산량 영역에서 상위 5개 유형의 생산량 카드와 유형별 점유율(%) 파이 차트를 확인합니다.","[원시데이터 다운로드]로 충포장 실적 상세 엑셀을 내려받습니다."],"notes":["달성률 = 양품수량 ÷ 지시수량 × 100 이며 최대 100%로 표시됩니다.","기간 유형이 일·주이면 일별, 월이면 주차별, 년이면 월별로 추이가 묶입니다."]},{"id":"C00014A","name":"생산실적(수율 조회)","menu":"데이터 수집, 분석 관리","sub":"","kind":"dashboard","purpose":"작업반·기간별 벌크 수율 데이터를 조회해 수율 추이와 수율 구간별 품목수 분포를 보여 줍니다. 유형별 평균 벌크 수율을 게이지 차트로 비교할 수 있습니다.","search":["작업반을 선택해 주세요.","일","주","월","년"],"buttons":["원시데이터 다운로드"],"grids":[],"tabs":[],"steps":["작업반과 기간을 선택하면 자동으로 조회됩니다.","작업반 전체수율 선 차트에서 기간별 평균 수율(%) 추이를 확인합니다.","수율별 품목수 분포 막대 차트에서 60미만~100이상 구간별 품목 수를 확인합니다.","유형별 벌크 수율 게이지 차트에서 상위 5개 유형의 평균 수율을 비교합니다.","[원시데이터 다운로드]로 수율 상세 엑셀을 내려받습니다."],"notes":["수율 구간은 60미만, 60~70, 70~80, 80~90, 90~100, 100이상의 6단계입니다."]},{"id":"C00015","name":"가동률 조회","menu":"데이터 수집, 분석 관리","sub":"","kind":"dashboard","purpose":"ERP 가동시간 데이터를 기반으로 작업반의 평균 가동시간·가동대수·가동률과 기간별 가동률 추이를 보여 줍니다. 작업반 내 설비별 가동률과 가동시간도 카드로 확인할 수 있습니다.","search":["작업반 선택","일","주","월","년"],"buttons":["원시데이터 다운로드"],"grids":[],"tabs":[],"steps":["화면을 열면 첫 번째 작업반과 주 단위 기간으로 자동 조회됩니다.","필요하면 작업반과 기간 유형·기간을 변경합니다.","전체 가동률 영역에서 평균가동시간(hr), 평균가동대수(대), 가동률 도넛 차트, 가동률 추이 선 차트를 확인합니다.","작업반별 설비가동률 영역에서 설비별 가동률 도넛과 설비가동시간, 생산성 구분자를 확인합니다.","[원시데이터 다운로드]로 가동률 상세 엑셀을 내려받습니다."],"notes":["작업반 목록은 가동률 데이터가 연동된 일부 작업반으로 제한되어 표시됩니다.","이 화면 권한이 있으면 '노즐 시간겹침(중복작업) 조회' 메뉴도 함께 노출됩니다."]},{"id":"DTA002","name":"설비 비가동 분석","menu":"데이터 수집, 분석 관리","sub":"","kind":"dashboard","purpose":"설비 유실(비가동) 이벤트와 작업시간을 집계해 비가동률·누적 비가동 시간·발생 건수를 분석합니다. 전체 → 작업반(라인) → 세부라인 → 설비 순으로 드릴다운하며 주요 원인과 MTBF/MTTR 같은 신뢰성 지표를 확인합니다.","search":["일","주","월","년","전체 작업반"],"buttons":["상세 이벤트 로그 전체보기","원시데이터 다운로드","설비 보기"],"grids":[],"tabs":[],"steps":["기간 유형과 기간(기본: 전일), 작업반(기본: 전체 작업반)을 선택합니다.","전체 보기에서 전체 비가동률·누적 비가동 시간·총 발생 건수·관리 우선 라인 KPI와 관리 필요 라인, 비가동 시간 TOP 5, 주요 원인 TOP 9를 확인합니다.","라인을 클릭하거나 작업반을 선택하면 세부라인 현황 카드가 표시되고, 세부라인을 선택하면 발생 추이(다중 선 차트), 발생 빈도수 TOP 5, 원인 비중(파이 차트)을 확인합니다.","[설비 보기]로 소속 설비 목록을 열어 설비를 선택하면 설비 비가동률·MTBF·MTTR·발생 건수와 비가동 복합 추이(발생 빈도 막대 + 지속 시간 선) 리포트가 표시됩니다.","[상세 이벤트 로그 전체보기]로 이벤트 단위 로그를 확인하고, [원시데이터 다운로드]로 유실 이벤트 엑셀을 내려받습니다."],"notes":["비가동률 기준 상태는 심각(10% 이상)·주의(5% 이상)·정상(5% 미만)으로 표시됩니다.","유실 시각이 미기록된 이벤트와 작업시간 이상 실적은 집계에서 제외되며 하단에 건수가 안내됩니다."]},{"id":"DTA002-P1","name":"설비 비가동 분석 - 상세 이벤트 로그","menu":"데이터 수집, 분석 관리","sub":"","kind":"pop","purpose":"현재 선택한 범위(전체·세부라인·설비)의 비가동 이벤트를 발생일시·원인별로 상세 조회합니다. 계획/비계획 유형을 전환해 볼 수 있습니다.","search":["유형"],"buttons":[],"grids":[{"title":"상세 이벤트 로그","cols":["발생일시","생산라인","세부라인","설비명","원인","비가동률"]}],"tabs":[],"steps":["세부라인 현황 또는 설비 리포트에서 [상세 이벤트 로그 전체보기]를 누릅니다.","상단 요약에서 범위·세부라인·설비·로그 수를 확인합니다.","유형에서 비계획/계획을 선택해 이벤트를 필터링합니다.","컬럼 머리글을 눌러 정렬하며 원인과 비가동률을 확인합니다."],"notes":["원인이 없는 이벤트는 '미분류', 세부라인이 없는 이벤트는 '미지정'으로 표시됩니다."]},{"id":"DTA002-P2","name":"설비 비가동 분석 - 소속 설비","menu":"데이터 수집, 분석 관리","sub":"","kind":"pop","purpose":"선택한 세부라인에 포함된 설비를 카드로 보여 주며 비가동률·비가동 시간·발생 횟수를 비교합니다. 설비를 선택하면 설비 상세 리포트로 이동합니다.","search":["설비명 검색...","전체","심각","주의","정상","비가동률 순"],"buttons":[],"grids":[],"tabs":[],"steps":["세부라인을 선택한 뒤 [설비 보기]를 누릅니다.","설비명 검색, 상태 필터(전체/심각/주의/정상), 정렬(비가동률 순/발생 횟수 순/이름 순)로 목록을 좁힙니다.","설비 카드를 눌러 설비 상세 리포트로 이동합니다."],"notes":["검색 결과가 없으면 '검색 결과가 없습니다. 검색어나 필터를 변경해 보세요.'가 표시됩니다."]},{"id":"DUP001","name":"노즐 시간겹침(중복작업) 조회","menu":"데이터 수집, 분석 관리","sub":"","kind":"report","purpose":"작업장의 노즐별 작업 구간을 10분 단위 간트차트로 시각화해, 같은 시간대에 2건 이상 작업이 겹친 구간을 찾아냅니다. 겹침 구간만 골라 보거나 엑셀로 내보낼 수 있습니다.","search":["일자","작업반","작업장"],"buttons":["초기화","엑셀","검색"],"grids":[{"title":"노즐 시간겹침 간트차트","cols":["노즐","날짜","10분 단위 시간 슬롯(HH:MM)"]}],"tabs":[],"steps":["일자 범위(기본: 최근 7일)를 지정하고 작업반과 작업장을 선택합니다.","[검색]을 누르면 노즐별·날짜별 10분 단위 간트차트가 표시됩니다.","시간겹침(2건 이상)·단일작업·가동 사이 빈시간 범례와 겹침 셀 합계를 확인합니다.","'겹침만 보기' 스위치를 켜면 겹침이 있는 행만 표시됩니다.","[엑셀]로 현재 간트차트를 엑셀 파일로 내보냅니다."],"notes":["작업장을 선택하지 않으면 '작업장을 선택해주세요.' 경고가 표시됩니다.","이 메뉴는 '가동률 조회' 권한이 있는 사용자에게 함께 노출됩니다."]},{"id":"FAC001","name":"작업장 관리","menu":"설비 관리","sub":"","kind":"grid","purpose":"작업반별 작업장(설비) 목록을 조회하고 코드·작업장명·통계용구분·공정·생산성 구분자를 수정합니다. 선택한 작업장의 센서(OPC UA 노드)와 노즐을 탭으로 나누어 추가·수정·제거합니다.","search":["작업반 선택"],"buttons":["추가","제거","수정"],"grids":[{"title":"작업장","cols":["코드","작업장명","통계용구분","생산성 구분자"]},{"title":"센서","cols":["ID","장비명","센서명","센서종류","OPCUA노드","측정값종류","설정허용값","설정값","허용단위","카운터여부"]}],"tabs":["작업장","센서","노즐"],"steps":["좌측 상단에서 작업반을 선택하면 해당 작업반의 작업장 목록이 조회됩니다.","작업장 행을 체크하면 우측에 해당 작업장의 센서/노즐 탭이 표시됩니다.","[수정]을 눌러 작업장 정보를 변경하거나 삭제(사용안함)합니다.","센서 탭에서는 센서명·설정허용값·설정값 등을 셀에서 바로 수정하고, [추가]로 미할당 OPC UA 노드를 센서로 등록합니다.","노즐 탭에서는 노즐명·분당 CAPA를 셀에서 수정하고, [추가]/[제거]로 노즐을 등록·삭제합니다."],"notes":["작업장을 선택하지 않고 [수정]을 누르면 '수정할 작업장을 선택해 주세요.' 경고가 표시됩니다.","설정허용값은 측정값종류가 CUR인 센서에서만 수정할 수 있습니다. 노즐 그리드 컬럼은 ID·노즐명·분당 CAPA·사용여부입니다."]},{"id":"FAC001-P1","name":"작업장 관리 - 작업장 수정","menu":"설비 관리","sub":"","kind":"pop","purpose":"선택한 작업장의 기본 정보와 생산성 구분자를 수정하거나 작업장을 삭제(사용안함) 처리합니다.","search":["코드","작업장명","통계용구분","공정","생산성 구분자"],"buttons":["삭제","취소","저장"],"grids":[],"tabs":[],"steps":["작업장 그리드에서 행을 선택하고 [수정]을 누릅니다.","코드와 작업장명(필수), 통계용구분, 공정을 입력·선택합니다.","생산성 구분자를 복수 선택합니다.","[저장]을 눌러 반영하거나, [삭제]를 눌러 작업장을 사용안함 처리합니다."],"notes":["선택한 생산성 구분자는 해당 작업장의 모든 노즐에 일괄 반영됩니다.","코드·작업장명 미입력 시 '코드를 입력해 주세요.' / '작업장명을 입력해 주세요.' 메시지가 표시됩니다."]},{"id":"FAC001-P2","name":"작업장 관리 - 센서 추가","menu":"설비 관리","sub":"","kind":"pop","purpose":"아직 할당되지 않은 OPC UA 노드를 검색해 장비·센서종류·센서명 등을 지정한 뒤 작업장 센서로 등록합니다.","search":["Opcua Node","측정값종류","센서종류"],"buttons":["닫기","검색","저장"],"grids":[{"title":"미할당 OPC UA 노드","cols":["Opcua Node (TID)","측정값종류","장비","센서종류","센서명","카운터여부","설정값","허용단위"]}],"tabs":[],"steps":["센서 탭에서 [추가]를 누릅니다.","Opcua Node 검색어와 측정값종류·센서종류 조건을 입력하고 [검색]을 누릅니다.","등록할 노드 행을 체크하고 장비·센서종류·센서명 등을 셀에서 지정합니다.","[저장]을 눌러 센서로 등록합니다."],"notes":["체크한 행이 없으면 '저장할 행을 체크해 주세요.' 경고가 표시됩니다."]},{"id":"C00020","name":"사용자 관리","menu":"시스템 관리","sub":"","kind":"grid","purpose":"시스템 사용자 계정을 조회하고 신규 사용자를 등록하거나 기존 사용자의 권한그룹·사용여부·서명 이미지를 수정합니다. 여기서 등록한 서명 이미지는 검사기록서 출력 시 결재란에 표시됩니다.","search":["사용자 ID / 성명"],"buttons":["초기화","사용자 추가","사용자 수정","검색"],"grids":[{"title":"사용자 목록","cols":["사용자ID","성명","부서","권한","SSO여부","사용여부"]}],"tabs":[],"steps":["화면에 들어오면 전체 사용자 목록이 자동으로 조회됩니다.","사용자 ID 또는 성명을 입력하고 검색 버튼을 누르면 해당 사용자만 조회합니다(빈 값이면 전체 조회).","신규 등록은 사용자 추가 버튼을 눌러 사용자 등록 창에서 입력합니다.","수정할 사용자의 체크박스를 선택한 뒤 사용자 수정 버튼을 누릅니다.","등록·수정이 완료되면 목록이 자동으로 다시 조회됩니다."],"notes":["사용자를 선택하지 않고 사용자 수정을 누르면 '사용자를 선택해 주세요.' 안내가 표시됩니다.","부서 컬럼은 현재 값이 연결되어 있지 않아 비어 있습니다. SSO여부는 AD SSO 계정 여부를 나타내며, 화면에서 직접 등록한 사용자는 비 SSO 계정으로 저장됩니다."]},{"id":"C00020-P1","name":"사용자 관리 - 사용자 등록/수정","menu":"시스템 관리","sub":"","kind":"pop","purpose":"사용자 계정 정보를 입력해 신규 등록하거나 선택한 사용자의 정보를 수정하는 창입니다. 서명 이미지를 1개 첨부해 기록서 결재란 서명으로 사용할 수 있습니다.","search":[],"buttons":["이미지 선택","취소","저장"],"grids":[],"tabs":[],"steps":["성명과 사용자ID를 입력합니다(수정 시 사용자ID는 변경할 수 없습니다).","신규 등록 시 비밀번호를 입력합니다. 수정 시 비밀번호를 비워 두면 기존 비밀번호가 유지됩니다.","권한그룹과 사용여부(사용/미사용)를 선택합니다. 신규 등록 시 권한그룹은 INIT 그룹이 기본 선택됩니다.","필요하면 이미지 선택 버튼으로 서명 이미지를 첨부하고, 썸네일을 눌러 미리보기로 확인합니다.","저장하면 '등록되었습니다.' 또는 '수정되었습니다.' 메시지가 표시되고 창이 닫힙니다."],"notes":["필수값 누락 시 '성명을 입력해 주세요.', '사용자ID를 입력해 주세요.', '권한그룹을 선택해 주세요.', '사용여부를 선택해 주세요.' 메시지가 표시되며, 신규 등록에서 비밀번호가 비어 있으면 '비밀번호를 입력해 주세요.'가 표시됩니다.","서명 이미지는 1개만 유지되며 새 이미지를 선택한 경우에만 교체 저장됩니다."]},{"id":"C00021","name":"권한 관리","menu":"시스템 관리","sub":"","kind":"grid","purpose":"권한 그룹을 등록·수정하고, 권한 그룹별로 각 화면(메뉴)에 대한 접근 허용 여부를 지정합니다. 여기서 허용된 메뉴만 좌측 메뉴에 표시되고 화면에 진입할 수 있습니다.","search":[],"buttons":["등록","수정","저장"],"grids":[{"title":"권한 그룹","cols":["권한명","사용여부"]},{"title":"메뉴 권한","cols":["No.","화면ID","화면(메뉴)명","접근여부"]}],"tabs":[],"steps":["좌측 권한 그룹 목록에서 설정할 권한 그룹을 선택합니다.","우측에 해당 그룹의 화면별 접근여부가 표시되면 각 화면의 허용/불가 라디오를 선택합니다.","상단 저장 버튼을 눌러 변경한 접근여부를 일괄 저장합니다.","새 권한 그룹은 등록 버튼, 선택한 그룹의 이름·사용여부 변경은 수정 버튼으로 처리합니다."],"notes":["저장하지 않은 접근여부 변경이 있는 상태에서 다른 그룹을 선택하거나 등록/수정 창을 열면 '저장하지 않은 접근여부 변경이 있습니다. 이동하면 변경 내용이 사라집니다. 계속하시겠습니까?' 확인창이 표시됩니다.","권한명은 대소문자·앞뒤 공백을 무시하고 중복 여부를 검사하며, 중복이면 '이미 존재하는 권한명입니다.'가 표시됩니다."]},{"id":"C00022","name":"기록서 권한 관리","menu":"시스템 관리","sub":"","kind":"form","purpose":"검사기록서(충포장·공정검사)를 작성·확인·승인할 수 있는 사용자를 작업장 단위로 배정합니다. 작업반과 작업장을 선택한 뒤 사용자별로 기록서 권한(작성자·확인자·책임자·관리자)과 사용여부를 지정하며, 여러 작업반의 변경을 모아 한 번에 저장할 수 있습니다.","search":["작업반/작업장명 검색","성명 또는 사용자ID 검색","선택·변경만 보기"],"buttons":["되돌리기","전체 되돌리기","저장"],"grids":[{"title":"작업반 / 작업장","cols":["작업반명","인원","작업장명","인원"]},{"title":"사용자 배정","cols":["배정","No.","성명","사용자ID","권한","배정 작업장","사용여부","상태","서명"]}],"tabs":[],"steps":["좌측 작업장 선택 영역에서 작업반 1개를 선택하면 그 작업반의 작업장이 모두 선택됩니다. 필요하면 작업장 체크를 조정해 배정 범위를 좁힙니다.","우측 사용자 배정 그리드에서 배정 체크(또는 행 클릭)로 사용자를 추가·해제합니다. 헤더 체크박스로 보이는 사용자를 일괄 배정할 수 있습니다.","배정된 사용자의 권한(작성자/확인자/책임자/관리자)과 사용여부(사용/미사용)를 셀을 눌러 선택합니다.","다른 작업반으로 이동해 같은 방식으로 편집하면 변경 내용이 보류되며, 작업반 목록에 '변경' 배지가 표시됩니다.","저장 버튼을 누르면 변경 요약(추가·해제·확장 인원) 확인 후 변경 중인 모든 작업반이 한 번에 저장됩니다."],"notes":["권한이 선택되지 않은 배정 사용자가 있으면 저장이 차단되고 '권한이 선택되지 않은 사용자가 있습니다: …. 해당 사용자의 권한을 선택해 주세요.' 안내가 표시됩니다.","상태 컬럼은 매핑·일부·추가·확장·해제로 변경 내용을 표시합니다. 서명이 미등록인 사용자는 기록서 출력 시 서명란이 공백으로 표시되며, 서명은 사용자 관리 화면에서 등록합니다."]},{"id":"C00023","name":"접속 기록 조회","menu":"접속 기록 조회","sub":"","kind":"grid","purpose":"사용자가 좌측 메뉴로 진입한 화면 접속 기록을 기간·사용자·메뉴별로 조회합니다. 접속일시, 메뉴, 로그인ID, 접속IP 등을 확인해 시스템 사용 이력을 감사할 수 있습니다.","search":["기간","사용자","메뉴"],"buttons":["초기화","검색"],"grids":[{"title":"접속 기록","cols":["No","상세","접속일시","메뉴명","메뉴코드","로그인ID","사용자명","접속IP"]}],"tabs":[],"steps":["화면에 들어오면 최근 7일(오늘 포함) 기록이 접속일시 내림차순으로 자동 조회됩니다.","기간을 지정하고 사용자(로그인ID 또는 사용자명)와 메뉴를 필요에 따라 선택합니다.","검색 버튼을 누르면 조건에 맞는 기록이 50건 단위로 불러와지며 하단에 전체 건수가 표시됩니다.","컬럼 헤더를 눌러 서버 정렬할 수 있습니다(사용자명 컬럼 제외).","상세 아이콘을 누르면 접속 상세 창에서 서버IP와 브라우저 URL까지 확인합니다."],"notes":["조회 기간은 필수이며 최대 90일까지 가능합니다. 위반 시 '조회 기간을 입력해 주세요.', '시작일은 종료일보다 늦을 수 없습니다.', '조회 기간은 최대 90일까지 가능합니다.' 메시지가 표시됩니다.","메뉴 선택 목록에는 좌측 메뉴에 실제 노출되는 화면만 표시됩니다."]},{"id":"INS001","name":"충포장 기록서 작성","menu":"검사기록","sub":"충포장 기록서","kind":"grid","purpose":"내 기록서 권한이 있는 작업장의 작업지시를 조회해 충포장 기록서를 작성할 대상을 고릅니다. 작업일 또는 개시일 기준으로 검색하며, 작성완료된 기록서가 있는 건은 음영으로 구분됩니다.","search":["작업일","개시일","진행상태","작업반","작업장","품목코드","품목명","지시번호"],"buttons":["초기화","검색"],"grids":[{"title":"작업지시 목록","cols":["지시번호","품목코드","지시수량","품명","실적작업장","진행상태","개시일","작성"]}],"tabs":[],"steps":["화면에 들어오면 작업일 오늘, 진행상태 '작업중' 조건으로 자동 조회됩니다.","작업일 또는 개시일 중 하나를 기준으로 선택하고 기간을 지정합니다(두 기준은 동시에 적용되지 않습니다).","진행상태·작업반·작업장·품목코드·품목명·지시번호를 필요에 따라 입력하고 검색 버튼을 누릅니다.","작성할 행의 작성 아이콘을 누르면 충포장 기록서 작성 화면으로 전환됩니다."],"notes":["작성 아이콘은 기록서 권한 관리에서 '작성자' 권한을 받은 사용자에게만 표시되며, 조회 대상도 본인에게 권한이 있는 작업장으로 한정됩니다.","진행상태 '작업중'은 작업준비·시작·실적등록·중단 상태를 묶은 선택지입니다. 음영 범례 '작성완료된 기록서가 있는 건입니다.'는 기간 조건으로 조회했을 때만 표시됩니다."]},{"id":"INS001-P1","name":"충포장 기록서 작성 - 기록서 입력","menu":"검사기록","sub":"충포장 기록서","kind":"form","purpose":"작업지시 정보를 바탕으로 충포장기록서를 입력합니다. 기본 정보(구분·검사일·라인명·LOT No.), 작업 전/기능 확인사항 체크, 중량 정보와 벌크 사용내역, 지시량·생산량·수율, 특이사항과 코딩/라벨 이미지를 한 화면에서 기록합니다.","search":[],"buttons":["벌크코드 불러오기","행 추가","이미지 추가","닫기","삭제","임시저장","완료"],"grids":[{"title":"작업 전 확인사항 / 기능 확인사항","cols":["구분","절차","작업자","확인자","비고"]},{"title":"벌크 사용내역","cols":["품목코드","LOT No.","인수량","사용량","환입량","생산량","삭제"]}],"tabs":[],"steps":["상단에서 구분(충전/포장)을 선택하고 검사일, 라인명, LOT No.(자사), LOT No.(고객사)를 입력합니다. LOT No.(자사)는 BULK 코드 조회 또는 직접 입력으로 채웁니다.","작업 전 확인사항과 기능 확인사항의 각 절차에 작업자 확인을 체크하고, 해당 없는 항목은 비고 (N/A)를 체크합니다. 헤더 체크박스로 일괄 확인할 수 있습니다.","표시용량·비 중·실충전량(g)을 입력하면 표시용량 X 비중(ml)이 자동 계산됩니다. 벌크코드 불러오기로 BOM의 벌크를 가져와 인수량·사용량·환입량·생산량을 입력합니다.","특이사항을 입력하고 코딩/라벨 이미지를 최대 5개까지 첨부합니다.","임시저장으로 중간 저장하고, 모든 항목이 완료되면 완료 버튼으로 작성자 승인까지 처리합니다."],"notes":["완료 시 라인명·LOT No.(자사)·실충전량 등 필수값과 벌크 사용내역 1행 이상, 작업자 체크가 검증되며 누락 시 '필수 입력 항목을 확인해 주세요.'가 표시됩니다. 임시저장도 LOT No.(자사)는 필수입니다.","완료는 작성자 본인의 승인으로 기록되며 되돌리려면 [승인취소]를 거쳐야 합니다. 삭제는 확인자·책임자 승인 전에만 가능하며 삭제 후 복구할 수 없습니다."]},{"id":"INS002","name":"충포장 기록서 목록","menu":"검사기록","sub":"충포장 기록서","kind":"grid","purpose":"작성된 충포장 기록서를 검사일·작업반 기준으로 조회하고 결재(승인/승인취소)와 출력을 처리합니다. 일련번호를 눌러 기록서를 열람하거나 권한에 따라 수정·확인할 수 있습니다.","search":["검사일","작업반","작업장","품목코드","품목명","지시번호","승인상태"],"buttons":["초기화","승인","승인취소","검색"],"grids":[{"title":"기록서 목록","cols":["지시번호","품목코드","품목명","일련번호","생산수량","종류","검사일","담당자","확인자","책임자","출력"]}],"tabs":[],"steps":["검사일 기간과 작업반(필수)을 선택하고 필요한 조건을 입력한 뒤 검색 버튼을 누릅니다.","결재할 기록서의 체크박스를 선택합니다(본인이 처리할 수 있는 행만 선택할 수 있습니다).","승인 버튼으로 일괄 승인하거나, 승인취소 버튼으로 본인이 승인한 마지막 단계를 취소합니다.","일련번호를 누르면 기록서 상세 창이 열려 내용을 확인하거나 권한에 맞게 수정합니다.","출력 아이콘을 누르면 결재 서명이 포함된 기록서 출력물이 새 창으로 열립니다."],"notes":["승인 버튼은 확인자 또는 책임자 권한 보유자에게만, 승인취소 버튼은 기록서 권한 보유자에게만 표시됩니다. 작업반 미선택 시 '작업반을 선택해주세요.'가 표시됩니다.","처리할 수 없는 행이 섞여 있으면 '선택한 N건 중 M건은 승인할 수 없습니다.' 안내가 표시되며, 승인취소는 본인이 승인한 마지막 단계만 가능합니다."]},{"id":"INS002-P1","name":"충포장 기록서 목록 - 기록서 상세(결재)","menu":"검사기록","sub":"충포장 기록서","kind":"pop","purpose":"목록에서 일련번호를 눌러 여는 기록서 상세 창입니다. 로그인 사용자의 기록서 권한과 결재 상태에 따라 조회·수정·관리자 수정·확인자 확인 모드 중 하나로 열리며, 창 제목에 '종류 (모드)'가 표시됩니다.","search":[],"buttons":["닫기","삭제","수정","완료","임시저장","저장"],"grids":[{"title":"작업 전 확인사항 / 기능 확인사항","cols":["구분","절차","작업자","확인자","비고"]}],"tabs":[],"steps":["수정 모드(본인이 작성 중인 기록서): 전체 항목을 편집하고 수정 또는 완료 버튼으로 저장합니다.","확인자 확인 모드(해당 작업장 확인자, 승인 전): 확인자 체크박스만 체크하고 임시저장 또는 완료(승인)합니다.","관리자 수정 모드(해당 작업장 관리자): 결재 상태와 관계없이 내용을 편집하고 저장 버튼으로 덮어씁니다.","그 외 사용자는 조회 모드로 열리며 내용만 확인하고 닫기 버튼으로 닫습니다."],"notes":["확인자는 작업자 체크가 된 항목만 체크할 수 있으며, 작성 내용이 미완성이면 '작성 내용(필수값/작업자 체크)이 완료되지 않아 승인할 수 없습니다.'가 표시됩니다.","관리자 저장 시 '관리자 권한으로 내용을 덮어쓰시겠습니까? 이전 내용은 복구할 수 없습니다.' 확인창이 표시되며 결재·작성자 정보는 유지됩니다."]},{"id":"INS003","name":"공정검사 기록서 작성","menu":"검사기록","sub":"공정검사 기록서","kind":"grid","purpose":"내 권한 작업장의 작업지시를 조회해 공정검사 기록서를 작성합니다. 작성 시 립스틱·리퀴드·파우더·마스카라·쿠션 중 기록서 종류를 선택합니다.","search":["작업일","개시일","진행상태","작업반","작업장","품목코드","품목명","지시번호"],"buttons":["초기화","검색"],"grids":[{"title":"작업지시 목록","cols":["지시번호","품목코드","지시수량","품명","실적작업장","진행상태","개시일","작성"]}],"tabs":[],"steps":["작업일 또는 개시일 기준을 선택해 기간을 지정하고 작업반을 선택합니다.","필요하면 진행상태·작업장·품목코드·품목명·지시번호를 입력하고 검색 버튼을 누릅니다.","작성할 행의 작성 아이콘을 누르면 기록서 목록 창이 열립니다.","기록서 목록 창에서 작성할 공정검사 종류의 작성 아이콘을 누르면 해당 기록서 입력 화면으로 전환됩니다."],"notes":["작업반은 필수이며 미선택 시 '작업반을 선택해주세요.'가 표시됩니다. 진행상태를 비우면 모든 상태가 조회됩니다.","작성 아이콘은 '작성자' 권한 보유자에게만 표시됩니다. 기록서 목록 창에서 이미 작성완료된 종류는 음영으로 표시됩니다."]},{"id":"INS003-P1","name":"공정검사 기록서 작성 - 기록서 입력","menu":"검사기록","sub":"공정검사 기록서","kind":"form","purpose":"선택한 종류(립스틱·리퀴드·파우더·마스카라·쿠션)의 공정검사 기록서를 입력합니다. 1. 공정검사 항목을 초·중·말 시기별 적합/부적합/N/A로 판정하고, 2. 내용량 검사에서 시기별 10차 측정값을 입력하면 평균·최대·최소가 계산됩니다.","search":[],"buttons":["입력초기화","이미지 추가","닫기","삭제","임시저장","완료"],"grids":[{"title":"1. 공정검사","cols":["구분","검사항목","검사방법","빈도","초","중","말"]},{"title":"2. 내용량 검사","cols":["검사시기","구분","1~10","평균","최대","최소","초기화"]}],"tabs":[],"steps":["상단에서 충포장 구분(충포장/포장/충전)을 선택하고 검사일, 라인명, LOT 1차, LOT 2차를 입력합니다. 검사자는 작성자로 자동 표시됩니다.","1. 공정검사 표에서 항목별로 초·중·말 판정을 입력합니다. 열 헤더의 일괄 선택 메뉴로 모두 O (적합)/모두 X (부적합)/모두 N/A/일괄 해제를 적용할 수 있습니다.","2. 내용량 검사에 표시용량·비 중·실충전량(g)과 초·중·말 시기별 측정값을 입력합니다. 파우더는 측정장비(Zwick/C type/A type/레오미터/기타)를 선택하고 경도와 실충전량을 하한~상한 범위로 입력합니다.","특이사항과 코딩/라벨 이미지(최대 5개)를 입력합니다.","임시저장으로 중간 저장하고 입력이 끝나면 완료 버튼으로 작성자 승인을 처리합니다."],"notes":["표시구분은 적합: O, 부적합: X, 관계없음: N/A이며 내용량 기준은 '표시용량의 100%이상'입니다. 첫 측정값을 입력하면 같은 시기의 빈 칸에 같은 값이 채워집니다.","임시저장 시에도 LOT 1차는 필수입니다. 입력초기화는 내용량 검사 값만 모두 지우며 되돌릴 수 없고, 행 단위 초기화는 실행 취소가 가능합니다."]},{"id":"INS004","name":"공정검사 기록서 목록","menu":"검사기록","sub":"공정검사 기록서","kind":"grid","purpose":"작성된 공정검사 기록서를 검사일·작업반·종류·승인상태로 조회하고 승인/승인취소와 출력을 처리합니다. 일련번호를 눌러 기록서를 열람하거나 권한에 따라 수정합니다.","search":["검사일","작업반","작업장","품목코드","품목명","지시번호","종류","승인상태"],"buttons":["초기화","승인","승인취소","검색"],"grids":[{"title":"기록서 목록","cols":["지시번호","품목코드","품목명","일련번호","생산수량","종류","검사일","담당자","확인자","책임자","출력"]}],"tabs":[],"steps":["검사일 기간과 작업반(필수)을 선택하고 종류·승인상태(미승인/승인) 등 조건을 지정한 뒤 검색합니다.","결재할 기록서를 체크하고 승인 또는 승인취소 버튼을 누릅니다.","일련번호를 눌러 기록서 상세 창에서 내용을 확인하거나, 본인이 작성 중인 기록서·관리자 권한 기록서를 수정합니다.","출력 아이콘으로 기록서 출력물을 새 창에서 엽니다."],"notes":["공정검사 기록서는 확인자 체크 단계가 없어 상세 창이 수정·관리자 수정·조회 모드로만 열리며, 결재는 목록의 승인 버튼으로 처리합니다.","체크박스는 본인이 승인 또는 승인취소할 수 있는 행에서만 활성화됩니다."]}];

ent cannot be restored.'; approval and writer info are kept.","구매담당":"Buyer","권한":"Role","권한 관리":"Role Management","권한 그룹":"Role group","권한 그룹별 메뉴 접근":"Menu Access by Role Group","권한 그룹을 등록·수정하고, 권한 그룹별로 각 화면(메뉴)에 대한 접근 허용 여부를 지정합니다. 여기서 허용된 메뉴만 좌측 메뉴에 표시되고 화면에 진입할 수 있습니다.":"Register and edit role groups and set, per group, access to each screen (menu). Only allowed menus appear on the left and can be opened.","권한그룹과 사용여부(사용/미사용)를 선택합니다. 신규 등록 시 권한그룹은 INIT 그룹이 기본 선택됩니다.":"Choose the role group and active flag (active/inactive). New users default to the INIT group.","권한명":"Role name","권한명은 대소문자·앞뒤 공백을 무시하고 중복 여부를 검사하며, 중복이면 '이미 존재하는 권한명입니다.'가 표시됩니다.":"Role names are checked for duplicates ignoring case and surrounding spaces; duplicates show 'This role name already exists.'","권한이 선택되지 않은 배정 사용자가 있으면 저장이 차단되고 '권한이 선택되지 않은 사용자가 있습니다: …. 해당 사용자의 권한을 선택해 주세요.' 안내가 표시됩니다.":"If an assigned user has no role selected, saving is blocked with 'Some users have no role selected: …. Please select their roles.'","그 외 사용자는 조회 모드로 열리며 내용만 확인하고 닫기 버튼으로 닫습니다.":"Other users open it in view mode, only check the content and close it.","금속검출기 작동 확인":"Metal detector function check","금일 공장별 진척 현황":"Today's Progress by Plant","금일 생산수량":"Today's output","금일 양품수량":"Today's good qty","기간 단위 평균":"Period average","기간 유형(일/주/월/년)과 기간을 지정하고 작업반을 선택합니다(기본값: 전체 작업반, 전일).":"Set period type (day/week/month/year) and period, then choose a team (default: all teams, yesterday).","기간 유형과 기간(기본: 전일), 작업반(기본: 전체 작업반)을 선택합니다.":"Choose period type and period (default: yesterday) and team (default: all teams).","기간 유형이 일·주이면 일별, 월이면 주차별, 년이면 월별로 추이가 묶입니다.":"Trends are grouped by day for day/week, by week for month and by month for year.","기간 합계":"Period total","기간FROM":"Period FROM","기간은 매월 1일부터 조회 가능하며 YYYYMM 형식으로 지정합니다.":"The period can be queried from the 1st of each month in YYYYMM format.","기간을 지정하고 사용자(로그인ID 또는 사용자명)와 메뉴를 필요에 따라 선택합니다.":"Set the period and optionally choose a user (login ID or name) and m
